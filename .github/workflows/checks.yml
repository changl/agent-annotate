name: Checks and stable release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,browser,mcp]' build
      - run: python -m playwright install --with-deps chromium
      - run: sudo install -d -m 755 -o "$USER" '/Applications/Google Chrome.app/Contents/MacOS'
      - name: Use sandboxed Chromium for browser tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runner:
              Path('/Applications/Google Chrome.app/Contents/MacOS/Google Chrome').symlink_to(runner.chromium.executable_path)
          PY
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - name: Validate stable release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          tag = os.environ['TAG_NAME']
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) and tag == 'v' + version
          PY
      - name: Stamp release build identity
        env:
          BUILD_ID: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          Path('src/agent_annotate/_build.json').write_text(json.dumps({'build_id': os.environ['BUILD_ID'], 'tag': 'v' + version}))
          PY
      - run: python -m build
      - name: Write wheel checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          wheels = sorted(Path('dist').glob('*.whl'))
          Path('dist/SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in wheels))
          PY
      - name: Publish tested stable wheel
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          tag = 'v' + version
          existing = subprocess.run(['gh', 'release', 'view', tag], capture_output=True, text=True)
          if existing.returncode == 0:
              print(f'{tag} already published; bump version to publish the next immutable release.')
          else:
              ref = subprocess.run(['gh', 'api', f'repos/{os.environ["REPOSITORY"]}/commits/{tag}'], capture_output=True, text=True)
              if ref.returncode == 0:
                  assert json.loads(ref.stdout)['sha'] == os.environ['BUILD_ID'], 'Existing tag points at another build'
              assets = [str(p) for p in Path('dist').glob('*.whl')] + ['dist/SHA256SUMS']
              subprocess.run(['gh', 'release', 'create', tag, *assets, '--target', os.environ['BUILD_ID'], '--generate-notes'], check=True)
          PY
    permissions:
      contents: write
