<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The letter</title>
<style>
:root{
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ph:48px;
}
/* Two hands on one page: the counterpart writes in black type, the person answers in blue ink.
   Grey pencil is what goes ahead if he says nothing. Red appears in one place only: the thing that cannot wait. */
html[data-theme=light]{
  --desk:#d9d5ca; --wall:radial-gradient(120% 70% at 50% -10%,#fbf4e2 0%,rgba(251,244,226,0) 62%),linear-gradient(165deg,#e8e2d5,#cdd3d6);
  --paper:#faf7f0; --paper2:#f1ede3; --text:#1d1c1a; --soft:#57534b; --faint:#8b867b; --rule:#ddd7c9;
  --ink:#2340b8; --wash:#e7ebf9; --onink:#fff; --pencil:#66625a;
  --alarm:#a3271a; --awash:#f8e6e1; --onalarm:#fff;
  --glass:rgba(255,255,255,.5); --gedge:rgba(255,255,255,.8);
  --thing:#fff; --shadow:0 1px 2px rgba(40,30,10,.08),0 14px 40px rgba(40,30,10,.13); --veil:rgba(217,213,202,.9);
}
html[data-theme=dark]{
  --desk:#0e0e0d; --wall:radial-gradient(120% 70% at 50% 112%,#2b2219 0%,rgba(43,34,25,0) 62%),linear-gradient(165deg,#1a1b1d,#0b0c0e);
  --paper:#1c1b19; --paper2:#252320; --text:#ebe5d9; --soft:#aea89c; --faint:#7f796e; --rule:#37342f;
  --ink:#a9bcff; --wash:#222943; --onink:#10121c; --pencil:#a39d91;
  --alarm:#ff9a82; --awash:#3b201b; --onalarm:#1c0d09;
  --glass:rgba(255,255,255,.06); --gedge:rgba(255,255,255,.11);
  --thing:#e6e1d5; --shadow:0 0 0 1px #34312c; --veil:rgba(8,8,8,.82);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.52 var(--serif);color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
p{margin:0 0 10px}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:8px}
[inert]{pointer-events:none}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lab,.runin,.kick{font:600 11.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.his{color:var(--ink);font-style:italic}
.unless{color:var(--pencil);font-style:italic;font-size:16px}
.small{font-size:14px}

/* ---------- the device ---------- */
#stage{position:fixed;inset:0 0 var(--ph) 0;overflow:hidden;background:var(--wall)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:52px 16px 18px}
.ghost{display:none}
.clock{text-align:center;font-family:var(--sans)}
.date{font-size:17px;font-weight:500}
.time{font-size:88px;font-weight:300;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:22px}
.corner{flex:1;width:100%;max-width:372px;display:flex;flex-direction:column;gap:10px;min-height:0}

/* the glance: the face of silence */
.glance{display:flex;align-items:stretch;border-radius:22px;background:var(--glass);border:1px solid var(--gedge);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.gmain{flex:1;display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:76px;border-radius:22px}
.gt{display:flex;flex-direction:column;gap:1px}
.gt b{font:600 19px/1.25 var(--serif)}
.gt span{font:400 14.5px/1.35 var(--sans);color:var(--soft)}
.gt small{font:400 14.5px/1.35 var(--sans);color:var(--soft)}
.gi{width:26px;display:grid;place-items:center;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:block}
.glance.letter{background:var(--paper);border-color:transparent;box-shadow:var(--shadow)}
.glance.letter .gi{color:var(--ink)}
.glance.alarm .dot{background:var(--alarm)}
.ghear{width:56px;display:grid;place-items:center;border-left:1px solid var(--rule);color:var(--ink);border-radius:0 22px 22px 0}

.slip{border-radius:22px;padding:16px 18px;background:var(--paper);box-shadow:var(--shadow)}
.slip p{font-size:17px}
.slip.alarm{box-shadow:0 0 0 2px var(--alarm),var(--shadow)}
.slip.alarm .lab{color:var(--alarm)}
.slip .lab{margin-bottom:6px}

.say{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.say button{width:68px;height:68px;border-radius:50%;background:var(--glass);border:1px solid var(--gedge);display:grid;place-items:center;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.say button .ic{width:28px;height:28px}
.say span{font:13.5px var(--sans);color:var(--text)}
.say.on button{background:var(--ink);color:var(--onink);border-color:transparent;animation:pulse 1.1s ease-in-out infinite}

/* ---------- buttons are places to make a mark ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:600 16px/1.2 var(--sans);border:1.5px solid var(--ink);color:var(--ink);background:transparent;text-align:center}
.btn.pri{background:var(--ink);color:var(--onink)}
.btn.quiet{border-color:transparent;color:var(--soft);font-weight:500;padding:0 12px}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.alarm{background:var(--alarm);border-color:var(--alarm);color:var(--onalarm)}
.btn .ic{width:19px;height:19px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.type{display:flex;gap:8px;flex:1 1 220px;min-width:0}
.type input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1.5px solid var(--faint);background:transparent;padding:0 16px;font:16px var(--sans)}
.type input::placeholder{color:var(--soft);opacity:1}

/* ---------- the letter ---------- */
.wrap{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.sheet{max-width:640px;margin:0 auto;padding:10px 20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.tr{display:flex;gap:2px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.lead{font-size:22px;line-height:1.36;margin:10px 0 4px;text-wrap:pretty}
.told{margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.told .lab{margin-bottom:6px}
.item{position:relative;border-top:1px solid var(--rule);margin-top:22px;padding-top:6px;scroll-margin-top:8px}
.item.folded,.item.done{margin-top:12px}
.item.lit{border-top-color:var(--ink)}
.hd{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.side{min-height:44px;padding:0 0 0 14px;font:500 14px var(--sans);color:var(--soft);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.kick .n{font-family:var(--serif);font-weight:400;font-size:15px;margin-right:.6em;color:var(--text);letter-spacing:0}
.item h2,.fold .h{font:600 25px/1.2 var(--serif);margin:0 0 12px;text-wrap:balance}
.item h2 small,.fold .h small{font:italic 400 17px var(--serif);color:var(--soft)}
.item.done h2{font-size:19px;font-weight:500;color:var(--soft);margin-bottom:6px}
/* a letter folds: one thing lies open, the rest wait as a line each */
.fold{display:block;width:100%;position:relative;padding:12px 30px 8px 0;border-radius:6px}
.fold .kick{display:block}
.fold .h{display:block;font-size:20px;margin:5px 0 2px}
.fold .gist{display:block;font-size:16px;line-height:1.4;color:var(--soft)}
.fold .gist.unless{color:var(--pencil)}
.fold>.ic{position:absolute;right:0;top:50%;margin-top:-11px;color:var(--soft)}
.runin{margin-right:.7em}
.ln .runin{display:block;margin:4px 0 2px}
.ln ol{margin:0 0 4px;padding-left:1.35em}
.said .when{font:13px var(--sans);color:var(--soft);white-space:nowrap}
.q{font-size:19px;line-height:1.4}
.inkline{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-style:italic;margin:0 0 4px}
.inkline .ic{stroke-width:2.4;margin-top:1px}
.ask{border-left:2.5px solid var(--ink);padding:2px 0 2px 14px;margin:12px 0 0}
.ps{margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule)}

/* touch a line to mark it */
.mk{cursor:pointer;border-radius:6px;padding:3px 6px;margin-left:-6px;margin-right:-6px;transition:background .15s;position:relative}
li>.mk{display:block;padding-top:9px;padding-bottom:9px}
.mk:hover,.mk.on{background:var(--wash)}
.mk.cut{text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:2px;color:var(--soft)}
.mk.noted{box-shadow:inset 3px 0 0 var(--ink);padding-left:12px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font:italic 16px/1.4 var(--serif);margin:0 0 10px}
.note .ic{width:18px;height:18px;margin-top:2px}
.note .side{margin:-11px 0 -11px auto;font-style:normal;padding:0 0 0 10px}
.gen{margin:10px 0 0}
.note b{font:600 12px/20px var(--sans);font-style:normal;min-width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--onink);text-align:center}
.panel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px solid var(--ink);border-radius:18px;padding:10px;margin:4px 0 12px;background:var(--paper)}

/* options: printed on the page, one already circled in pencil */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.opt{min-height:52px;padding:2px 0;border-radius:14px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ol{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;padding:5px 20px;border:1px solid var(--faint);border-radius:48% 52% 55% 45%/58% 64% 36% 42%;font:600 16px/1.2 var(--sans)}
.ol em{font:italic 400 12.5px var(--serif);color:var(--pencil)}
.opt.pencil .ol{border:1.5px dashed var(--pencil)}
.opt.inked .ol{border:2.5px solid var(--ink);color:var(--ink);transform:rotate(-1.5deg)}
.opt.inked .ol em{color:var(--ink)}
.opts.draw{display:grid;grid-template-columns:1fr 1fr}
.opts.draw .opt{border:1px solid var(--faint);padding:8px 8px 10px}
.opts.draw .ol{min-height:40px}
.mini{display:flex;gap:6px;align-items:flex-end;width:100%;padding:10px 8px 8px;border-radius:8px;background:var(--paper2)}
.mini i{flex:1;font:600 12px/1.2 var(--sans);font-style:normal;text-align:center;padding:8px 2px;border-radius:6px;border:1px solid var(--rule);color:var(--soft)}
.mini i.big{flex:1.5;padding:14px 2px;border:1.5px solid var(--text);color:var(--text);font-size:14px;background:var(--paper)}
.mini small{display:block;font-weight:400;font-size:11px}
.fork{margin:14px 0 4px}
.fork .of{font:600 13px var(--sans);color:var(--soft)}
.fork .q{font-size:17px;margin-bottom:4px}

details{margin:0 0 10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font:500 15px var(--sans);color:var(--soft);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details[open]>summary::before{transform:rotate(45deg)}
details ul,details ol{margin:0 0 6px;padding-left:1.3em;font-size:16px}

.foot{border-top:1px solid var(--rule);margin-top:30px;padding-top:18px}
.end{font-size:22px;line-height:1.35;margin-bottom:4px}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.link{min-height:44px;display:inline-flex;align-items:center;font:500 15px var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.keys{display:none}

/* ---------- the enclosure: the thing itself, in its own colours ---------- */
.peek{display:flex;width:100%;align-items:center;gap:12px;margin:4px 0 12px;padding:12px 14px;border-radius:10px;background:var(--thing);color:#1b1b1b;box-shadow:var(--shadow);font:14px/1.4 var(--sans)}
.peek b{display:block;font-size:15px}
.peek span{color:#57534b}
.peek .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:15px;color:#2340b8}
.thing{position:absolute;inset:0;overflow:auto;background:var(--desk);padding:0 12px}
.wrap.has-thing>.sheet{display:none}
.tbar{display:flex;align-items:center;min-height:52px;margin:0 -4px}
.thing h3{font:600 22px/1.2 var(--serif);margin:0 4px 2px}
.thing h3 small{font:italic 400 16px var(--serif);color:var(--soft)}
.hint{font:14.5px var(--sans);color:var(--soft);margin:0 4px 10px}
.obj{--ink:#2340b8;--wash:#e7ebf9;--onink:#fff;--soft:#57534b;--pencil:#66625a;--rule:#dedad0;--paper:#fff;--paper2:#f4f2ec;--text:#1b1b1b;
  background:var(--thing);color:#1b1b1b;border-radius:10px;padding:16px 14px;box-shadow:var(--shadow);font:15px/1.5 var(--sans)}
.thing .obj{padding:14px 11px}
html[data-theme=dark] .obj{--rule:#cbc5b6;--paper2:#d9d3c5}
.obj.inline{margin:6px 0 12px}
.obj p{margin:0 0 8px}
.tfoot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 4px 14px;margin-top:12px;background:var(--desk);border-top:1px solid var(--rule)}
.file{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--soft)}
.file b{font:600 13.5px var(--mono);color:#1b1b1b}
.csv{width:100%;border-collapse:collapse;table-layout:fixed;font:12.5px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.csv th:nth-child(1){width:13%}.csv th:nth-child(2){width:26%}.csv th:nth-child(3){width:21%}.csv th:nth-child(4){width:19%}.csv th:nth-child(5){width:21%}
.csv th{font-weight:600;text-align:left;color:var(--soft);font-size:12px;padding:10px 3px 6px}
.csv td{padding:0 3px;height:44px;border-top:1px solid var(--rule);vertical-align:middle}
.csv td:first-child{white-space:nowrap;color:var(--soft)}
.csv .r{text-align:right;white-space:nowrap}
.csv tr.mk{display:table-row}
.csv tr.sum td{font-weight:650;font-size:12px;border-top:2px solid #1b1b1b;color:#1b1b1b}
.csv tr.more td{color:var(--soft);font-style:italic}
.csv tr.new td{background:var(--wash)}
.csv tr.aux td{height:auto;border-top:0;padding:0 4px}
.csv tr.cut td{text-decoration:line-through;text-decoration-color:var(--ink);color:var(--soft)}
.pinno{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--pencil);font:600 11px var(--sans);color:var(--pencil);vertical-align:1px}
.mail-h{font-size:13px;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.mail-h b{color:#1b1b1b;font-weight:600}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:start;padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.pair:first-child{border-top:0}
.pair s{color:var(--soft)}
.pair b{font-weight:600}
.figs{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.fig b{display:block;font:600 30px/1.1 var(--serif)}
.fig span{font-size:13px;color:var(--soft)}
.fig.was b{color:var(--soft);font-weight:400;text-decoration:line-through;text-decoration-thickness:1.5px}
.pins{position:relative;cursor:crosshair}
.pindot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--ink);color:var(--onink);font:700 13px/26px var(--sans);text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.pindot::after{content:"";position:absolute;inset:-9px}
.sk{width:230px;max-width:100%;margin:4px auto 6px;padding:18px 16px 16px;border:1.5px dashed #8b867b;border-radius:26px;text-align:center;font:14px/1.4 var(--sans);color:#3d3a35}
.sk .t{font-size:12px;color:#66625a}
.sk .h{font:600 17px/1.3 var(--sans);margin:10px 0 12px}
.sk .stars{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.sk .stars svg{width:30px;height:30px;fill:none;stroke:#66625a;stroke-width:1.5;stroke-dasharray:3 2}
.sk .box{border:1.5px dashed #8b867b;border-radius:10px;padding:14px 8px;color:#66625a;font-size:13px;margin-bottom:12px}
.sk .go{border:1.5px dashed #3d3a35;border-radius:999px;padding:9px;font-weight:600;margin-bottom:8px}
.walk{display:flex;gap:10px;justify-content:center}
.walk .sk{width:auto;flex:1;min-width:0;margin:0;padding:12px 6px;border-radius:14px;font-size:12px}
.walk .sk .h{font-size:13px;margin:6px 0 8px}
.walk .sk .box,.walk .sk .go{padding:6px 2px;font-size:11.5px;margin-bottom:6px}

/* ---------- read aloud ---------- */
.voice{position:absolute;inset:0;overflow:auto;background:var(--paper);padding:10px 22px 32px;display:flex;flex-direction:column}
.bars{display:flex;gap:5px;align-items:center;height:36px;margin:22px 0 14px}
.bars i{width:5px;border-radius:3px;background:var(--ink);height:12px;animation:bar 1.2s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}
.spoken{font-size:25px;line-height:1.38;text-wrap:pretty;margin-bottom:22px}
.ears{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.ears .btn{min-height:60px;font:italic 600 19px var(--serif)}
.vlog{margin-top:16px}

/* ---------- the glance unfolded, the week, behind ---------- */
.rows{margin:0;padding:0;list-style:none}
.rows li{display:flex;flex-direction:column;padding:11px 0;border-top:1px solid var(--rule)}
.rows b{font:600 18px/1.3 var(--serif)}
.rows span{font:14.5px/1.4 var(--sans);color:var(--soft)}
.grp{margin:22px 0 2px}
.big{font:600 30px/1.2 var(--serif);margin:8px 0 2px;text-wrap:balance}
.led{font-size:19px;line-height:1.45;margin:0 0 6px}
.led b{font-weight:600}
.ledger details{border-top:1px solid var(--rule);margin:0}
.ledger summary{font:400 18px/1.4 var(--serif);color:var(--text);padding:9px 0;min-height:48px}
.ledger details>:not(summary){font-size:16px;color:var(--soft);padding-left:21px}
.ledger details>ol{padding-left:42px}
.ledger details>p:last-child,.ledger details>ol:last-child{padding-bottom:10px}

/* ---------- the desk: a corner of the screen, and a sheet beside the thing ---------- */
@media (min-width:1040px){
  body{font-size:18px;line-height:1.56}
  .lock{display:block;padding:0}
  .ghost{display:block;position:absolute;left:5%;top:12%;width:50%;height:70%;border-radius:12px;background:var(--glass);border:1px solid var(--gedge);padding:34px 30px;color:var(--text)}
  .ghost i{display:block;height:10px;border-radius:5px;background:currentColor;opacity:.09;margin-bottom:16px}
  .clock{position:absolute;left:24px;top:16px;display:flex;gap:10px;align-items:baseline}
  .date,.time{font-size:14px;font-weight:500;line-height:1.4;margin:0;letter-spacing:0}
  .corner{position:absolute;right:20px;top:14px;width:348px;max-width:none}
  .gmain{min-height:64px}
  .say{flex-direction:row-reverse;justify-content:flex-start;margin-top:0;padding-top:0}
  .say button{width:46px;height:46px}
  .say button .ic{width:22px;height:22px}
  .wrap{display:flex;flex-direction:row-reverse;justify-content:flex-start;align-items:flex-start;gap:20px;padding:14px 20px 20px;overflow:hidden;background:transparent;pointer-events:none}
  .wrap>*{pointer-events:auto}
  .sheet{flex:0 0 600px;min-width:0;max-width:none;max-height:100%;overflow:auto;margin:0;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);padding:20px 44px 48px 128px}
  .wrap.has-thing>.sheet{display:block}
  .thing{position:static;flex:0 1 620px;min-width:0;max-height:100%;border-radius:10px;background:var(--desk);box-shadow:var(--shadow);padding:6px 20px 0}
  .lock[inert] .corner{visibility:hidden}

  .thing h3{margin-top:14px}
  .tfoot{display:none}
  .lead{font-size:25px;margin-top:14px}
  .item{margin-top:32px;padding-top:20px}
  .kick .n{position:absolute;left:-96px;top:8px;width:84px;text-align:right;margin:0;font:300 46px/1 var(--serif);color:var(--faint)}
  .item.lit .kick .n{color:var(--ink)}
  .item p,.item .ln{position:relative}

  .voice{left:auto;right:20px;top:14px;bottom:20px;width:520px;border-radius:6px;box-shadow:var(--shadow);padding:20px 44px 40px}
  .keys{display:block;font:13px var(--sans);color:var(--soft);margin-top:18px}
  .keys kbd{font:600 12px var(--mono);border:1px solid var(--rule);border-radius:5px;padding:1px 6px}
}

/* ---------- prototype control: not part of the design ---------- */
#proto{position:fixed;left:0;right:0;bottom:0;height:var(--ph);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9;
  font:12px var(--mono);color:#e9e9e9;background:repeating-linear-gradient(135deg,#26262a 0 10px,#2e2e33 10px 20px);border-top:2px dashed #8d8d96}
#proto .tag{display:none;white-space:nowrap;color:#c9c9d2}
#proto button,#proto select{min-height:36px;min-width:40px;padding:0 8px;border:1px solid #6d6d76;border-radius:4px;background:#17171a;color:#f0f0f0;font:12px var(--mono);text-align:center}
#proto select{flex:1;min-width:0;text-overflow:ellipsis}
#proto :focus-visible{outline:2px solid #fff;outline-offset:1px}
#pnote{position:fixed;left:8px;right:8px;bottom:calc(var(--ph) + 8px);z-index:9;padding:12px 14px;border:2px dashed #8d8d96;border-radius:6px;background:#1c1c20;color:#eee;font:12.5px/1.5 var(--mono);max-width:720px}
#pnote b{color:#fff}
@media (min-width:1040px){#proto .tag{display:inline}#proto select{flex:0 1 420px}#pnote{left:auto;right:12px}}

/* only what has just appeared moves; everything else holds still */
.wrap.new,.voice.new,.slip.new,.thing.new{animation:rise .26s ease-out}
.inkline.new,.note.new,.ask.new,.ps.new,.panel.new,.opt.inked.new .ol{animation:ink .35s ease-out}
.inkline.new .ic path{stroke-dasharray:34;animation:draw .45s ease-out}
@keyframes draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(120,140,220,.18)}}
@keyframes bar{50%{height:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.still *{animation:none!important;transition:none!important}
</style>
</head>

}
const stage=$('#stage');
stage.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el||el.closest('[inert]')) return; if(el.dataset.act==='tele:signed'&&S.tele==='checking') return; act(el.dataset.act,el,e); });
stage.addEventListener('submit',e=>{ e.preventDefault(); form(e.target.dataset.form,e.target); });
stage.addEventListener('toggle',e=>{ if(e.target.dataset&&e.target.dataset.d) S.open[e.target.dataset.d]=e.target.open; },true);
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if(e.key==='Escape'){ if(S.panel){S.panel=null;return render();} if(S.park){S.park=null;return render();} if(S.thing&&!isDesk()) return act('thing-x'); if(S.view!=='lock') return act('close'); }
  if(typing||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='['||e.key===']') return setMoment(S.m+(e.key===']'?1:-1));
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){ e.preventDefault(); return e.target.click(); }
  if(S.view==='letter'&&e.key==='t'&&S.thing){ const inThing=!!document.activeElement.closest('.thing'), to=inThing?stage.querySelector('.item.lit .acts .btn'):stage.querySelector('.thing .mk, .thing .btn'); if(to) to.focus(); return; }
  if(S.view==='letter'&&(e.key==='j'||e.key==='k')){ const its=[...stage.querySelectorAll('.sheet .item')], cur=its.findIndex(x=>x.contains(document.activeElement)), nx=its[Math.max(0,Math.min(its.length-1,cur+(e.key==='j'?1:-1)))];
    if(nx){ const b=nx.querySelector('.acts .btn')||nx.querySelector('.peek,.opt,.fold,.side'); if(b){ b.focus(); nx.scrollIntoView({block:'nearest'}); } } }
});

/* ---------- prototype control ---------- */
$('#pm').innerHTML=M.map((m,i)=>`<option value="${i}">${i+1}/${M.length} · ${m.day.slice(0,3)} ${m.time} · ${m.title} (event ${m.ev})</option>`).join('');
$('#pm').onchange=e=>setMoment(+e.target.value);
$('#pv').onclick=()=>setMoment(S.m-1); $('#nx').onclick=()=>setMoment(S.m+1);
$('#pn').onclick=()=>{ const n=$('#pnote'); n.hidden=!n.hidden; $('#pn').setAttribute('aria-expanded',!n.hidden); };
function applyTheme(){ document.documentElement.dataset.theme=S.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme; $('#pt').textContent=S.theme; }
$('#pt').onclick=()=>{ S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme]; applyTheme(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
matchMedia('(min-width:1040px)').addEventListener('change',()=>{ autoThing(); render(); });

/* ---------- the week as he would walk it; used for screenshots and for the self-check ---------- */
const PATH={tue:['go:ratings','thing:invoice','accept:invoice','opt:price:0'],
 wed:['signitem:forks','thing:email','#cut:p2','#cut:p3','#say:p0','back:email','scope:email:always','go:remind','accept:photos'],
 thu:['thing:sketch','park:sketch','until:sketch:2','accept:email2','accept:wording','opt:trust:0'],
 mon:['thing:miss','accept:miss','thing:signup','accept:signup','accept:tests']};
function walk(k,upto){ S.letter=k; S.view='letter'; S.stack=['lock']; firstOpen(); (upto==null?PATH[k]:PATH[k].slice(0,upto)).forEach(a=>{
  if(a[0]==='#'){ const [c,key]=a.slice(1).split(':'), sc='t:email1'; if(c==='cut') marksOf(sc).push({k:key,kind:'cut'}); else marksOf(sc).push({k:key,kind:'note',text:'Too stiff. Write like a neighbour, not a bank.'}); }
  else act(a); }); }
// drives the real buttons in the order a person would press them, and counts the presses
function domWalk(k){
  let taps=0; const click=sel=>{ const el=stage.querySelector(sel); console.assert(el,'nothing to press: '+sel+' in '+k); if(el){ el.click(); taps++; } };
  setMoment(M.findIndex(m=>m.k===k)); click('[data-act="open-letter"]');
  for(const a of PATH[k]){
    if(a[0]==='#'){ const [c,key]=a.slice(1).split(':'); click(`.thing [data-k="${key}"]`); click(c==='cut'?'[data-act="cut"]':'[data-act="speak"]'); }
    else if(a.startsWith('thing:')){ if(!S.thing) click(`[data-fid="peek-${a.slice(6)}"]`); }
    else click(`[data-act="${a}"]`);
  }
  console.assert(L[k].items.every(isDone)&&stage.querySelector('#end'),'letter not finished by its path: '+k);
  return taps;
}
function selfCheck(){
  const out={}, words=h=>{ const d=document.createElement('div'); d.innerHTML=h; d.querySelectorAll('details>:not(summary),.keys,form').forEach(x=>x.remove()); return d.textContent.trim().split(/\s+/).filter(Boolean).length; };
  const evs=new Set(M.flatMap(m=>m.ev.split(',').map(s=>+s))); out.events=[...Array(14)].map((_,i)=>i+1).filter(n=>!evs.has(n)); console.assert(!out.events.length,'events missing',out.events);
  out.read={}; out.taps={};
  for(const k of ['tue','wed','thu','mon']){ S.m=M.findIndex(m=>m.k===k); S.letter=k; S.cur=null;
    // every word of the letter with each thing unfolded once (the folded one-line gists are not counted twice)
    out.read[k]=words(letterHTML())+L[k].items.reduce((s,it)=>s+words(bodyHTML(it)+actsHTML(it))-words(it.gist),0);
    L[k].items.forEach(it=>{ if(it.thing){ console.assert(TH[it.thing],'no thing',it.thing); out.read['thing:'+it.thing]=words(TH[it.thing].html('x:'+it.thing)); } });
    out.taps[k]=domWalk(k); }
  out.sentBack=S.ans.email&&S.ans.email.a==='back'&&S.ans.email.scope==='always'&&marksOf('t:email1').length===3; console.assert(out.sentBack,'send-back');
  out.parked=S.ans.sketch&&S.ans.sketch.until; out.trust=S.ans.trust&&S.ans.trust.v===0; console.assert(out.parked==='Faster sign-up is done'&&out.trust,'thursday');
  S.m=4; out.read.telegram=words(slipHTML()); out.read.week=words(weekHTML()); out.read.behind=words(behindHTML()); S.m=9; out.read.standing=words(standingHTML());
  out.minutes=['tue','wed','thu','mon'].map(k=>L[k].items.reduce((s,it)=>s+it.min,0));
  out.goals=standing().length; out.done=standing().filter(g=>g.grp==='D').length; console.assert(out.goals===11&&out.done===7,'eleven goals stand at the end, seven of them done, as the week page says');
  document.body.insertAdjacentHTML('beforeend',`<pre id="check">${JSON.stringify(out)}</pre>`); return out;
}

// the paths the week does not take: voice, the buzz, saying it, a pointed mark, a whole-thing remark, the keys
async function smoke(){
  const errs=[], ok=(c,m)=>{ if(!c) errs.push(m); }, wait=ms=>new Promise(r=>setTimeout(r,ms));
  window.onerror=m=>{ errs.push('error: '+m); };
  const click=sel=>{ const el=stage.querySelector(sel); ok(el,'nothing to press: '+sel); if(el) el.click(); }, key=k=>document.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true}));
  const fresh=m=>{ Object.assign(S,{ans:{},marks:{},said:[],tele:null,heard:null}); setMoment(m); };
  fresh(1); click('[data-act="say"]'); await wait(1700); ok(S.heard&&/reminder/.test(S.heard.text),'saying it is heard'); click('[data-act="note-letter"]'); click('[data-act="go:remind"]'); ok(S.ans.remind,'said back now, and agreed');
  fresh(4); click('[data-act="tele:signed"]'); await wait(1100); ok(S.tele==='signed','the one buzz is answered in one press'); ok(glance().kind==='quiet','silence returns after it');
  fresh(0); click('[data-act="hear"]'); click('[data-v="next"]'); click('[data-v="go:ratings"]'); click('[data-v="next"]'); click('[data-v="opt:price:0"]'); ok(S.ans.ratings&&S.ans.price&&!S.ans.invoice,'by voice: two answered, the one for the eyes kept'); click('.voice .btn'); ok(S.view==='lock'&&glance().kind==='letter','the letter still waits for his eyes');
  fresh(3); click('[data-act="open-letter"]'); click('[data-act="cur:email"]'); if(!S.thing) click('[data-fid="peek-email"]'); click('[data-act="gen-add"]'); click('[data-act="speak"]'); ok(marksOf('t:email1').length===1,'a remark about the whole thing'); click('[data-act="back:email"]'); click('[data-act="scope:email:here"]'); ok(S.ans.email.scope==='here','here only');
  click('[data-act="take:email"]'); ok(!S.ans.email&&S.cur==='email','taken back');
  fresh(5); click('[data-act="open-letter"]'); if(!S.thing) click('[data-fid="peek-sketch"]'); const pins=stage.querySelector('.pins'), r=pins.getBoundingClientRect(); pins.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:r.left+r.width/2,clientY:r.top+r.height/3})); click('[data-act="speak"]'); ok(marksOf('t:ratings').some(m=>m.kind==='pin'&&m.text),'a pointed mark on a picture, with words');
  ['j','k','t','t','Escape','Escape','Escape'].forEach(key); ok(S.view==='lock','Esc puts the letter down');
  click('[data-act="open-letter"]'); click('[data-act="standing"]'); click('[data-act="behind"]'); key('Escape'); key('Escape'); key('Escape'); ok(S.view==='lock','back out of behind');
  key(']'); ok(S.m===6,'next moment');
  document.body.insertAdjacentHTML('beforeend',`<pre id="smoke">${errs.length?esc(JSON.stringify(errs)):'smoke ok'}</pre>`);
}

/* ---------- start (the hash is only for looking at one state: #m=3&v=letter&t=dark&d=marks) ---------- */
(function(){
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('t')) S.theme=q.get('t'); applyTheme(); if(q.has('still')) document.documentElement.classList.add('still');
  if(q.has('check')){ selfCheck(); smoke(); return; }
  setMoment(+(q.get('m')||0));
  const mo=M[S.m], d=q.get('d'), v=q.get('v');
  if(d==='heard') S.heard={text:mo.script,m:S.m};
  if(d==='signed') S.tele='signed';
  if(mo.letter&&d){ const n={done:null,marks:5,ask:6,park:2,ps:5}[d]; if(n!==undefined) walk(mo.letter,n); if(d==='marks'){ S.thing={id:'email1',item:'email'}; } }
  if(v==='letter'&&S.view==='lock') act('open-letter'); else if(v==='voice') act('hear'); else if(v&&v!=='letter'&&v!=='lock') { S.view='lock'; S.stack=[]; act(v); }
  if(q.get('th')){ const it=L[S.letter].items.find(x=>x.thing===q.get('th')); if(it){ S.thing={id:it.thing,item:it.id}; S.cur=it.id; } }
  if(q.get('cur')){ S.cur=q.get('cur'); autoThing(); }
  (q.get('a')||'').split(',').filter(Boolean).forEach(x=>{ const [id,v]=x.split(':'); S.ans[id]={a:'opt',v:+v,by:'you'}; });
  (q.get('o')||'').split(',').filter(Boolean).forEach(id=>S.open[id]=true);
  (q.get('ans')||'').split(',').filter(Boolean).forEach(x=>{ const [id,v]=x.split(':'); S.ans[id]={a:v}; if(S.cur===id) firstOpen(); });
  if(q.get('pan')){ const [sc,k]=q.get('pan').split('|'); S.panel={sc,k,gen:k==='gen'}; }
  if(q.has('listen')) S.listening=true; if(q.has('typing')) S.typing=true;
  if(d==='pin'){ marksOf('t:ratings').push({k:'pin1',kind:'pin',x:50,y:38,text:'The stars are too small for a thumb.'}); S.thing={id:'ratings',item:'sketch'}; S.cur='sketch'; }
  if(q.get('vi')&&S.voice) S.voice.i=+q.get('vi');
  if(q.get('note')) $('#pnote').hidden=false; if(q.has('nonote')) $('#pnote').hidden=true;
  render();
})();
</script>
