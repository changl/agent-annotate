<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>One true picture · prototype</title>
<style>
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Charter","Georgia",serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
/* Light: warm paper by day. Red ink (rubric) is used for one thing only: what is with him. */
html[data-theme=light]{
  --desk:#E9E2D4;--paper:#FBF8F2;--paper2:#FFFFFF;--ink:#1D1B18;--ink2:#5E584F;--ink3:#B4AC9F;
  --rule:#E4DCCE;--rule2:#CDC3B2;--rubric:#A0301C;--wash:#F6E5DD;--hover:#F2ECE1;
  --btn:#1D1B18;--btnt:#FBF8F2;--shadow:0 1px 2px rgba(70,50,20,.06),0 12px 36px rgba(70,50,20,.09);
  --gutter:linear-gradient(90deg,rgba(80,60,30,.07),transparent 28px);
}
/* Dark: blue-black night paper, softer ink, fewer lines; the red becomes a warm coral wash. */
html[data-theme=dark]{
  --desk:#0B0C0F;--paper:#15171B;--paper2:#1C1F24;--ink:#E8E2D6;--ink2:#A29B8F;--ink3:#3E4044;
  --rule:#24282E;--rule2:#3A3F47;--rubric:#EE8A6D;--wash:#2A1D19;--hover:#1D2025;
  --btn:#E8E2D6;--btnt:#15171B;--shadow:none;
  --gutter:linear-gradient(90deg,rgba(0,0,0,.45),transparent 28px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
html[data-theme=dark] body{-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- prototype strip: NOT part of the design ---------- */
.proto{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;padding:4px 8px 5px;
  font:11px/1.3 var(--mono);color:#3A3214;background:repeating-linear-gradient(-45deg,#F4E7B0 0 8px,#EDDB98 8px 16px);border-bottom:1px dashed #8A7733}
html[data-theme=dark] .proto{color:#EADFAE;background:repeating-linear-gradient(-45deg,#2D2812 0 8px,#25210D 8px 16px);border-color:#6E6026}
.proto .tag{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.proto button,.proto select{min-height:28px;padding:0 7px;border:1px solid currentColor;border-radius:3px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.proto select{max-width:10.5em}
.proto select option{color:#000;background:#fff}
.proto .nar{flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proto .nar:hover,.proto .nar:focus{-webkit-line-clamp:unset}
@media (max-width:899px){.proto .tag{display:none}}

/* ---------- the page ---------- */
.spread{max-width:600px;margin:0 auto}
.page.pic{position:relative;padding:4px 20px 150px 30px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;
  font:600 11.5px/1.2 var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.lede{font:600 23px/1.24 var(--sans);letter-spacing:-.012em;margin:10px 0 6px}
html[data-theme=dark] .lede{font-weight:500}
.lede .red{color:var(--rubric)}
.sub{margin:0;color:var(--ink2);font-size:15.5px;line-height:1.45}
.sub + .sub{margin-top:4px}
.his{font-family:var(--serif)}
.sub .nx{color:var(--ink);font-weight:600}
.sub .his{color:var(--ink);font-style:italic}
.start{display:flex;align-items:center;gap:14px}
.start .b{flex:none}
.start + .sub{margin-top:8px}

.toc{margin-top:14px}
.sec{display:flex;align-items:center;gap:10px;margin:16px 0 0;height:22px;
  font:600 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.sec::after{content:"";flex:1;height:1px;background:var(--rule)}
html[data-theme=dark] .sec::after{display:none}
.item{position:relative;scroll-margin-top:70px}
.row{display:flex;align-items:last baseline;width:100%;min-height:44px;padding:11px 0 7px;margin:0;border:0;background:none;text-align:left;cursor:pointer}
.row .w{font:17.5px/1.3 var(--serif)}
.row .ld{flex:1 1 14px;min-width:14px;margin:0 8px;border-bottom:2px dotted var(--ink3);transform:translateY(-5px)}
.row .when{flex:none;font:500 14.5px/1.3 var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .when s{color:var(--ink2);margin-right:7px;text-decoration-thickness:1.5px}
.item.s-w .when,.item.s-u .when{color:var(--rubric);font-weight:600}
.item.s-w::before,.item.s-u::before{content:"";position:absolute;left:-16px;top:13px;width:3px;height:21px;border-radius:2px;background:var(--rubric)}
html[data-theme=dark] .item.s-w .row,html[data-theme=dark] .item.s-u .row{background:linear-gradient(90deg,var(--wash),transparent 85%)}
.item.s-p .w{font-style:italic;color:var(--ink2)}
.item.s-p .when,.item.s-d .w,.item.s-d .when{color:var(--ink2)}
.item.open .row .w{text-decoration:underline;text-decoration-color:var(--rubric);text-decoration-thickness:2px;text-underline-offset:4px}
.note{position:relative;margin:-2px 0 8px;font:italic 14.5px/1.45 var(--sans);color:var(--ink2)}
.note::before{content:"";position:absolute;left:-15px;top:.55em;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.row:hover .w{text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:4px}
.foot{display:flex;gap:18px;margin-top:22px;padding-top:6px}
.lnk{min-height:44px;padding:0;border:0;background:none;color:var(--ink2);font:500 15px var(--sans);cursor:pointer;text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:4px}
.lnk:hover{color:var(--ink)}

/* things that need him, opened where they sit */
.panel{padding:4px 0 24px}
.anim{animation:in .24s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.flash .row{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{background:var(--wash)}100%{background:transparent}}
.new{animation:in .5s ease-out}

.kindrow{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 10px}
.kind{font:600 11.5px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--rubric)}
.kind.muted{color:var(--ink2)}
.mins{font-size:13.5px;color:var(--ink2)}
.th{margin:4px 0 18px}
.th h2{font:400 30px/1.15 var(--serif);margin:8px 0 4px;letter-spacing:-.005em}
.lead{margin:0 0 14px;font-size:16.5px;line-height:1.5}
.q{margin:0 0 6px;font:600 17px/1.4 var(--sans)}
.advice{margin:6px 0 2px}
.dflt{margin:2px 0 0;color:var(--ink2);font-size:15px}
.fine{margin:16px 0 0;color:var(--ink2);font-size:13.5px;line-height:1.45}
.said{margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--rule)}
.said q{display:block;font:italic 19px/1.4 var(--serif);quotes:"“" "”"}
.said .hint{display:block;margin-top:3px}
.lbl{display:block;font:600 11px/1.6 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.kv{margin:0 0 10px}
.kv .val{margin-top:1px}
.opt{display:block;width:100%;min-height:52px;margin:0 0 8px;padding:10px 14px;border:1px solid var(--rule2);border-radius:10px;background:var(--paper2);text-align:left;font:16px/1.4 var(--sans);cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .hint{font-size:14px}
@media (max-width:899px){.item.open::after{content:"";position:absolute;left:-15px;top:40px;bottom:16px;width:1px;background:var(--rubric);opacity:.55}}
.pt{display:block;width:calc(100% + 16px);min-height:44px;margin:0 -8px;padding:7px 8px;border:0;border-radius:6px;background:none;text-align:left;font:16px/1.5 var(--sans);color:inherit;cursor:pointer}
.pt:hover{background:var(--hover)}
.pt.marked{background:var(--wash);box-shadow:inset 3px 0 0 var(--rubric)}
.pt.on{box-shadow:inset 3px 0 0 var(--rubric)}
.pt .why{display:inline-block;margin-left:6px;font:600 13px var(--sans);color:var(--rubric);font-style:normal}
.pt.li{display:flex;gap:10px}
.pt .n{flex:none;width:18px;color:var(--ink2);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 12px}
.chips-q{flex-basis:100%;font-size:14px;color:var(--ink2)}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--rule2);background:var(--paper2);font:500 15px var(--sans);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.acts.sm{margin-top:10px}
.b{min-height:46px;padding:0 18px;border-radius:10px;border:1.5px solid var(--ink);background:none;font:600 16px var(--sans);cursor:pointer}
.b.pri{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.b:hover{filter:brightness(1.08)}
.hint{font-size:14px;color:var(--ink2)}
.answered{margin:8px 0 0;font-weight:600}
.answered .lnk{margin-left:8px;font-size:14px}
.mq{padding:12px 0 14px;border-top:1px solid var(--rule)}
.ctx{margin:0 0 6px;color:var(--ink2);font-size:15px}
.ul{margin:0 0 12px;padding-left:20px}
.ul li{margin:2px 0}
details.checks{margin:6px 0 12px}
details.checks summary{cursor:pointer;min-height:36px;display:flex;align-items:center;color:var(--ink2);font-size:15px}
details.checks ol{margin:4px 0 0;padding-left:22px;font-size:15px;color:var(--ink2)}

/* the things themselves */
.file{border:1px solid var(--rule2);border-radius:8px;background:var(--paper2);padding:6px 10px 4px;margin:0 0 12px;font-size:14px}
.file .hd,.file .trow{display:grid;grid-template-columns:4.2em 1fr 5.4em 3.8em;gap:8px;font-variant-numeric:tabular-nums}
.file .hd{font:600 11px/2.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--rule)}
.file .trow{font-size:14px;padding:6px 8px}
.file .trow .r{text-align:right}
.file .trow.hl{background:var(--wash)}
.file .ff{display:flex;justify-content:space-between;gap:8px;padding:6px 0 2px;border-top:1px solid var(--rule);margin-top:2px;color:var(--ink2);font-size:13px}
.file .ff .lnk{min-height:44px;font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.mini{border:1px solid var(--rule2);border-radius:10px;background:var(--paper2);padding:12px;display:flex;flex-direction:column;gap:2px}
.mini .cap{font:600 11px/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.mini .big{font:600 24px/1.2 var(--sans)}
.mini .big small{font-size:14px;font-weight:500}
.mini .small{font-size:13px;color:var(--ink2)}
.mail{border:1px solid var(--rule2);border-radius:10px;background:var(--paper2);padding:8px 10px 10px;margin:0 0 6px}
.mail .from{font-size:13px;color:var(--ink2);padding:2px 8px 6px;border-bottom:1px solid var(--rule);margin-bottom:4px}
.mail .pt{font-size:15px}
.mail .subj{font-weight:600}
.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.scr{border:1px solid var(--rule2);border-radius:12px;background:var(--paper2);padding:10px 8px;min-height:120px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.3}
.scr b{font-size:11px;color:var(--ink2)}
.scr i{display:block;height:16px;border-radius:4px;background:var(--hover);border:1px solid var(--rule)}
.scr em{margin-top:auto;font-style:normal;text-align:center;padding:4px;border-radius:6px;background:var(--btn);color:var(--btnt);font-weight:600}
.bill{display:flex;align-items:baseline;gap:12px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.bill .from{font-size:18px;color:var(--ink2);text-decoration:line-through}
.bill .to{font:600 28px/1.1 var(--sans)}
.thumbs{display:flex;gap:8px;margin:0 0 4px}
.thumbs span{flex:1;height:64px;border-radius:8px;background:linear-gradient(135deg,#9DB0A3,#5E7A6E)}
.thumbs span:nth-child(2){background:linear-gradient(135deg,#C9B08A,#8E6F4C)}
.thumbs span:nth-child(3){background:linear-gradient(135deg,#8FA3BC,#4E6380)}
.cap2{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.pricepage{border:1px solid var(--rule2);border-radius:10px;background:var(--paper2);padding:16px;text-align:center;margin:0 0 12px}
.pricepage .t{font:600 15px var(--sans);margin-bottom:8px}
.pricepage .big{font:700 30px/1.1 var(--sans)}
.pricepage .small{font-size:13px;color:var(--ink2);margin-top:4px}
.status{margin:16px 0 0;font-weight:600}

/* saying it */
.say{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;align-items:center;
  padding:16px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--paper) 28%)}
.say input{flex:1;min-width:0;height:50px;border-radius:25px;border:1px solid var(--rule2);background:var(--paper2);padding:0 20px;font-size:16px}
.say input::placeholder{color:var(--ink2)}
.mic{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:var(--btn);color:var(--btnt);display:grid;place-items:center;cursor:pointer}
.heard{position:fixed;left:12px;right:12px;bottom:84px;z-index:31;background:var(--paper2);border:1px solid var(--rule2);border-radius:16px;
  padding:14px 16px 16px;box-shadow:0 10px 34px rgba(0,0,0,.14)}
.heard q{display:block;font:italic 18px/1.4 var(--serif);margin:2px 0 8px;quotes:"“" "”"}
.heard p{margin:0 0 12px;font-size:15.5px}
.listening{font-weight:600;color:var(--ink2)}

/* the one thing that is ever pushed */
.push{position:fixed;z-index:55;top:64px;left:10px;right:10px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:0;border-radius:18px;
  background:rgba(247,244,238,.97);color:#1D1B18;text-align:left;box-shadow:0 14px 44px rgba(0,0,0,.25);cursor:pointer}
html[data-theme=dark] .push{background:rgba(46,48,54,.97);color:#F0EDE6}
.push .ic{flex:none;width:38px;height:38px;border-radius:9px;background:#FBF8F2;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.push .ic::before{content:"";position:absolute;left:9px;top:9px;width:3px;height:20px;border-radius:2px;background:#A0301C}
.push .ic::after{content:"";position:absolute;left:16px;right:8px;top:11px;height:17px;background:repeating-linear-gradient(#CDBFAA 0 2px,transparent 2px 7px)}
.push .tx b{display:block;font:600 14px/1.3 var(--sans);margin-bottom:2px}
.push .tx span{font:14.5px/1.38 var(--sans)}
.lock{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;padding:96px 12px 0;color:#F4F1EA;
  background:radial-gradient(120% 70% at 30% 10%,#4B5A6B 0,#253039 45%,#12161B 100%)}
.lock-t{font:300 76px/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lock-d{font:500 17px/1.3 var(--sans);margin:8px 0 34px;opacity:.9}
.lock .push{position:static;width:100%}

/* one level down */
.doc .h{display:flex;align-items:center;gap:10px;margin:26px 0 8px;font:600 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.doc .h::after{content:"";flex:1;height:1px;background:var(--rule)}
html[data-theme=dark] .doc .h::after{display:none}
.doc h2{font:600 24px/1.25 var(--sans);margin:10px 0 6px;letter-spacing:-.01em}
.doc p{margin:0 0 8px}
.doc .ln{display:flex;align-items:last baseline;gap:0;padding:8px 0 6px;border-bottom:1px solid var(--rule)}
.doc .ln .w{font:17px/1.3 var(--serif)}
.doc .ln .ld{flex:1 1 14px;min-width:14px;margin:0 8px;border-bottom:2px dotted var(--ink3);transform:translateY(-5px)}
.doc .ln .v{flex:none;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.doc .why{margin:2px 0 8px;font:italic 14.5px/1.45 var(--sans);color:var(--ink2)}
.doc .entry{margin:0 0 12px}
.doc .entry .w{font:17px/1.3 var(--serif)}
.doc .entry .lnk{font-size:14px;margin-left:6px}
.doc .back{margin:4px 0 0}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
.doc td,.doc th{padding:0;border-bottom:1px solid var(--rule);text-align:left;vertical-align:baseline}
.doc th{font:600 11px/2.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:4px 0}
.doc td.r,.doc th.r{text-align:right;padding-left:10px;white-space:nowrap}
.doc td button{display:block;width:100%;min-height:42px;padding:8px 0;border:0;background:none;text-align:left;font:16px/1.3 var(--serif);cursor:pointer}
.doc tr.sel td{background:var(--wash)}
.costcard{border:1px solid var(--rule2);border-radius:10px;background:var(--paper2);padding:14px 16px;margin:0 0 6px}
.costcard .his{font-size:20px}
.costcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.costcard dt{color:var(--ink2)}
.costcard dd{margin:0;font-weight:600}
.machine{padding:10px 0;border-bottom:1px solid var(--rule)}
.machine b{font-weight:600}
.machine .on{color:var(--ink2);font-size:15px}

@media (min-width:900px){
  body{background:var(--desk)}
  .spread{max-width:none;display:flex;justify-content:center;align-items:flex-start;padding:26px 24px 64px}
  .page{background:var(--paper);box-shadow:var(--shadow)}
  html[data-theme=dark] .page{border:1px solid var(--rule)}
  .page.pic{width:580px;padding:22px 46px 26px 58px;border-radius:6px}
  .spread.two .page.pic{border-radius:6px 0 0 6px}
  .page.thing{width:620px;padding:26px 52px 40px 50px;border-radius:0 6px 6px 0;background-image:var(--gutter);align-self:stretch}
  html[data-theme=dark] .page.thing{border-left:0}
  .lede{font-size:26px;margin-top:14px}
  .row{min-height:40px;padding:9px 0 6px}
  .row .w{font-size:18px}
  .sec{margin-top:14px}
  .head .say{position:static;padding:0;background:none;width:270px}
  .head .say input{height:40px;font-size:15px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink)}
  .head .mic{width:40px;height:40px}
  .page.pic .heard{position:static;margin:12px 0 6px;box-shadow:none;background:var(--hover);border-color:var(--rule)}
  .page.pic .heard .b{min-height:40px}
  .push{left:auto;right:22px;top:74px;width:390px}
  .kv{display:grid;grid-template-columns:112px 1fr;gap:0 12px}
  .kv .lbl{padding-top:6px}
  .kv .val{margin-top:0}
  .said{display:grid;grid-template-columns:112px 1fr;gap:0 12px}
  .said .lbl{padding-top:4px}
  .foot{margin-top:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="proto" aria-label="Prototype controls, not part of the design">
  <span class="tag">Prototype</span>
  <button id="pPrev" aria-label="Previous moment">◂</button>
  <select id="pJump" aria-label="Jump to a moment"></select>
  <button id="pNext">Next moment ▸</button>
  <button id="pTheme" aria-label="Switch light or dark">◐</button>
  <span id="pNar" class="nar" aria-live="polite" tabindex="0"></span>
</header>
<main id="app"></main>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app');
const NUMW=['no','one','two','three','four','five','six','seven','eight'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=(s,lbl,what,detail)=>({s,lbl:lbl||'',what:what||'result',detail});
const desk=()=>matchMedia('(min-width:900px)').matches;
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const MIC='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

const S={m:0,theme:null,open:null,page:'pic',res:{},marks:{},pointing:null,step:{},ovr:{},notes:{},flash:null,subNote:null,
  heard:null,pushShown:false,costGoal:'invoice',sayDraft:'',seen:{},taken:{},anim:false,focusKey:null,parked:false};

function rows(){const r={};for(let i=0;i<=S.m;i++)for(const [k,v] of Object.entries(M[i].rows||{})){if(v===null)delete r[k];else r[k]=v;}
  for(const [k,v] of Object.entries(S.ovr)){if(v===null)delete r[k];else r[k]=v;}return r;}
const cardsLeft=()=>M[S.m].cards.filter(id=>!S.res[id]);
const cardFor=g=>cardsLeft().find(id=>C[id].goal===g);
function noteFor(id){if(id in S.notes)return S.notes[id];return (M[S.m].notes||{})[id]||null;}

/* ---------- pieces ---------- */
function pt(card,part,html,cls=''){
  const m=(S.marks[card]||{})[part];const on=S.pointing&&S.pointing.card===card&&S.pointing.part===part;
  return `<button class="pt ${cls} ${m?'marked':''} ${on?'on':''}" data-act="point" data-card="${card}" data-part="${part}" data-k="pt-${card}-${part}" aria-pressed="${!!m}">${html}${m?`<span class="why">${esc(m)}</span>`:''}</button>`
   +(on?chips(card):'');
}
function chips(card){const rs=C[card].reasons||['Not what I meant','Cut this','Say it…'];
  return `<span class="chips" role="group" aria-label="What’s wrong here?"><span class="chips-q">What’s wrong here?</span>${rs.map((r,i)=>`<button class="chip" data-act="why" data-card="${card}" data-why="${esc(r)}" data-k="why-${card}-${i}">${r}</button>`).join('')}</span>`;}
function agreeBody(id){const a=C[id].a;return `<div class="said"><span class="lbl">You said</span><div><q class="his">${a.said}</q><span class="hint">${a.when}</span></div></div>
  ${kv('I heard',pt(id,'h',a.heard))}${a.why?kv('What went wrong',pt(id,'y',a.why)):''}
  ${kv('Done means',a.done.map((d,i)=>pt(id,'d'+i,`<span class="n">${i+1}</span><span>${d}</span>`,'li')).join(''))}
  ${a.mine?kv('I’ll decide',pt(id,'m',a.mine)):''}${a.only?kv('Only you',pt(id,'o',a.only)):''}${a.not?kv('Not doing',pt(id,'x',a.not)):''}
  ${a.chg?kv('From now on',pt(id,'c',a.chg)):''}${kv('Next',pt(id,'t',a.next))}`;}
function multiBody(id){const c=C[id],st=S.step[id]||{};
  return `<p class="ctx">${c.ctx}</p>`+c.qs.map((q,n)=>`<div class="mq"><p class="q">${q.q}</p><p class="advice">${q.adv}</p><p class="dflt">${q.dflt}</p>
  ${st[n]?`<p class="answered">✓ ${st[n]}<button class="lnk" data-act="q" data-card="${id}" data-n="${n}" data-val="" data-k="q-${n}-x">change</button></p>`
  :`<div class="acts sm">${q.opts.map((o,j)=>`<button class="b ${j===0?'pri':''}" data-act="q" data-card="${id}" data-n="${n}" data-val="${esc(o)}" data-k="q-${n}-${j}">${o}</button>`).join('')}</div>`}</div>`).join('');}

    if(!same&&(S.marks[d.card]||{})[d.part]){delete S.marks[d.card][d.part];S.focusKey='pt-'+d.card+'-'+d.part;break;}
    S.pointing=same?null:{card:d.card,part:d.part};S.focusKey=same?null:'why-'+d.card+'-0';break;}
  case 'why':{const p=S.pointing.part;(S.marks[d.card]=S.marks[d.card]||{})[p]=d.why==='Say it…'?'in your words':d.why.toLowerCase();S.pointing=null;S.focusKey='sb-'+d.card;break;}
  case 'clear':S.marks[d.card]={};break;
  case 'sendback':S.step[d.card]='always';S.focusKey='always-'+d.card;break;
  case 'always':resolve(d.card,'always');return;
  case 'onlyhere':resolve(d.card,'here');return;
  case 'signin':S.step[d.card]='faceid';render();
    setTimeout(()=>{S.step[d.card]='signed';render();setTimeout(()=>resolve(d.card,'yes'),reduced()?0:1400);},reduced()?0:900);return;
  case 'more':S.step[d.card]='more';break;
  case 'page':S.page=d.val;S.open=null;S.anim='open';S.focusKey=desk()?null:'back';break;
  case 'back':S.page='pic';S.focusKey='pg-week';break;
  case 'cost':S.page='behind';S.costGoal=d.val;S.open=null;break;
  case 'costsel':S.costGoal=d.val;S.focusKey='cs-'+d.val;break;
  case 'change':S.sayDraft=`About “${G[d.val]}”: `;S.open=null;render();{const i=$('#sayIn');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}return;
  case 'mic':doSay(($('#sayIn')||{}).value||'');return;
  case 'heardok':S.heard=null;S.focusKey='mic';break;
  case 'push':{S.pushShown=false;const l=cardsLeft();if(l.length){S.open='c:'+l[0];S.anim='open';S.focusKey=desk()?'signin':'row-'+C[l[0]].goal;}break;}
  case 'take':S.taken[d.val]=1;break;
  case 'seen':S.seen[d.val]=1;break;
  }
  render();
}
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;e.preventDefault();act(b.dataset.act,b.dataset);});
app.addEventListener('input',e=>{if(e.target.id==='sayIn')S.sayDraft=e.target.value;});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sayIn'){e.preventDefault();doSay(e.target.value.trim());}});
document.addEventListener('keydown',e=>{
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(e.key==='Escape'){if(S.pointing)S.pointing=null;else if(S.heard)S.heard=null;else if(S.open){const k=S.open;S.open=null;S.focusKey='row-'+(k.startsWith('c:')?(C[k.slice(2)].goal||k.slice(2)):k.slice(2));}else if(S.page!=='pic')S.page='pic';render();}
  else if(e.key==='/'&&!typing){e.preventDefault();const i=$('#sayIn');if(i)i.focus();}
});

/* ---------- prototype controls (outside the design) ---------- */
function load(i,o={}){
  Object.assign(S,{m:i,res:{},marks:{},pointing:null,step:Object.assign({},M[i].step||{}),ovr:{},notes:{},flash:null,subNote:null,parked:false,
    heard:M[i].say?{you:M[i].say.you,reply:M[i].say.reply}:null,pushShown:!!M[i].push,page:M[i].page||'pic',costGoal:M[i].costGoal||'invoice',seen:{},taken:{},anim:'new'});
  S.open=o.open||M[i].open||(desk()&&M[i].cards.length&&!M[i].push?'c:'+M[i].cards[0]:null);
  if(o.page)S.page=o.page;
  render();window.scrollTo(0,0);
}
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t;}
$('#pJump').innerHTML=M.map((m,i)=>`<option value="${i}">${i+1}/${M.length} · ${m.t} · ${m.ev}</option>`).join('');
$('#pJump').addEventListener('change',e=>load(+e.target.value));
$('#pPrev').addEventListener('click',()=>S.m>0&&load(S.m-1));
$('#pNext').addEventListener('click',()=>S.m<M.length-1&&load(S.m+1));
$('#pTheme').addEventListener('click',()=>{setTheme(S.theme==='dark'?'light':'dark');render();});
let lastDesk=desk();addEventListener('resize',()=>{if(desk()!==lastDesk){lastDesk=desk();render();}});
const hp=new URLSearchParams(location.hash.slice(1));
setTheme(hp.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
load(Math.max(0,Math.min(M.length-1,+(hp.get('m')||0))),{open:hp.get('open')||undefined,page:hp.get('page')||undefined});
})();
</script>
