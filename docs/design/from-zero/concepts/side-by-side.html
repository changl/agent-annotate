<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>The designs, phone and desk side by side</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --bg:#f3f1ec; --ink:#1c1b19; --mute:#6b675f; --line:#d6d2c8; --on:#1c1b19; --on-ink:#f3f1ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --ink:#ece8df; --mute:#9a958b; --line:#33312d; --on:#ece8df; --on-ink:#141413; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; font-weight:600; margin:0 8px 0 0; }
  nav { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; color:inherit; background:none; border:1px solid var(--line); border-radius:999px; padding:8px 14px; min-height:44px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--on); color:var(--on-ink); border-color:var(--on); }
  button:focus-visible, a:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  p.note { margin:0; color:var(--mute); font-size:13px; flex:1 1 280px; }
  a { color:inherit; }
  main { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { color:var(--mute); font-size:12px; letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px; }
  iframe { display:block; border:1px solid var(--line); border-radius:12px; background:#fff; }
  #phone { width:390px; height:844px; flex:none; }
  .desk { flex:1; min-width:0; }
  #desk { width:100%; height:844px; }
  @media (max-width: 900px) { main { flex-direction:column; } #phone { width:100%; max-width:390px; } }
</style>
<header>
  <h1>The designs</h1>
  <nav aria-label="Which design">
    <button data-d="v2-sitting">Sitting-based</button>
    <button data-d="v2-letter">Letter-based</button>
    <button data-d="v2-showing">The showing sheet</button>
    <button data-d="v2-return">Coming back</button>
  </nav>
  <p class="note">Phone on the left, desk on the right. Each has its own "next" control along its top: that control is for stepping through the test week and is not part of the design. <a id="open" href="#">Open this one on its own</a>.</p>
</header>
<main>
  <figure><figcaption>Phone, 390 wide</figcaption><iframe id="phone" title="Phone view"></iframe></figure>
  <figure class="desk"><figcaption>Desk</figcaption><iframe id="desk" title="Desk view"></iframe></figure>
</main>
<script>
  // One static page: pick a design, show it at phone and desk width at once.
  const buttons = [...document.querySelectorAll('button[data-d]')];
  function show(d) {
    const src = d + '/index.html';
    document.getElementById('phone').src = src;
    document.getElementById('desk').src = src;
    document.getElementById('open').href = src;
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === d)));
    history.replaceState(null, '', '#' + d);
  }
  buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.d)));
  const wanted = location.hash.slice(1);
  show(buttons.some(b => b.dataset.d === wanted) ? wanted : 'v2-sitting');
</script>
</html>
