<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>One conversation: the test week</title>
<style>
:root{
  color-scheme:light;
  --paper:#F4F0E8;--sheet:#FFFDF9;--ink:#1E1B17;--ink2:#5A5348;--hair:#D8CFBF;--edge:#8A8172;
  --lamp:#A33B12;--tint:#F6E6DA;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ph:58px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --paper:#12110E;--sheet:#1C1A16;--ink:#E8E2D5;--ink2:#A8A091;--hair:#322F28;--edge:#6F685B;
  --lamp:#EFA557;--tint:#2C2116;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
p,h1,h2,h3,ul,ol,dl,dd{margin:0;padding:0}
ul,ol{list-style:none}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
[tabindex="-1"]:focus-visible{outline:none}
.his{font-style:italic}
h3,.lab,.cap,dt{font:600 12px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}

/* ---- prototype control: deliberately foreign, not part of the design ---- */
#proto{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;
  background:repeating-linear-gradient(135deg,#dfe3ea 0 10px,#d3d8e1 10px 20px);color:#1d2330;border-bottom:1.5px dashed #5b6477;
  font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace}
#proto b{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
#proto button{min-width:44px;min-height:44px;padding:0 10px;border:1.5px solid #1d2330;border-radius:6px;background:#f4f6fa;font-weight:700;text-align:center}
#proto :focus-visible{outline-color:#1d2330}

/* ---- the thread, phone first ---- */
#app{max-width:440px;margin:0 auto;padding:0 20px;min-height:calc(100dvh - var(--ph));display:flex;flex-direction:column}
.past>summary,.hand>summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;font:500 13px var(--sans);color:var(--ink2)}
.past>summary::after,.hand>summary::after,.fold>summary::after,.day>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin:0 3px 0 10px;flex:none;transition:transform .2s}
details[open]>summary::after{transform:rotate(45deg)}
.past{border-bottom:1px solid var(--hair)}
.hand{border-top:1px solid var(--hair);margin-top:8px}
.day>summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;font:500 14px var(--sans);color:var(--ink2)}
.day>summary span{margin-left:auto;font-weight:400}
.day ul{padding-bottom:8px}
.day li,.donenow li,.told li{position:relative;padding:5px 0 5px 20px;font-size:15px;line-height:1.42;color:var(--ink2)}
.day li::before,.donenow li::before,.told li::before{content:"";position:absolute;left:1px;top:.74em;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--edge)}
.donenow{margin-top:16px}
.donenow li{animation:settle .45s ease-out}
@keyframes settle{from{opacity:0;transform:translateY(8px)}}

.now{padding:20px 0 20px}
.when{font:500 13px var(--sans);color:var(--ink2);letter-spacing:.02em}
.now .when{display:none}
.earlier{margin-left:auto}
.lamps{display:flex;gap:10px;margin:0 0 12px;height:12px;align-items:center}
.lamp{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--lamp);flex:none;transition:background .4s,box-shadow .4s}
.lamp.out{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge)}
[data-theme=dark] .lamp:not(.out){box-shadow:0 0 0 3px rgba(239,165,87,.14),0 0 14px rgba(239,165,87,.6)}
.lamp.ring:not(.out){outline:1.5px solid var(--lamp);outline-offset:3px}
h1{font:400 31px/1.13 var(--serif);letter-spacing:-.012em;text-wrap:balance}
[data-theme=dark] h1{letter-spacing:-.004em}
.sheet h2+.part,.sheet h2+.qh,.sheet h2+details{margin-top:12px}
.sub{margin-top:8px;color:var(--ink2);font-size:16px}
.told{margin-top:18px;padding-top:12px;border-top:1px solid var(--hair)}
.told li{font-size:16px;color:var(--ink)}
.told .lab{font:500 14px/1.4 var(--sans);letter-spacing:0;text-transform:none;margin-bottom:4px}

.sheet,.reply{margin:22px -8px 0;padding:18px 18px 8px;border-radius:3px}
.sheet{background:var(--sheet);box-shadow:0 0 0 1px var(--hair),0 22px 40px -28px rgba(80,50,10,.45)}
[data-theme=dark] .sheet{box-shadow:0 0 0 1px var(--hair)}
.reply{box-shadow:0 0 0 1px var(--hair)}
.new{animation:arrive .34s cubic-bezier(.2,.7,.2,1)}
@keyframes arrive{from{opacity:0;transform:translateY(12px)}}
.kind{display:flex;align-items:center;gap:9px;font:600 12px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--lamp)}
.reply .kind{color:var(--ink2)}
h2{font:400 25px/1.2 var(--serif);margin:10px 0 2px;text-wrap:balance}
.src{color:var(--ink2);font-size:15.5px;margin-bottom:10px}
.part{padding:11px 0 8px;border-top:1px solid var(--hair)}
.part h3{margin-bottom:3px}
.big{font-size:19px;line-height:1.4}
.bigp{font-size:21px;line-height:1.3;padding:6px 0 12px}
.qh{font-size:19px;line-height:1.3;padding:4px 0 2px}
.would{color:var(--ink2);font-size:15.5px;padding:2px 0 4px}
.note{font-size:15.5px;color:var(--ink2);padding:10px 0;border-top:1px solid var(--hair)}
.silent p{font-size:15.5px;color:var(--ink2)}
.rule{font-size:20px;line-height:1.35;padding:6px 0 14px}
.plain li{padding:3px 0 3px 20px;position:relative}
.plain li::before{content:"";position:absolute;left:2px;top:.8em;width:8px;height:1.5px;background:var(--edge)}

/* a line he can point at */
.line{display:block;width:calc(100% + 16px);margin:0 -8px;padding:9px 8px;min-height:44px;border-radius:3px}
@media(hover:hover){.line:hover{background:var(--tint)}}
.ol{counter-reset:n}
.ol .line{counter-increment:n;padding-left:30px;position:relative}
.ol .line::before{content:counter(n) ".";position:absolute;left:8px;color:var(--ink2)}
.open>.line{background:var(--tint)}
.marked>.line{background:var(--tint);box-shadow:inset 2.5px 0 0 var(--lamp)}
.row.marked>.line,.row.open>.line{padding-left:10px}
.mark{display:block;font:italic 15.5px var(--serif);color:var(--lamp);padding:0 0 8px}
.mark::before{content:"— "}
.why{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px}
.why button,.why form button{min-height:44px;padding:0 14px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--lamp);color:var(--lamp);font:italic 16.5px var(--serif)}
.why form{display:flex;gap:8px;width:100%}
.why input,.say{flex:1;min-width:0;min-height:48px;padding:0 14px;border:0;border-radius:3px;background:var(--sheet);box-shadow:inset 0 0 0 1.5px var(--edge);font:italic 17px var(--serif)}
.why input::placeholder,.say::placeholder{color:var(--ink2);opacity:1}

.opts{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 6px}
.opts button{min-height:44px;padding:0 16px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--edge);font:600 15px var(--sans)}
.opts [aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none}
[data-theme=dark] .opts [aria-pressed=true]{background:var(--tint);color:var(--lamp);box-shadow:inset 0 0 0 1.5px var(--lamp)}
.fold{border-top:1px solid var(--hair)}
.fold>summary{display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:16.5px}
.fold ul,.fold .lines{padding-bottom:10px;color:var(--ink2);font-size:16px}
.fold .line{color:var(--ink)}

/* the thing itself is set in the plain face; the conversation in the serif */
.cap{padding:4px 0 2px}
.rows{margin:6px 0 2px;font:15px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.rowh,.row>.line{display:grid;grid-template-columns:54px 54px 1fr auto;column-gap:10px;align-items:center}
.rowh{font:600 11.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--hair)}
.row>.line{width:100%;margin:0;padding:9px 0;border-radius:0;border-bottom:1px solid var(--hair);font:inherit}
.row.two>.line{grid-template-columns:1fr auto}
.row .mark,.row .why{font-family:var(--serif);padding-top:8px}
.n{text-align:right}
.more{font:500 14px var(--sans);color:var(--ink2);padding:6px 0 2px}
.door{min-height:44px;text-decoration:underline;text-underline-offset:4px;color:var(--ink)}
.mbody{margin-top:8px;padding:12px 16px 6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--hair);border-radius:3px;font:15.5px/1.45 var(--sans)}
.mbody .mark,.mbody .why{font-family:var(--serif)}
.fakebtn{display:inline-block;margin:6px 0 8px;padding:9px 16px;border-radius:4px;background:var(--ink2);color:var(--sheet);font:600 14px var(--sans)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 12px}
.tile{padding:12px 10px 10px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--edge);background:var(--paper);text-align:center}
.pp{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:76px}
.pc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:52px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--edge);font:500 11.5px var(--sans);color:var(--ink2)}
.pc b{font:700 14px var(--sans);color:var(--ink)}
.pc.lead{height:76px;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.pc.lead b{font-size:20px}
.tl{display:block;margin-top:9px;font:600 14px var(--sans)}
.ba{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;align-items:baseline;margin:4px 0 10px}
.ba dd{font-size:17px;color:var(--ink2)}
.ba dd.is{font-size:26px;line-height:1.2;color:var(--ink)}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.pics span{aspect-ratio:4/3;border-radius:3px;background:linear-gradient(160deg,#9db0a5,#5f7a72 60%,#3d5550)}
.pics span:nth-child(2){background:linear-gradient(200deg,#d8b98f,#a97f58 55%,#6c5140)}
.pics span:nth-child(3){background:linear-gradient(140deg,#aab4c6,#6f7c98 60%,#474f66)}
.txt{display:block;padding:12px 14px;border-radius:3px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--hair);font:15.5px/1.4 var(--sans)}
.stars{display:block;margin-top:6px;font-size:22px;letter-spacing:.12em;color:var(--ink2)}
.scrs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.scrl>.line{width:100%;margin:0;padding:0}
.scr{display:flex;flex-direction:column;gap:8px;padding:12px 10px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--edge);font:13.5px/1.2 var(--sans)}
.st{font-weight:700}
.fld{padding:9px 8px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink2)}
.fb{padding:9px 8px;border-radius:3px;background:var(--ink2);color:var(--sheet);font-weight:600;text-align:center}
.gl{min-height:44px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--edge);font-style:italic}
.gs{line-height:1.2}

.then{margin-top:20px}
.then button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border-top:1px solid var(--hair);color:var(--ink2);font-size:16px}
.then .lab{margin-bottom:6px}
.asks{margin-top:26px}
.asks button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;border-top:1px solid var(--hair);font-size:17px;font-style:italic}
.asks button::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--ink2);border-bottom:1.5px solid var(--ink2);transform:rotate(-45deg);margin-right:3px}
.g{display:grid;grid-template-columns:14px 1fr;column-gap:6px;align-items:baseline;width:100%;min-height:44px;padding:7px 0;border-top:1px solid var(--hair);font-size:16px;line-height:1.3}
.g .lamp{width:8px;height:8px;align-self:center}
.g span.s{grid-column:2;display:block;font:13.5px/1.35 var(--sans);color:var(--ink2);margin-top:1px}

/* his voice: answers at the thumb */
.voice{order:4;position:sticky;bottom:0;z-index:5;margin:auto -20px 0;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--hair)}
.hand{order:3}
.hint{font:500 13px var(--sans);color:var(--ink2);text-align:center;margin-bottom:8px}
.arow,.answers,.sayrow,.tail{display:flex;gap:10px;align-items:center}
.arow{flex-wrap:wrap;row-gap:4px}
.answers{flex:1 1 150px}
.answers:has(.btn+.btn){flex-basis:100%}
.answers:has(.btn+.btn)+.tail{flex:1 0 100%}
.tail{flex:0 0 auto}
.btn{flex:1 1 120px;min-height:52px;padding:6px 16px;border-radius:4px;font:600 16px/1.15 var(--sans);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.btn small{font:500 11.5px var(--sans);opacity:.85;letter-spacing:.02em;margin-top:2px}
.btn.go{background:var(--ink);color:var(--paper)}
[data-theme=dark] .btn.go{background:var(--tint);color:var(--lamp);box-shadow:inset 0 0 0 1.5px var(--lamp)}
.btn.alt{box-shadow:inset 0 0 0 1.5px var(--edge)}
.btn.quiet{flex:0 0 auto;min-height:44px;padding:0 8px;font-weight:500;font-size:15px;color:var(--ink2);text-decoration:underline dotted;text-underline-offset:4px}
.mic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--edge);margin-left:auto}
.sayrow{flex-wrap:nowrap}
.sit .sayrow{display:none}
.keys{display:none}

/* his phone, locked: the first sentence lives here too */
.lock{flex:1;margin:0 -20px;padding:52px 22px 30px;display:flex;flex-direction:column;min-height:calc(100dvh - var(--ph));
  background:linear-gradient(168deg,#EADFCD,#DCCBB2 52%,#C4AE90);color:#1E1B17;--lk2:#3D372E}
[data-theme=dark] .lock{background:linear-gradient(168deg,#1F1C16,#0B0A08 70%);color:#E8E2D5;--lk2:#A8A091}
.clock{text-align:center}
.clock span{font:500 15px var(--sans);color:var(--lk2)}
.clock b{display:block;font:300 82px/1.05 var(--sans);letter-spacing:-.03em}
.widget{display:block;width:100%;margin-top:30px;padding:16px 18px;border-radius:18px;background:rgba(255,253,249,.6)}
[data-theme=dark] .widget{background:rgba(255,255,255,.07)}
.wlamps{display:flex;gap:9px;margin-bottom:10px}
.wl{display:block;font:400 21px/1.3 var(--serif)}
.ws{display:block;font:500 13.5px var(--sans);color:var(--lk2);margin-top:6px}
.wk{font:700 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--lamp);margin-bottom:4px}
.widget .answers{margin-top:14px}
.heard{margin:26px 4px 0;font-size:23px;line-height:1.3}
.hold{margin:auto auto 0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper)}
.hold svg{width:34px;height:34px}
.holdl{text-align:center;font:500 14px var(--sans);color:var(--lk2);margin-top:12px}
.openl{margin:auto auto 0;min-height:44px;padding:0 18px;font:500 14px var(--sans);color:var(--lk2);text-decoration:underline dotted;text-underline-offset:4px}
@media(max-width:979px){.locked .past,.locked .hand{display:none}}

/* ---- the desk: one sheet of paper, three tenses left to right ---- */
@media(min-width:980px){
  body{font-size:18px}
  .now .when{display:block}
  .lamps{margin-top:18px}
  .when+h1{margin-top:18px}
  #proto{font-size:12px;padding:6px 16px}
  #app{max-width:1264px;padding:0 28px;display:grid;grid-template-columns:236px minmax(0,624px) 292px;grid-template-rows:1fr auto;
    grid-template-areas:"past now hand" "past voice hand";justify-content:space-between}
  .past,.hand{align-self:start;position:sticky;top:var(--ph);max-height:calc(100dvh - var(--ph));overflow:auto;padding:50px 4px 30px;border:0;margin:0}
  .past{grid-area:past}.hand{grid-area:hand}
  .past>summary,.hand>summary{pointer-events:none;min-height:0;margin-bottom:12px;font:600 12px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase}
  .past>summary::after,.hand>summary::after{display:none}
  .now{grid-area:now;padding:50px 0 24px}
  h1{font-size:46px;line-height:1.08}
  .sub{font-size:18px;margin-top:12px}
  .sheet,.reply{margin:30px 0 0;padding:30px 38px 14px}
  h2{font-size:30px}
  .part{display:grid;grid-template-columns:104px 1fr;column-gap:22px;padding:13px 0 9px}
  .part h3{padding-top:14px}
  .part.wide{display:block}
  .part>div>p:first-child:not(.qh){padding-top:9px}
  .mbody{max-width:480px}
  .tiles{max-width:420px}.scrs{max-width:440px}.pics{max-width:420px}
  .voice{grid-area:voice;margin:0;padding:16px 0 14px;box-shadow:-16px 0 0 var(--paper),16px 0 0 var(--paper)}
  .arow{flex-wrap:nowrap;gap:14px}
  .answers,.answers:has(.btn+.btn){flex:none}
  .answers:has(.btn+.btn)+.tail,.tail{flex:1}
  .hint{text-align:left}
  .btn{flex:0 0 auto;min-width:200px}
  .btn.quiet{min-width:0}
  .tail .mic{display:none}
  .sit .sayrow,.sayrow{display:flex;margin-top:10px}
  .voice:not(.sit) .sayrow{margin-top:0}
  .keys{display:block;font:500 12.5px var(--sans);color:var(--ink2);margin-top:9px}
  .keys kbd{font:600 11.5px var(--sans);padding:1px 5px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--edge)}
  .lock{grid-area:now;grid-row:1/3;align-self:start;width:390px;min-height:680px;margin:40px auto;border-radius:40px;box-shadow:0 0 0 1px var(--hair),0 0 0 9px var(--sheet),0 0 0 10px var(--hair)}
}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
.still *,.still *::after{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="proto" role="group" aria-label="Prototype control, not part of the design">
  <button id="pv" type="button" aria-label="Previous moment">◂</button>
  <p><b>prototype control · not part of the design</b><span id="pc"></span></p>
  <button id="th" type="button" aria-label="Switch between light and dark">◐</button>
  <button id="nx" type="button" aria-label="Next moment">next ▸</button>
</div>
<main id="app"></main>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const his=s=>`<i class="his">“${s}”</i>`;
const mq=matchMedia('(min-width:980px)');
const N=['no','one','two','three','four','five','six','seven','eight','nine','ten'];
const up=s=>s[0].toUpperCase()+s.slice(1);
const MIC=`<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

/* ---------- the week's content ---------- */
// what he can say is wrong, by the kind of line he points at
const W={heard:['not what I meant','leave this out'],mine:['ask me first'],not:['do this too'],assume:['wrong','ask me first'],
  copy:['too long','wrong tone','not true','cut it'],row:['wrong amount','wrong date','should not be here'],pic:['too busy','wrong feel','wrong words'],
  rule:['only that once'],call:['overturn'],knock:['this could have waited']};

// goals: name in his words, project, what he said, cycles, cost
const G={

function line(s,k,html,w,cls=''){
  const m=s.marks[k],o=s.open===k;
  return `<div class="ln ${cls}${m?' marked':''}${o?' open':''}"><button class="line" data-act="line" data-k="${k}" data-w="${w}" aria-pressed="${!!m}">${html}</button>`+
   (m?`<span class="mark">${esc(m)}</span>`:'')+
   (o?`<div class="why" role="group" aria-label="What is wrong here?">`+(s.saying===k?`<form data-form="why"><input aria-label="Say what is wrong here" placeholder="Say what is wrong here"><button>mark</button></form>`:
     W[w].map(x=>`<button data-act="why" data-why="${x}">${x}</button>`).join('')+`<button data-act="sayit">say it…</button>`)+`</div>`:'')+`</div>`;
}
const row=(lab,html)=>`<div class="part${lab?'':' wide'}">${lab?`<h3>${lab}</h3>`:''}<div>${html}</div></div>`;
function part(s,p,i){
  if(typeof p==='function') return p(s);
  const [k,a,b,c,d]=p;
  if(k==='said') return row('You said',`<p class="his big">“${a}”</p>`);
  if(k==='p') return row(a,`<p>${b}</p>`);
  if(k==='note') return `<p class="note">${a}</p>`;
  if(k==='would') return `<p class="would">${a}</p>`;
  if(k==='h') return `<p class="qh">${a}</p>`;
  if(k==='big') return `<p class="bigp">${a}</p>`;
  if(k==='lines') return row(a,`<div class="lines${d?' ol':''}">${b.map((x,j)=>line(s,i+'-'+j,x,c)).join('')}</div>`);
  if(k==='list') return row(a,`<ul class="plain">${b.map(x=>`<li>${x}</li>`).join('')}</ul>`);

function hand(){

    mo.things.forEach(id=>{const s=S[id],t=T[id];if(!(i<M||s&&s.done)) return;

function pastDays(withCur){ // what was told once, and what was settled; nothing open ever lives here

function voiceHtml(open,lines){

const app=$('#app');
function draw(){

function go(i){

  unlocked=false;reply=null;cur=null;fresh=true;ui.past=ui.hand=false;draw();

function settle(id,out,park){const s=st(id);s.done=out;s.ask=null;s.park=park;last=id;reply=null;fresh=true;focusSel='.sheet,.stand h1';}

/* ---------- what he does ---------- */
function act(el){
  const a=el.dataset.act,t=cur&&T[cur],s=cur&&st(cur);
  if(a==='line'){const k=el.dataset.k;if(s.marks[k]) delete s.marks[k];else s.open=s.open===k?null:k;if(s.marks[k]===undefined&&s.open!==k) s.open=null;s.saying=null;focusSel=`[data-k="${k}"]`;}
  else if(a==='why'){s.marks[s.open]=el.dataset.why;focusSel=`[data-k="${s.open}"]`;s.open=null;}
  else if(a==='sayit'){s.saying=s.open;focusSel='.why input';}
  else if(a==='pick'){s.picks[el.dataset.key]=+el.dataset.j;focusSel=`[data-key="${el.dataset.key}"][data-j="${el.dataset.j}"]`;}
  else if(a==='ans') settle(cur,val(t.ans[+el.dataset.i].out,s));

  else if(a==='back'){
    const why=[...new Set(Object.values(s.marks))].join(', '),n=Object.keys(s.marks).length;
    if(!isLook(t)) settle(cur,t.marked?t.marked(n):`${val(t.ans[0].out,s)} Changed: ${why}.`);
    else{const al=t.always||['','Only here','this kind of work.'];
      s.ask={k:'Asked once',q:'Here only, or always?',sub:`You marked: ${esc(why)}. I ask once, so that I learn.`,rule:al[0],opts:[al[1],'Always'],
        fn:i=>[`sent back: ${why}. ${i?'Kept as a rule: '+al[2]:'This one only.'} ${t.again}`]};fresh=true;focusSel='.sheet';}
  }
  else if(a==='notnow'){const u=t.until||[['Tomorrow','tomorrow'],['Monday','Monday']];
    s.ask={k:'Not now',q:'Until when?',sub:'It leaves your plate and your head. I bring it back then.',opts:u.map(x=>x[0]),
      fn:i=>[`parked until ${u[i][1]}. I will bring it back.`,`parked until ${u[i][1]} (your call)`]};fresh=true;focusSel='.sheet';}
  else if(a==='opt') settle(cur,...s.ask.fn(+el.dataset.opt));
  else if(a==='unask'){s.ask=null;fresh=true;}
  else if(a==='jump'){cur=el.dataset.id;fresh=true;focusSel='.sheet';}
  else if(a==='door') s.door=!s.door;
  else if(a==='mic') settle('said',T.said.def);
  else if(a==='signin') settle('knock',T.knock.ans[0].out);
  else if(a==='open'){unlocked=true;fresh=true;}
  else if(a==='saymic'){$('.sayrow').style.display='flex';$('.say').focus();return;}
  else if(a==='ask'){reply={k:'engine'};fresh=true;focusSel='.reply';}
  else if(a==='goal'){reply={k:'goal',g:el.dataset.g};fresh=true;focusSel='.reply';}
  else if(a==='close'){reply=null;fresh=true;focusSel='.sheet,.stand h1';}
  draw();
}

   ()=>{go(4);c('[data-go]');c('[data-go]');c('[data-go]');go(7);c('[data-act="open"]');c('[data-go]');if($('.donenow').textContent.includes('comes back')) throw new Error('ratings came back though never parked');},
   ()=>{go(5);c('[data-act="open"]');c('[data-k="1-0"]');c('[data-why="this could have waited"]');c('[data-go]');has('.donenow','this could have waited');},

  ];
  const out=tests.map((t,i)=>{try{t();return `${i+1} ok`;}catch(e){return `${i+1} FAILED: ${e.message}`;}});

}else{
  if(P.has('n')||P.has('y')) document.documentElement.classList.add('still');
