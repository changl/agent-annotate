<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The showing · prototype</title>
<style>
:root{--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;--serif:ui-serif,"Iowan Old Style","Charter","Georgia",serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
html[data-theme=light]{--desk:#E9E2D4;--paper:#FBF8F2;--paper2:#FFFFFF;--box:#EFE9DE;--ink:#1D1B18;--ink2:#5E584F;--ink3:#B4AC9F;--rule:#E4DCCE;--rule2:#CDC3B2;
  --rubric:#A0301C;--wash:#F6E5DD;--hover:#F2ECE1;--btn:#1D1B18;--btnt:#FBF8F2;--ok:#2F5D3A;--shadow:0 1px 2px rgba(70,50,20,.06),0 14px 40px rgba(70,50,20,.10)}
html[data-theme=dark]{--desk:#0B0C0F;--paper:#15171B;--paper2:#1C1F24;--box:#0E1013;--ink:#E8E2D6;--ink2:#A29B8F;--ink3:#4A4B4F;--rule:#24282E;--rule2:#3A3F47;
  --rubric:#EE8A6D;--wash:#2A1D19;--hover:#1D2025;--btn:#E8E2D6;--btnt:#15171B;--ok:#8FC59B;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
html[data-theme=dark] body{-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- prototype strip: NOT part of the design ---------- */
.proto{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:4px 8px 5px;font:11px/1.3 var(--mono);color:#3A3214;
  background:repeating-linear-gradient(-45deg,#F4E7B0 0 8px,#EDDB98 8px 16px);border-bottom:1px dashed #8A7733}
html[data-theme=dark] .proto{color:#EADFAE;background:repeating-linear-gradient(-45deg,#2D2812 0 8px,#25210D 8px 16px);border-color:#6E6026}
.proto .tag{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.proto button,.proto select{min-height:28px;padding:0 7px;border:1px solid currentColor;border-radius:3px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.proto button:disabled{opacity:.4;cursor:default}
.proto select option{color:#000;background:#fff}
.proto .nar{flex-basis:100%}
@media (max-width:899px){.proto .tag,.proto .wide{display:none}}

.frame{padding:0}
@media (min-width:900px){body{background:var(--desk)}.frame{max-width:1240px;margin:0 auto;padding:22px 20px 60px}}

/* ---------- the sheet: the showing, with its own edges ---------- */
.sheet{position:relative;background:var(--paper);border:1px solid var(--rule2);border-radius:14px;box-shadow:var(--shadow);margin:10px 8px 24px;overflow:clip}
@media (min-width:900px){.sheet{margin:0}}
.sh-head{padding:14px 18px 12px;border-bottom:1px solid var(--rule)}
.sh-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:600 11.5px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.sh-top .ver{color:var(--rubric)}
.sh-top>span:last-child{white-space:nowrap}
.sh-goal{font:400 25px/1.15 var(--serif);margin:6px 0 8px;letter-spacing:-.005em}
.seal{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.35;color:var(--ink2)}
.seal .stamp{flex:none;width:18px;height:18px;margin-top:-1px;border-radius:50%;border:1.5px solid var(--ink2);position:relative}
.seal .stamp::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--ink2);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.seal b{color:var(--ink);font-weight:600}
.seal.broken{color:var(--rubric)}
.seal.broken .stamp{border-color:var(--rubric);border-style:dashed}
.seal.broken .stamp::after{display:none}
.sh-body{display:block}
@media (min-width:900px){.sh-body{display:grid;grid-template-columns:minmax(0,1fr) 330px}}
.stage{position:relative;background:var(--box);padding:14px 12px 12px;min-height:200px}
.rail{padding:14px 18px 8px;border-top:1px solid var(--rule)}
@media (min-width:900px){.stage{padding:18px 20px 16px;min-height:520px}.rail{border-top:0;border-left:1px solid var(--rule);padding:16px 18px}}
.hint{font-size:13.5px;color:var(--ink2)}
.sim{display:table;margin:0 0 10px;padding:3px 8px;border:1px dashed #8A7733;border-radius:4px;font:11px/1.35 var(--mono);color:#3A3214;background:repeating-linear-gradient(-45deg,#F4E7B0 0 8px,#EDDB98 8px 16px)}
html[data-theme=dark] .sim{color:#EADFAE;background:repeating-linear-gradient(-45deg,#2D2812 0 8px,#25210D 8px 16px)}
.spd{margin-top:8px}
/* the pointing view: while marking, every part he can point at is at least 44 px */
.marking .scr{height:auto;min-height:440px}
.marking .scr .kb{display:none}
.marking .scr .tg{display:flex;align-items:center;min-height:44px;margin:4px 0}
.marking .scr .tg.slot,.marking .scr .tg.field{flex-direction:column;align-items:flex-start;justify-content:center}
.marking .scr .tg.cta{justify-content:center}
.marking #thing span.tg:not(.scr span):not(.vp span){display:inline-flex;align-items:center;min-height:44px;min-width:44px}
.marking .trace li.tg{min-height:44px;align-items:center}
.marking .tbl td{padding:0}
.marking .tbl td>.tg{display:flex!important;align-items:center;min-height:44px;padding:0 10px}
.marking .tbl td.r>.tg{justify-content:flex-end}
.marking .w{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 6px;margin:2px 1px;border:1px dashed rgba(160,48,28,.45);border-radius:8px;vertical-align:middle}
.stage-hint{display:table;margin:0 0 10px;padding:3px 9px;border-radius:12px;background:var(--rubric);color:var(--paper);font:600 12.5px/1.4 var(--sans)}
html[data-theme=dark] .stage-hint{color:#15171B}

/* rail sections */
.r-h{font:600 11px/1.6 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin:0 0 4px}
.r-sec{margin:0 0 16px}
.judge{font:400 18px/1.35 var(--serif);margin:0}
.judge.ph{margin-top:10px;font-size:17px}
.judge.ph .r-h{display:block;margin-bottom:1px}
.judge.none{font-family:var(--sans);font-size:15px;color:var(--ink2)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.dot{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font:600 13px/1 var(--sans);display:grid;place-items:center;cursor:pointer;padding:0}
.dot.not{background:transparent;color:var(--ink);border-style:dashed}
.dot[aria-pressed=true]{box-shadow:0 0 0 3px var(--wash),0 0 0 4.5px var(--rubric)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:14.5px;line-height:1.35}
.plist .n{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--paper);font:600 11px/18px var(--sans);text-align:center}
.plist .n.not{background:transparent;color:var(--ink);border:1.3px dashed var(--ink);line-height:15.5px}
.plist li{padding:0}
.prow{display:flex;gap:8px;align-items:center;width:100%;min-height:44px;padding:0;border:0;background:none;text-align:left;font:14.5px/1.35 var(--sans);cursor:pointer;color:inherit}
.prow[aria-pressed=true] .tx{text-decoration:underline;text-decoration-color:var(--rubric);text-underline-offset:3px}
.prow .tx{flex:1}

.plist .at{flex:none;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sumline{font-size:14px;color:var(--ink2);margin:0}
.pdetail{margin:8px 0 0;padding:10px 12px;border-left:3px solid var(--ink);background:var(--paper2);border-radius:0 8px 8px 0;font-size:14.5px}
.pdetail .lnk{margin-right:12px}
details.raw{margin-top:6px}
details.raw summary{cursor:pointer;color:var(--ink2);font-size:13.5px;min-height:44px;display:flex;align-items:center}
details.raw pre{margin:4px 0 0;white-space:pre-wrap;font:12px/1.5 var(--mono);color:var(--ink);background:var(--box);padding:8px 10px;border-radius:6px}
.lnk{min-height:44px;padding:0;border:0;background:none;color:var(--ink2);font:500 14.5px var(--sans);cursor:pointer;text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:4px}
.lnk:hover{color:var(--ink)}
.inl{display:inline-block;min-height:0;min-width:44px;padding:14px 2px;margin:-14px 0;text-align:center}
.fork{padding:10px 12px;border:1px solid var(--rule2);border-radius:10px;background:var(--paper2)}
.fork .q{font-weight:600;margin:0 0 4px}
.fork .wait{margin:8px 0 0;padding-top:6px;border-top:1px dashed var(--rule2);font-size:13.5px;color:var(--ink2)}
.fork .chosen{font-weight:600;margin:6px 0 0}

/* marks */
.marks{list-style:none;margin:0;padding:0}
.marks li{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--rule);font-size:14.5px;line-height:1.35}
.marks li:first-child{border-top:0}
.marks .pin{position:static;flex:none}
.marks .anc{display:block;font-size:12.5px;color:var(--ink2)}
.marks .ok{color:var(--ok);font-weight:600}
.pin{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--rubric);color:#fff;font:700 12px/1 var(--sans);box-shadow:0 0 0 2px #fff}
html[data-theme=dark] .pin{color:#15171B;box-shadow:0 0 0 2px #15171B}
.pin.done{background:var(--ok)}
.tg{position:relative}
.tg>.pin{position:absolute;right:-8px;top:-9px;z-index:4}
.marking .tg{cursor:crosshair;outline:1.5px dashed rgba(160,48,28,.55);outline-offset:1px;border-radius:4px}
.marking .tg:hover,.marking .tg:focus-visible{outline:2px solid #A0301C;background-image:linear-gradient(rgba(160,48,28,.10),rgba(160,48,28,.10))}
.tg.is-marked{outline:2px solid #A0301C!important;outline-offset:1px;border-radius:4px}
.tg.is-done{outline:2px solid #2F5D3A!important;outline-offset:1px;border-radius:4px}
.tg.ev-hl{outline:2.5px solid #1D1B18;outline-offset:2px;border-radius:4px}

/* answer bar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);background:var(--paper)}
@media (max-width:899px){.bar,.sent,.tray{position:sticky;bottom:0;z-index:20;box-shadow:0 -8px 20px rgba(0,0,0,.06)}}
@media (min-width:900px){.bar{border-top:1px solid var(--rule);padding:12px 0 4px;background:none}}
.b{min-height:46px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:none;font:600 15.5px var(--sans);cursor:pointer}
.b.pri{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.b.full{flex-basis:100%}
.caveat{display:block;flex-basis:100%;width:100%;min-height:44px;margin:0 0 4px;padding:8px 12px;border:0;border-left:3px dashed var(--ink2);border-radius:0 8px 8px 0;background:var(--paper2);text-align:left;font:14.5px/1.4 var(--sans);color:var(--ink);cursor:pointer}
.caveat b{font-weight:600}
.b.red{background:var(--rubric);color:#fff;border-color:var(--rubric)}
html[data-theme=dark] .b.red{color:#15171B}
.b:disabled{opacity:.45;cursor:not-allowed}
.b small{font-weight:500;opacity:.8}
.grow{flex:1}
.bar.stack{flex-direction:column;align-items:stretch}
.bar.stack .b{width:100%}
.tray{padding:10px 14px;border-top:1px solid var(--rule);background:var(--paper2)}
.tray .q{margin:0 0 8px;font-weight:600;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--rule2);background:var(--paper);font:500 15px var(--sans);cursor:pointer}
.chip:hover{border-color:var(--ink)}
.say{display:flex;gap:8px;margin-top:8px}
.say input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--rule2);background:var(--paper);padding:0 16px}
.under{font-size:13px;color:var(--ink2);margin:6px 0 0;flex-basis:100%}
.sent{padding:12px 14px;border-top:1px solid var(--rule);background:var(--paper2)}
.sent b{display:block;margin-bottom:2px}
.backband{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--paper2);border:1px solid var(--rule2)}
.backband .t{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:9px;overflow:hidden;margin-top:6px}
.seg button{min-height:44px;padding:0 12px;border:0;background:none;font:500 13.5px var(--sans);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--btn);color:var(--btnt)}
.ribbon{position:absolute;right:12px;top:10px;z-index:3;padding:3px 9px;border-radius:12px;background:var(--ink);color:var(--paper);font:600 12.5px/1.4 var(--sans)}

/* the pause before something that cannot be undone */
.saidback{font:400 21px/1.35 var(--serif);margin:4px 0 10px;padding:12px 14px;border-left:3px solid var(--rubric);background:var(--paper2);border-radius:0 10px 10px 0}
.hold{position:relative;overflow:hidden;min-height:52px;padding:0 18px;border-radius:12px;border:0;background:var(--rubric);color:#fff;font:700 16px var(--sans);cursor:pointer;width:100%}
html[data-theme=dark] .hold{color:#15171B}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(0,0,0,.28)}
.hold span{position:relative}
.cant{margin:0;padding:0;list-style:none}
.cant li{padding:3px 0;font-size:14.5px}
.receipt{padding:12px 14px;border-radius:10px;border:1px solid var(--rule2);background:var(--paper2)}

/* scrubber */
.scrub{display:flex;align-items:center;gap:10px;margin-top:12px}
.scrub .play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);color:var(--btnt);cursor:pointer;display:grid;place-items:center}
.track{position:relative;flex:1;height:44px}
.track input{position:absolute;left:0;right:0;top:0;height:44px;width:100%;margin:0;accent-color:var(--ink);background:transparent}
.tick{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;font:700 10.5px/1 var(--sans);color:var(--ink);pointer-events:none}
.tick::after{content:"";display:block;width:1.5px;height:8px;margin:2px auto 0;background:var(--ink)}
.tick.m{color:var(--rubric);top:auto;bottom:0}
.tick.m::after{display:none}
.tick.m::before{content:"";display:block;width:1.5px;height:8px;margin:0 auto 2px;background:var(--rubric)}
.time{flex:none;font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink2);min-width:84px;text-align:right}

/* --- the things themselves keep their own colours in both themes --- */
.phone{width:248px;margin:0 auto;border-radius:30px;background:#111;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.scr{position:relative;height:440px;border-radius:22px;background:#fff;color:#1A1A1A;overflow:hidden;font:13px/1.35 var(--sans)}
.scr .appbar{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:600;color:#1F5C4A;border-bottom:1px solid #EEE}
.scr .pad{padding:12px 14px}
.scr h3{font:700 18px/1.2 var(--sans);margin:4px 0 10px}
.scr .field{display:block;border:1px solid #C9CED3;border-radius:8px;padding:9px 10px;margin:6px 0;min-height:36px;color:#1A1A1A}
.scr .field.f{border-color:#1F5C4A;box-shadow:0 0 0 2px rgba(31,92,74,.18)}
.scr .lbl2{font-size:11px;color:#5B6168;margin-top:8px;display:block}
.scr .cta{display:block;text-align:center;background:#1F5C4A;color:#fff;border-radius:10px;padding:11px;font-weight:700;margin-top:10px}
.scr .slot{display:block;border:1px solid #D7DBDF;border-radius:10px;padding:10px;margin:6px 0}
.scr .slot.sel{border-color:#1F5C4A;background:#EEF6F2}
.scr .slot small{display:block;color:#5B6168}
.scr .step{font-size:11px;color:#5B6168}
.scr .kb{position:absolute;left:0;right:0;bottom:0;height:150px;background:#D5D8DD;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:8px 5px}
.scr .kb i{background:#fff;border-radius:4px}
.ripple{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(31,92,74,.30);border:2px solid #1F5C4A;z-index:5;pointer-events:none}
.scr .doneic{width:56px;height:56px;margin:30px auto 10px;border-radius:50%;background:#1F5C4A;position:relative}
.scr .doneic::after{content:"";position:absolute;left:21px;top:13px;width:12px;height:24px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg)}
.map{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:12px;background:#EEF0EA}
.routewrap{display:block}
@media (min-width:900px){.routewrap{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;align-items:start}.routewrap .turns{margin:0;font-size:13.5px}}
.turns{list-style:none;margin:10px auto 0;padding:0;max-width:560px;font-size:14px}
.turns li{display:flex;gap:10px;padding:4px 8px;border-radius:6px;color:var(--ink2)}
.turns li.cur{background:var(--paper2);color:var(--ink);font-weight:600}
.turns .tt{flex:none;width:44px;font-variant-numeric:tabular-nums}
.webs{display:flex;gap:14px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.webcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.webcap{font:600 11.5px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.vp{position:relative;overflow:hidden;border:1px solid #C9CED3;border-radius:8px;background:#fff}
.vp .in .pin{transform:scale(var(--ps));transform-origin:100% 0}
.vp .in{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:#14213D;font:16px/1.45 var(--sans)}
.web .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid #E6E8EE;font-weight:700;color:#14213D}
.web .nav span{font-weight:500;color:#566;margin-left:18px}
.web .hero{padding:28px 22px}
.web h1{font:800 34px/1.1 var(--sans);margin:0 0 16px}
.web .tog{display:inline-flex;border:1px solid #C5CAD6;border-radius:999px;padding:3px;margin:0 0 18px}
.web .tog span{padding:7px 16px;border-radius:999px;font-weight:600}
.web .tog .on{background:#14213D;color:#fff}
.web .price{font:800 44px/1 var(--sans);margin:0 0 6px}
.web .price.small{font-size:34px}
.web .price small{font-size:18px;font-weight:600;color:#566}
.web .free{color:#2B7A4B;font-weight:700;margin:0 0 18px}
.web ul{margin:0 0 20px;padding-left:20px}
.web li{margin:6px 0}
.web .go{display:inline-block;background:#E4572E;color:#fff;font-weight:800;padding:13px 30px;border-radius:10px}
.web .tax{font-size:14px;color:#566;margin-top:12px}
.web.wide .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding:56px 80px}
.web.wide .card{border:1px solid #E1E4EC;border-radius:16px;padding:28px}
.web .checkout{padding:40px 22px;text-align:center}
.mail{max-width:360px;margin:0 auto;background:#fff;color:#1B1B1B;border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.12);font:15px/1.55 var(--sans)}
.mail .mh{padding:12px 16px;border-bottom:1px solid #EEE;font-size:13px;color:#555}
.mail .mh b{display:block;color:#1B1B1B;font-size:16px}
.mail .mb{padding:14px 16px 18px}
.mail .mb p{margin:0 0 10px}
.w{border-radius:3px}
.marking .w{cursor:text}
.w.sel{background:#F3D9CE}
.w.cut{text-decoration:line-through;text-decoration-color:#A0301C;text-decoration-thickness:2px;color:#9A8F87}
.w.newt{background:#DCEBDD}
.iconwrap{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.iconbig{position:relative;width:240px;height:240px}
.iconbig svg{width:100%;height:100%;display:block}
.iconcap{text-align:center;font:600 11.5px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:6px}
.home{width:200px;padding:14px 12px;border-radius:22px;background:linear-gradient(160deg,#5B7FA6,#2E4A6A);display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.home i{display:block;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.55);margin:0 auto}
.home svg{width:36px;height:36px;display:block;margin:0 auto}
.home span{display:block;text-align:center;color:#fff;font:9px/1.2 var(--sans);margin-top:3px}
.sizes{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin-top:14px}
.sizes svg{display:block}
.tbl{width:100%;border-collapse:collapse;background:#fff;color:#1A1A1A;border-radius:10px;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{background:#F1F2F4;text-align:left;font:600 11.5px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#555;padding:8px 10px}
.tbl td{padding:7px 10px;border-top:1px solid #ECEDEF}
.tbl td.r,.tbl th.r{text-align:right}
.tbl .up{color:#8A4A10}
.tbl tr.flag td{background:#FFF6E6}
.foot{margin:8px 2px 0;font-size:13.5px;color:var(--ink2)}
.readback{margin-top:12px;display:flex;gap:12px;align-items:center;background:#fff;color:#1A1A1A;border-radius:10px;padding:10px 12px;font-size:14px}
.readback .ph{flex:none;width:52px;height:52px;border-radius:8px;background:linear-gradient(135deg,#9DB0A3,#5E7A6E)}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair{background:#fff;color:#1A1A1A;border-radius:10px;padding:8px;font-size:12.5px}
.pair .im{height:70px;border-radius:6px;margin-bottom:6px}
.pair b{display:block;font-size:13px}
.pair.deny .im{background:repeating-linear-gradient(45deg,#EEE 0 6px,#F7F7F7 6px 12px);display:grid;place-items:center;color:#A0301C;font-weight:700}
.big{font:700 44px/1.1 var(--sans);text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.big s{color:var(--ink2);font-weight:500;font-size:30px;margin-right:12px}
.trace{list-style:none;margin:0;padding:0;background:#fff;color:#1A1A1A;border-radius:10px;overflow:hidden}
.trace li{display:flex;gap:10px;padding:8px 12px;border-top:1px solid #ECEDEF;font-size:14px}
.trace li:first-child{border-top:0}
.trace .tm{flex:none;width:64px;font:600 12.5px var(--mono);color:#555}
.trace .bad{color:#A0301C;font-weight:600}
.trace .good{color:#2F5D3A;font-weight:600}
.sms{max-width:300px;margin:12px auto 0;background:#fff;border-radius:14px;padding:10px 12px;color:#1A1A1A;font-size:14px}
.sms .bub{background:#E9E9EB;border-radius:16px;padding:9px 12px;margin-top:6px}
.sms small{color:#777}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colh{font:600 12px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.inv{list-style:none;margin:0;padding:0;background:#fff;color:#1A1A1A;border-radius:10px;overflow:hidden}
.inv li{padding:8px 12px;border-top:1px solid #ECEDEF;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.inv li:first-child{border-top:0}
.inv small{color:#666}
.rel{background:#fff;color:#1A1A1A;border-radius:12px;padding:12px 14px}
.rel h4{margin:8px 0 4px;font:600 11.5px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:#555}
.rel h4:first-child{margin-top:0}
.rel .ln{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid #EEE;font-size:14px}
.rel .ln:first-of-type{border-top:0}
.rel .fp{font:12px var(--mono);color:#555}
.opt{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 10px;border:1px solid var(--rule2);border-radius:10px;margin:6px 0;cursor:pointer;background:var(--paper2)}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:18px;height:18px;margin-top:3px;border:2px solid var(--ink2);border-radius:50%;background:var(--paper2)}
.opt input:checked{border-color:var(--rubric);background:var(--rubric);box-shadow:inset 0 0 0 3px var(--paper2)}

/* self-check */
.check{margin:10px;padding:12px;border:2px dashed #8A7733;border-radius:10px;font:12px/1.5 var(--mono);background:var(--paper2);color:var(--ink);overflow-wrap:anywhere}
.check .f{color:#A0301C;font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  return `<div class="scrub"><button class="play" data-act="play" aria-label="${S.playing?'Pause':'Play'} the recording" ${S.mode==='mark'?'disabled':''}>${S.playing?PAUSE:PLAY}</button>
   <div class="track">${ticks}<input type="range" id="scrub" min="0" max="${dur}" step="1" value="${Math.round(S.t)}" aria-label="Position in the recording" ${S.mode==='mark'?'disabled':''}>${mt}</div>

/* ======================= render ======================= */

function renderStage(){const th=$('#thing');if(!th)return;th.innerHTML=STAGE[sh().id]();

/* play */
let timer=null;

/* ======================= actions ======================= */
function addMark(m){S.marks.push(m);S.pend=null;S.sel=null;S.focus='sendback';}
function act(a,d,el,ev){const s=sh();
  switch(a){
  case 'play':if(S.playing)stopPlay();else play();render();return;
  case 'proof':{const n=+d.n;S.proof=S.proof===n?null:n;const p=doneOf()[n];if(S.proof!==null&&p.at!==undefined){stopPlay();S.t=p.at;}break;}
  case 'mark':stopPlay();S.mode='mark';S.proof=null;S.focus=null;break;
  case 'look':S.mode='look';S.pend=null;S.sel=null;S.scope=false;S.hold=0;break;
  case 'whole':S.pend={tg:'whole',label:'the whole thing',at:s.dur?Math.round(S.t):undefined};S.focus='why0';break;
  case 'why':{const v=d.v;if(v.endsWith('…')){S.pend.say=true;S.pend.why=v==='Say it…'?v:v.slice(0,-1);S.focus=null;render();const i=$('#sayIn');if(i)i.focus();return;}

  case 'sayok':{const t=($('#sayIn')||{}).value||'';addMark(Object.assign({},S.pend,{why:S.pend.why||'Say it…',said:t.trim()||'(spoken)'}));break;}
  case 'unmark':S.marks.splice(+d.n,1);break;
  case 'sendback':S.scope=true;break;

  case 'accept':if(!canAccept())return;S.prevMode=S.mode;S.mode='accepted';S.accepted={rev:S.rev,fork:S.fork,aud:S.aud};S.focus='takeback';break;
  case 'takeback':S.mode=S.prevMode||'look';S.accepted=null;break;
  case 'toact':if(!canAct())return;S.mode='act';S.hold=0;break;
  case 'undo':if(d.v==='ask')S.undo='ask';else if(d.v==='do')S.undo='done';else S.undo=null;break;
  case 'spd':S.spd=+d.v;break;
  case 'pick':{const c=S.choose.list[+d.n];S.pend={tg:c.tg,label:c.label,w:S.choose.w};S.choose=null;S.focus='why0';break;}
  case 'hand':if(d.v==='send'){S.hand='sending';render();setTimeout(()=>{if(S.hand==='sending'){S.hand=S.handFail?'failed':'ready';render();}},900);return;}
    S.hand=null;break;
  case 'stopact':S.stopped=true;break;
  case 'fork':S.fork=d.v||null;break;
  case 'cmp':{const n=+d.n;S.compare=n<0?null:n;if(S.compare!==null){const m=S.marks[n];if(m.at!==undefined)S.t=m.at;}break;}
  case 'bw':S.bWidth=d.v;break;

  case 'monthly':if(S.mode!=='look')return;S.monthly=true;break;
  case 'yearly':if(S.mode!=='look')return;S.monthly=false;break;
  case 'start':if(S.mode!=='look')return;S.checkout=true;break;
  case 'backpage':S.checkout=false;break;
  }

/* press and hold to confirm something that cannot be undone */
let holdT=null;
function holdStart(e){const b=e.target.closest('[data-act=hold]');if(!b)return;e.preventDefault();if(b.disabled||!canAct()||S.mode!=='act')return;const t0=performance.now();clearInterval(holdT);

/* ======================= #check: run every state and report ======================= */
function words(el){return (el.innerText.match(/[A-Za-z0-9$£][^\s]*/g)||[]).length;}
function runCheck(){
  const rows=[];let pass=0,fail=0;const tally=[],extra=[];
  SH.forEach((s,i)=>{
    const modes=['look','proof','mark','marked','sent','back','act','done','changed'].filter(m=>!(['marked','sent','back'].includes(m)&&!s.canned)&&!(['act','done'].includes(m)&&!s.act));
    modes.forEach(m=>{load(i,m);const sheet=app.querySelector('.sheet');const errs=[];
      if(!sheet)errs.push('no sheet');else{
        if(!sheet.querySelector('.seal'))errs.push('no seal');
        if(!sheet.querySelector('#stage'))errs.push('no thing');
        if(m!=='done'&&m!=='act'&&!sheet.querySelector('.plist,.dots'))errs.push('no proof');
        if(sheet.scrollWidth>sheet.clientWidth+2)errs.push('sheet overflows sideways');
        if(document.documentElement.scrollWidth>innerWidth+2)errs.push('page overflows sideways');
        if(m==='marked'&&!sheet.querySelector('.pin'))errs.push('mark not shown on the thing');
        if(m==='back'&&sheet.querySelectorAll('.backband .pin.done').length!==s.canned.length)errs.push('marks not all answered');
        if(m==='act'&&!sheet.querySelector('.saidback'))errs.push('not said back');
        if(m==='done'&&!sheet.querySelector('.receipt'))errs.push('no receipt');
        if(m==='changed'&&!sheet.querySelector('.seal.broken'))errs.push('seal not broken');
        if(m==='changed'&&sheet.querySelector('[data-act=accept]:not([disabled])'))errs.push('accept still possible after change');
        if(m==='changed'&&sheet.querySelector('[data-act=toact]:not([disabled])'))errs.push('the act is still reachable after change');
        /* guard: in the pointing view every part he can point at is at least 44 by 44 px (small page parts go through a chooser) */
        if(m==='mark'||m==='marked'){const tiny=[...sheet.querySelectorAll('[data-tg],[data-w]')].filter(el=>!el.closest('[data-choose]')).filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&(r.width<43.5||r.height<43.5);});
          if(tiny.length)errs.push('pointing target under 44 px: '+tiny.slice(0,3).map(el=>(el.dataset.label||el.textContent).trim().slice(0,24)+' '+Math.round(el.getBoundingClientRect().width)+'×'+Math.round(el.getBoundingClientRect().height)).join(' | '));}
        if(m==='proof'&&!sheet.querySelector('.pdetail'))errs.push('proof line does not open');
        /* guard: no word of the method on his screen */
        const bad=sheet.innerText.match(/\b(par|cycles?|gate|counterpart|ledger|sittings?|watcher|forks?|slice|backbrief)\b|\bthe watch\b/gi);
        if(bad)errs.push('method word on screen: '+[...new Set(bad.map(x=>x.toLowerCase()))].join(', '));
        /* guard: every control at least 44 by 44 px. Exempt, on purpose: the parts of the thing itself he points at (words, map, page elements) */
        const small=[...sheet.querySelectorAll('button,[role=button],input,select,summary,label.opt,a')].filter(el=>el.type!=='radio'&&!el.closest('[data-tg],[data-w],[data-map],[data-pic],.vp'))
          .filter(el=>{const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&(r.width<43.5||r.height<43.5);});
        if(small.length)errs.push('control under 44 px: '+small.slice(0,4).map(el=>((el.getAttribute('aria-label')||el.textContent||el.tagName).trim().slice(0,28))+' '+Math.round(el.getBoundingClientRect().width)+'×'+Math.round(el.getBoundingClientRect().height)).join(' | '));
        if(m==='back'||m==='act')extra.push(s.id+' '+m+' '+words(sheet));
        if(m==='look'){const all=words(sheet);const avail=all+s.done.reduce((a,d)=>a+d.how.split(/\s+/).length,0)+s.raw.split(/\s+/).length;tally.push([s.id,all,avail]);}
      }
      if(errs.length){fail++;rows.push(`<div class="f">✗ ${s.id} ${m}: ${errs.join('; ')}</div>`);}else{pass++;rows.push(`<div>✓ ${s.id} ${m}</div>`);}});
    /* behaviour tests: each returns an error, or nothing when it holds */
    const T=(name,fn)=>{let err=null;try{err=fn();}catch(x){err='threw: '+x.message;}
      if(err){fail++;rows.push(`<div class="f">✗ ${s.id} ${name}: ${err}</div>`);}else{pass++;rows.push(`<div>✓ ${s.id} ${name}</div>`);}};
    const txt=()=>app.innerText;
    if(s.act)T('nothing goes out once changed after the check',()=>{
      load(i,'changed');act('toact',{});if(S.mode==='act')return 'reached the act after a change';
      load(i,'act');S.changed=true;render();const hb=app.querySelector('[data-act=hold]');if(!hb||!hb.disabled)return 'hold not held';
      holdStart({target:hb,preventDefault(){}});if(holdT)return 'hold started';
      if(completeAct()!==false||S.mode==='done')return 'completed anyway';
      if(!/Held: changed after the check/.test(txt()))return 'held state not visible';});
    if(s.fork)T('his choice must be answered, and the receipt names it',()=>{
      load(i);if(!app.querySelector('[data-act=accept][disabled]'))return 'accept open before his choice';
      act('accept',{});if(S.mode==='accepted')return 'accepted without his choice';
      S.fork=s.fork.opts[0];render();act('accept',{});if(S.mode!=='accepted')return 'cannot accept after answering';
      if(s.id==='E'&&!(/\$189\.00/.test(txt())&&/honoured in full/.test(txt())))return 'receipt lacks prices or voucher answer';
      if(s.id==='K'&&!/wait/.test(txt()))return 'receipt lacks his choice';});
    if(s.canned)T('the second version is kept through accept and take back',()=>{
      load(i,'back');act('accept',{});if(!/second version/.test(txt()))return 'receipt does not name the second version';
      act('takeback',{});if(S.rev!==2||!/Checked again/.test(app.querySelector('.seal').innerText))return 'reverted to the first version';});
    if(s.id==='I')T('everyone today has its own receipt',()=>{
      load(i,'act');S.aud='all';render();if(!/to all 3,180/.test(txt()))return 'said back wrong';completeAct();
      if(!/all 3,180/.test(txt())||/Monday/.test(app.querySelector('.receipt').innerText))return 'receipt still describes the staged release';});
    if(s.told)T('told, not asked: See and Undo, no yes',()=>{
      load(i);if(app.querySelector('[data-act=accept]'))return 'still asks for a yes';
      if(!app.querySelector('[data-act=undo]'))return 'no undo';
      act('undo',{v:'ask'});act('undo',{v:'do'});if(!txt().includes(s.told.undone))return 'undo has no receipt';});
    if(s.hand)T('the phone handoff is drawn, including failure',()=>{
      load(i);S.hand='sending';render();if(!/Sending this build/.test(txt())||!app.querySelector('[data-act=hand][data-v=cancel]'))return 'no sending state with cancel';
      S.hand='ready';render();if(!/same build that was checked/.test(txt()))return 'no build check';
      S.hand='failed';render();if(!/didn’t answer/.test(txt()))return 'no failed handoff';
      S.hand='ready';render();S.marks.push({at:56,tg:'payNow',label:'“Pay now”',why:'Say it…',said:'x',src:'phone'});S.mode='mark';S.t=56;render();
      if(!/from your phone/.test(txt()))return 'phone mark not shown as such';});
  });
  load(0);
  const tot=tally.reduce((a,x)=>a+x[1],0);
  $('#checkOut').innerHTML=`<div class="check" role="status"><b>Self-check at ${innerWidth} px, ${S.theme}: ${pass} states pass, ${fail} fail.</b><br>
   Words shown to act on (look state), then words available behind it:<br>${tally.map(x=>`${x[0]} ${x[1]} / ${x[2]}`).join(' · ')}<br>Total shown ${tot}. Second versions and pauses: ${extra.join(' · ')}.<br>${rows.join('')}</div>`;
  window.scrollTo(0,0);}

const hp=new URLSearchParams(location.hash.slice(1));
setTheme(hp.get('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
const start=Math.max(0,SH.findIndex(s=>s.id===hp.get('s')));
load(start,hp.get('mode')||null);
if(hp.get('t')){S.t=+hp.get('t');render();}
if(hp.has('check'))setTimeout(runCheck,50);
})();
</script>
</body>
