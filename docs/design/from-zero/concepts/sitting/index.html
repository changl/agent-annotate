<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The sitting</title>
<style>
:root{
  --sans: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.2,1);
  --bar: 44px;
}
html[data-theme="light"]{
  color-scheme: light;
  --bg:#F3EFE6; --surface:#FBF9F4; --surface-2:#EAE4D7; --ink:#1C1B18; --ink-2:#55524A; --ink-3:#6B675E;
  --rule:#DAD2C2; --accent:#2D5B4C; --on-accent:#FFFFFF; --accent-ink:#2D5B4C; --accent-soft:#DDE8E1;
  --amber:#8A5300; --amber-soft:#F4E4C4; --red:#A12C2C; --red-soft:#F5DEDA;
  --his:#2A2318; --mark:#F7E3A1; --mark-line:#B8901A; --focus:#2D5B4C;
  --shadow: 0 1px 2px rgba(60,45,20,.06), 0 8px 28px rgba(60,45,20,.07);
  --card-border: transparent; --thing-filter: none;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1211; --surface:#171B19; --surface-2:#202624; --ink:#ECE7DC; --ink-2:#B3AEA2; --ink-3:#958F84;
  --rule:#2C3330; --accent:#9ED2BB; --on-accent:#0B1712; --accent-ink:#9ED2BB; --accent-soft:#1C2D26;
  --amber:#E9B965; --amber-soft:#2D2517; --red:#F1928A; --red-soft:#351E1C;
  --his:#F1E6CC; --mark:rgba(233,185,101,.24); --mark-line:#E9B965; --focus:#9ED2BB;
  --shadow: 0 0 #0000; --card-border: var(--rule); --thing-filter: brightness(.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-top:var(--bar);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0 0 10px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.his{font-family:var(--serif)}
.lbl{font:600 13px/1.35 var(--sans);color:var(--ink-2);letter-spacing:.01em}
.small{font-size:14px;color:var(--ink-2)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd{display:none;font:600 11px/1 var(--mono);padding:3px 5px;border-radius:5px;border:1px solid currentColor;opacity:.7;margin-left:8px;vertical-align:1px}
@media (hover:hover) and (min-width:1000px){ kbd{display:inline-block} }

/* ---------- prototype controls: outside the design ---------- */
#proto{position:fixed;inset:0 0 auto 0;z-index:60;height:var(--bar);display:flex;align-items:center;gap:6px;padding:0 8px;
  background:repeating-linear-gradient(-45deg,#e6e6e6 0 7px,#dcdcdc 7px 14px);border-bottom:1px dashed #777;font:12px/1.2 var(--mono);color:#1a1a1a}
html[data-theme="dark"] #proto, html[data-theme="dark"] #p-note{background:repeating-linear-gradient(-45deg,#2b2b2b 0 7px,#242424 7px 14px);color:#e6e6e6;border-color:#888}
#proto button,#proto select,#p-note button{height:32px;min-width:34px;border:1px solid #777;background:#f8f8f8;color:#111;border-radius:6px;font:12px var(--mono);padding:0 8px}
html[data-theme="dark"] #proto button,html[data-theme="dark"] #proto select,html[data-theme="dark"] #p-note button{background:#3a3a3a;color:#f0f0f0}
#proto select{flex:1;min-width:0}
.p-tag{white-space:nowrap;font-weight:700;letter-spacing:.04em}
.p-tag span{font-weight:400}
#p-note{background:repeating-linear-gradient(-45deg,#e6e6e6 0 7px,#dcdcdc 7px 14px);border-bottom:1px dashed #777;padding:10px 14px 12px;font:12.5px/1.5 var(--mono);color:#1a1a1a}
#p-note b{font-weight:700}
#p-note p{margin:4px 0 0;max-width:110ch}
#p-note button{margin-top:8px;height:30px}
@media (max-width:999px){ .p-tag span{display:none} }

/* ---------- shared ---------- */
.btn{min-height:52px;padding:0 20px;border-radius:14px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);font:600 16.5px/1.2 var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:transform .12s var(--ease),background .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{background:var(--amber);border-color:var(--amber);color:var(--on-accent)}
html[data-theme="light"] .btn.warn{color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;padding:10px 0;min-height:44px;color:var(--accent-ink);font:600 15px/1.3 var(--sans);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.chev{opacity:.7}

/* ---------- the door ---------- */
.door{max-width:620px;margin:0 auto;padding:26px 20px 150px;animation:rise .35s var(--ease) both}
.day{font:500 14px/1.3 var(--sans);color:var(--ink-2);margin:0 0 10px}
.door h1{font:650 31px/1.12 var(--sans);letter-spacing:-.015em;margin:0 0 8px}
.door .sub{color:var(--ink-2);margin:0 0 20px;font-size:17px}
.order{list-style:none;margin:0 0 22px;padding:0;border-top:1px solid var(--rule)}
.order li{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;padding:13px 0 12px;border-bottom:1px solid var(--rule);align-items:baseline}
.order .n{font:600 14px/1 var(--sans);color:var(--ink-3);font-variant-numeric:tabular-nums}
.order .v{display:block;font:600 13px/1.4 var(--sans);color:var(--accent-ink)}
.order .v.amber{color:var(--amber)} .order .v.red{color:var(--red)}
.order .g{font:500 19px/1.3 var(--serif)}
.order .m{font:500 14px/1 var(--sans);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.order .w{display:block;font-size:14.5px;color:var(--ink-2);margin-top:2px}
.order li.done .g,.order li.done .v{opacity:.55}
.begin{width:100%;min-height:56px;font-size:18px}
.begin2{width:100%;margin-top:10px}
.told{margin:0 0 22px;padding:0}
.told p{margin:0 0 6px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);font-size:15.5px;line-height:1.4}
.told p.moved{box-shadow:var(--shadow), inset 3px 0 0 var(--amber)}
.told p.gone{box-shadow:var(--shadow), inset 3px 0 0 var(--ink-3)}
.told .lbl{margin-bottom:8px}
.digest{margin:-8px 0 22px;padding:0;list-style:none}
.digest li{padding:3px 0 3px 18px;position:relative;font-size:16px;color:var(--ink-2)}
.digest li::before{content:"";position:absolute;left:2px;top:12px;width:6px;height:6px;border-radius:3px;background:var(--accent)}
.calm{margin-top:28px;border-top:1px solid var(--rule);padding-top:6px}
.watch{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:12px 0;min-height:56px;border-bottom:1px solid var(--rule)}
.watch .t{flex:1}
.watch b{font-weight:600}
.watch .s{display:block;font-size:14px;color:var(--ink-2)}
.alarm{font-size:14.5px;color:var(--ink-2);margin:12px 0 0}
.urgent{padding:16px 18px;border-radius:16px;background:var(--amber-soft);margin:0 0 20px}
.urgent .lbl{color:var(--amber)}

/* say it */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 65%,transparent);display:flex;justify-content:center}
.say{width:100%;max-width:620px;min-height:54px;border-radius:27px;border:1.5px solid var(--rule);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 10px 0 10px;box-shadow:var(--shadow);text-align:left}
.say .mic{width:40px;height:40px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.say .st{flex:1;font:600 17px/1.2 var(--sans)}
.say .st span{display:block;font:400 13.5px/1.3 var(--sans);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say .st{min-width:0}

/* ---------- the sitting ---------- */
.sit{padding:0 0 150px}
.sit-head{position:sticky;top:var(--bar);z-index:10;background:var(--bg);padding:8px 8px 8px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--rule)}
.segs{display:flex;gap:4px;flex:1}
.seg{height:5px;border-radius:3px;background:var(--rule);flex:1;position:relative;overflow:hidden}
.seg::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.seg.done::after{transform:scaleX(1)}
.seg.cur{background:var(--ink-3)}
.sit-count{font:500 13.5px/1.2 var(--sans);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;background:none;border:0;min-height:44px;padding:0 4px}
.x{width:44px;height:44px;border:0;background:none;border-radius:22px;display:grid;place-items:center;color:var(--ink-2)}
.rail{display:none}
.main{padding:20px 20px 0;min-width:0}
.main.enter{animation:rise .32s var(--ease) both}
.aside{padding:4px 20px 0;min-width:0}
.acts{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);display:flex;gap:10px;flex-wrap:wrap}
.acts .btn{flex:1 1 0;min-width:0;padding:0 12px}
.acts .btn.wide{flex:2 1 0}
@media (max-width:999px){ .acts:has(> :nth-child(3)) > .wide{flex:1 1 100%} .sit:has(.acts > :nth-child(3)){padding-bottom:210px} }
.kick{font:600 13.5px/1.3 var(--sans);color:var(--accent-ink);letter-spacing:.01em}
.kick.amber{color:var(--amber)} .kick.red{color:var(--red)}
.kick .proj{color:var(--ink-2);font-weight:500}
.goal{font:500 30px/1.12 var(--serif);margin:4px 0 6px;letter-spacing:-.005em}
.goal:focus{outline:none}
.subt{color:var(--ink-2);margin:0 0 16px}
.judge{margin:14px 0 16px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:16.5px}
.judge .lbl{display:block;color:var(--accent-ink);margin-bottom:2px}
.judge.none{background:var(--surface-2)}
.judge.none .lbl{color:var(--ink-2)}
.said{margin:14px 0 18px;padding:14px 16px;background:var(--surface);border:1px solid var(--card-border);border-radius:14px;box-shadow:var(--shadow)}
.said blockquote{margin:6px 0 0;font:italic 400 19px/1.45 var(--serif);color:var(--his)}
.agree{margin:0}
.ln{display:grid;grid-template-columns:86px 1fr;gap:2px 12px;padding:11px 0;border-top:1px solid var(--rule)}
.ln dt{font:600 13px/1.65 var(--sans);color:var(--ink-2)}
.ln dd{margin:0;min-width:0}
.ln ol{margin:0;padding:0;list-style:none;counter-reset:d}
.ln ol li{counter-increment:d;position:relative;padding-left:22px}
.ln ol li::before{content:counter(d);position:absolute;left:0;top:0;font:600 13px/1.75 var(--sans);color:var(--ink-3)}
.ln.only{background:linear-gradient(var(--accent-soft),var(--accent-soft));border-radius:12px;padding:12px;margin:6px 0;border-top:0}
.ln.only dt{color:var(--accent-ink)}
.fx{border-radius:8px;margin:-3px -6px;padding:3px 6px;cursor:pointer;transition:background .15s}
.fx:hover{background:var(--surface-2)}
.fx.marked{background:var(--mark);box-shadow:inset 3px 0 0 var(--mark-line)}
.hint{font-size:14px;color:var(--ink-2);margin:12px 0 0}
.ed{margin:8px 0 6px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--mark-line)}
.ed textarea,.note-in,.say-in{width:100%;font:400 16px/1.4 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;min-height:46px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:44px;padding:0 15px;border-radius:22px;border:1px solid var(--rule);background:var(--bg);font:500 15px/1 var(--sans);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* choices */
.choice{margin:16px 0 22px;padding:0}
.choice + .choice{border-top:1px solid var(--rule);padding-top:18px}
.q{font:600 19px/1.3 var(--sans);margin:0 0 4px}
.cnum{font:600 13px/1 var(--sans);color:var(--ink-3);display:block;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 10px}
.opt{min-height:60px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--rule);background:var(--surface);text-align:left;font:600 16px/1.25 var(--sans);color:var(--ink);transition:border-color .15s, background .15s}
.opt .rec{display:block;font:500 13px/1.3 var(--sans);color:var(--accent-ink);margin-top:3px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"] .ok{display:inline}
.ok{display:none;color:var(--accent-ink)}
.why{font-size:15.5px;margin:0 0 6px}
.dflt{font-size:15px;color:var(--ink-2);margin:0;padding-left:12px;border-left:2px solid var(--rule)}
.dflt b{color:var(--ink);font-weight:600}
.intro{margin:12px 0 4px}
.dflt .dk-l{display:block;font:600 12.5px/1.4 var(--sans);letter-spacing:.01em}
.dflt.go{border-left-color:var(--accent)} .dflt.go .dk-l{color:var(--accent-ink)}
.dflt.wait{border-left-color:var(--amber)} .dflt.wait .dk-l{color:var(--amber)}
.assumed.untried{border-color:var(--amber)} .untried .lbl{color:var(--amber)}
.callout .linkbtn{min-height:0;padding:0}
.orig{margin:-6px 0 12px}
.unk{padding:16px 18px;border-radius:16px;background:var(--surface-2);margin:0 0 6px}
.unk .lbl{color:var(--amber)} .unk h1{margin:6px 0 8px}
.watch.unknown b{color:var(--amber)}
.stale{color:var(--amber)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.ctl .btn{min-height:44px;font-size:15px;padding:0 14px;border-radius:12px}
.gl{all:unset;cursor:pointer;font:500 18px/1.3 var(--serif);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px;min-height:32px}
.gl:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.raw{list-style:none;margin:14px 0;padding:0;font:13.5px/1.55 var(--mono)}
.raw li{padding:8px 4px;border-top:1px solid var(--rule);display:grid;grid-template-columns:6.5em 1fr;gap:10px}
.raw li b{color:var(--accent-ink)}
.raw li.flag b{color:var(--amber)}

/* the thing itself: shown as it really is */
.thing{margin:0 0 16px;background:#fff;color:#1d1d1f;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.06);overflow:hidden;filter:var(--thing-filter);font-family:var(--sans)}
html[data-theme="dark"] .thing{box-shadow:0 0 0 1px #333}
.thing .cap{font:500 12.5px/1.3 var(--sans);color:#5b5b60;padding:10px 14px;border-bottom:1px solid #ececec;background:#fafafa;display:flex;justify-content:space-between;gap:10px}
.pointing [data-b]{cursor:pointer;outline:2px dashed rgba(184,144,26,.55);outline-offset:-2px;border-radius:6px}
.pointing [data-b]:hover,.pointing [data-b]:focus-visible{outline:2px solid #B8901A;background:#FFF6D6}
[data-b].marked{background:#FBE7A6!important;outline:2px solid #B8901A!important}
.note{margin:6px 10px 10px;padding:10px 12px;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--mark-line);font-family:var(--sans)}
.note .lbl{margin-bottom:2px}
.small-note{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 12px;font-size:15px}
.small-note .linkbtn{min-height:44px;padding:0;font-size:14px}
.pt-banner{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--mark);font-size:15.5px}
.tbl{width:100%;border-collapse:collapse;font:400 14px/1.35 var(--sans);font-variant-numeric:tabular-nums}
.tbl th{font:600 12px/1.2 var(--sans);color:#5b5b60;text-align:left;padding:8px 10px;border-bottom:1px solid #e6e6e6}
.tbl td{padding:9px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.tbl .r{text-align:right}
.tbl .sub{display:block;font-size:12.5px;color:#6a6a70}
.tbl tr.gone td{color:#6f6f75}
.tbl tr.gone .sub{color:#9b2c2c;font-weight:600}
.tbl tfoot td{font-weight:600;color:#333;border-bottom:0}
.c-net,.c-tax{display:none}
.email{padding:16px 18px 18px;font:400 15.5px/1.55 -apple-system,system-ui,sans-serif;color:#222}
.email .subj{font:600 17px/1.3 -apple-system,system-ui,sans-serif;margin:0 0 4px;padding:4px 6px;margin-left:-6px}
.email .from{font-size:13px;color:#6a6a70;margin-bottom:12px}
.email p{margin:0 0 6px;padding:5px 6px;margin-left:-6px;margin-right:-6px}
.price2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 10px}
.optthing{padding:0;overflow:hidden;display:flex;flex-direction:column}
.optthing .pc{display:block;background:#fff;color:#1d1d1f;padding:14px 12px 12px;border-bottom:1px solid #eee;filter:var(--thing-filter)}
.pc-big{display:block;font:700 22px/1.1 var(--sans);letter-spacing:-.01em}
.pc-small{display:block;font:500 13px/1.3 var(--sans);color:#3d3d42;margin-top:4px}
.pc-alt{display:block;font:400 12.5px/1.3 var(--sans);color:#6a6a70;margin-top:8px}
.pc-btn{display:block;margin-top:10px;background:#1f6f5c;color:#fff;border-radius:8px;text-align:center;font:600 13px/30px var(--sans)}
.optthing .ol{display:block;padding:10px 12px}
.mini{display:flex;justify-content:center;padding:18px 0 20px;background:#f3f3f1}
.mini-scr{width:236px;background:#fff;border-radius:26px;border:7px solid #1d1d1f;padding:22px 16px 18px;color:#1d1d1f}
.mini-scr p{margin:0 0 8px;padding:4px;font:600 16px/1.3 var(--sans)}
.mini-scr .stars{font-size:28px;letter-spacing:4px;color:#e0a100;padding:2px 4px;margin-bottom:8px}
.mini-scr .lab{font:500 13.5px/1.35 var(--sans)} .mini-scr .lab span{display:block;color:#6a6a70;font-weight:400}
.mini-scr .area{height:56px;border:1px solid #d8d8dc;border-radius:10px;margin:0 4px 12px}
.mini-scr .mb{background:#1f6f5c;color:#fff;border-radius:10px;text-align:center;font:600 15px/42px var(--sans);margin:0 4px}
.mini-scr .skip{text-align:center;font:500 13px/1 var(--sans);color:#6a6a70;margin-top:12px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:18px 14px;background:#f6f6f4}
.ba .col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ba .l{font:500 12px/1 var(--sans);color:#6a6a70}
.uib{display:inline-block;background:#1f6f5c;color:#fff;border-radius:10px;padding:10px 14px;font:600 15px/1.2 var(--sans)}
.uib.old{background:#e3e3e0;color:#55555a}
.uil{font:600 17px/1.2 var(--sans);color:#1d1d1f;padding:6px 0}
.uil.old{color:#6f6f75;text-decoration:line-through}
.arrow{color:#8a8a90;font-size:20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px}
.tiles i{display:block;aspect-ratio:4/3;border-radius:6px}
.bignum{padding:18px 16px 6px}
.bignum b{display:block;font:700 30px/1.1 var(--sans);letter-spacing:-.015em;color:#1d1d1f}
.bignum span{display:block;font-size:14.5px;color:#55555a;margin-top:4px}
.sms{padding:14px 14px 6px;background:#f6f6f4}
.sms .t{font:500 12px/1 var(--sans);color:#6a6a70;text-align:center;margin:4px 0 8px}
.sms .b{background:#e9e9eb;color:#1d1d1f;border-radius:18px;padding:9px 13px;max-width:86%;font-size:15px;line-height:1.4;margin-bottom:12px}
.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 12px;background:#f3f3f1}
.scr{background:#fff;border:4px solid #1d1d1f;border-radius:14px;padding:10px 8px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.scr b{font:600 12.5px/1.25 var(--sans);color:#1d1d1f}
.scr i{display:block;height:20px;border:1px solid #d8d8dc;border-radius:5px;font:400 11.5px/18px var(--sans);font-style:normal;color:#6a6a70;padding:0 5px;overflow:hidden;white-space:nowrap}
.scr u{margin-top:auto;display:block;background:#1f6f5c;color:#fff;text-decoration:none;border-radius:6px;font:600 12px/24px var(--sans);text-align:center}
.compare{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px;color:#3d3d42;background:#fff;border-top:1px solid #eee}

/* evidence */
.ev{margin:0 0 18px}
.ev summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font:600 15.5px/1.3 var(--sans)}
.ev summary::-webkit-details-marker{display:none}
.ev summary::after{content:"›";margin-left:auto;color:var(--ink-3);font-size:22px;transition:transform .2s}
.ev[open] summary::after{transform:rotate(90deg)}
.ev .by{font-size:14px;color:var(--ink-2);margin:0 0 8px}
.ev ol,.ev ul{margin:0;padding:0;list-style:none}
.ev li{padding:7px 0 7px 26px;position:relative;font-size:15.5px;border-top:1px solid var(--rule)}
.ev li .ck{position:absolute;left:2px;top:7px;color:var(--accent-ink);font-weight:700}
.assumed{margin:0 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--ink-3)}
.assumed ul{margin:6px 0 0;padding:0 0 0 18px}
.assumed li{margin:4px 0;font-size:15.5px}
.linkbtn.undo{font-size:14px;min-height:0;padding:0 2px;line-height:1.2}
.callout{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow);font-size:16px}
.callout.red{box-shadow:var(--shadow), inset 3px 0 0 var(--red)}
.callout.amber{box-shadow:var(--shadow), inset 3px 0 0 var(--amber)}
.callout .lbl{display:block;margin-bottom:2px}
.after{padding:6px 0}
.after .big{font:600 22px/1.3 var(--sans);margin:6px 0 12px}
.rule{font:italic 400 19px/1.4 var(--serif);color:var(--his);padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;margin:6px 0 12px}

/* ledger */
.ledger h3{font:600 13px/1.3 var(--sans);color:var(--ink-2);margin:0 0 4px;letter-spacing:.01em}
.figs{margin:8px 0 14px}
.figs b{font-size:24px}
.lrow{padding:12px 0;border-top:1px solid var(--rule)}
.lrow p{margin:0 0 4px}
.lrow ul{margin:6px 0 0;padding:0 0 0 18px;font-size:15.5px}
.lrow li{margin:3px 0}
.lrow details summary{cursor:pointer;color:var(--accent-ink);font:600 15px/1.3 var(--sans);min-height:44px;display:flex;align-items:center}
.n1{font-variant-numeric:tabular-nums;font-weight:700}

/* end */
.end{max-width:600px;margin:0 auto;padding:16vh 24px 150px}
.horizon{height:2px;width:72px;background:var(--accent);transform-origin:left;animation:draw .9s var(--ease) both;margin-bottom:26px;border-radius:1px}
.end h1{font:650 38px/1.1 var(--sans);letter-spacing:-.02em;margin:0 0 8px;animation:rise .5s .15s var(--ease) both}
.end .lead{font-size:21px;margin:0 0 26px;animation:rise .5s .25s var(--ease) both}
.end .rest{animation:rise .5s .35s var(--ease) both}
.end .nx{padding:14px 0;border-top:1px solid var(--rule);margin:0}

/* pages one level down */
.page{max-width:660px;margin:0 auto;padding:8px 20px 150px;animation:rise .3s var(--ease) both}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;padding:0;color:var(--accent-ink);font:600 16px/1 var(--sans)}
.page h1{font:650 27px/1.15 var(--sans);letter-spacing:-.01em;margin:8px 0 8px}
.page h2{font:600 13px/1.3 var(--sans);color:var(--ink-2);margin:26px 0 6px;letter-spacing:.01em}
.prom{list-style:none;margin:0;padding:0}
.prom li{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:11px 0;border-top:1px solid var(--rule);align-items:baseline}
.prom .g{font:500 18px/1.3 var(--serif)}
.prom .w{font:600 15px/1.3 var(--sans);text-align:right;max-width:11em}
.prom .w.moved{color:var(--amber)}
.prom .s{grid-column:1/3;font-size:14px;color:var(--ink-2)}
.prom button{all:unset;cursor:pointer}
.prom button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.pc-row{padding:14px 0;border-top:1px solid var(--rule)}
.pc-row h3{font:600 18px/1.3 var(--sans);margin:0}
.pc-row .s{font-size:14.5px;color:var(--ink-2);margin:2px 0 8px}
.pc-row ul{list-style:none;margin:0;padding:0}
.pc-row li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15.5px;border-top:1px dashed var(--rule)}
.pc-row li button{background:none;border:0;padding:0;min-height:44px;text-align:left;font:500 17px/1.3 var(--serif);color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.pc-row li span{color:var(--ink-2);font-size:14.5px;text-align:right}
.asleep h3{color:var(--ink-2)}
.cost{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.cost div{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--shadow)}
.cost b{display:block;font:700 20px/1.2 var(--sans);font-variant-numeric:tabular-nums}
.cost span{display:block;font-size:13px;line-height:1.35;color:var(--ink-2);margin-top:2px}
.page h1.his{font-family:var(--serif);font-weight:500;font-size:30px}
.life{list-style:none;margin:0;padding:0}
.life li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:15.5px}
.life li span{color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}

/* lock screen: his phone */
.lockwrap{display:flex;justify-content:center;min-height:calc(100vh - var(--bar))}
.lock{flex:1;position:relative;background:radial-gradient(130% 80% at 25% 0%,#4a6a60 0%,#22322f 46%,#0c1312 100%);color:#fff;padding:60px 14px 40px;display:flex;flex-direction:column;align-items:center}
.lock .ld{font:500 19px/1.2 var(--sans);opacity:.92}
.lock .lt{font:300 86px/1 var(--sans);letter-spacing:-.03em;margin:4px 0 34px;font-variant-numeric:tabular-nums}
.notif{width:100%;max-width:372px;text-align:left;background:rgba(246,245,240,.86);color:#111;border:0;border-radius:22px;padding:12px 14px 13px;box-shadow:0 10px 30px rgba(0,0,0,.28);animation:drop .55s var(--ease) both}
.notif .na{display:flex;justify-content:space-between;font:500 13px/1.2 var(--sans);color:#3c3c40;margin-bottom:4px}
.notif .na i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.notif .na i::before{content:"";width:18px;height:18px;border-radius:5px;background:#2D5B4C;display:inline-block}
.notif .nt{font:650 16px/1.25 var(--sans)}
.notif .nb{font:400 15px/1.35 var(--sans);margin-top:2px}
.lockcap{display:none}

/* overlays */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,11,.42);animation:fade .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-top:1px solid var(--card-border);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .3s var(--ease) both;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet h2{font:600 21px/1.25 var(--sans);margin:0 0 12px}
.orow{display:block;width:100%;text-align:left;min-height:56px;padding:12px 14px;margin:0 0 10px;border-radius:14px;border:1.5px solid var(--rule);background:var(--surface)}
.orow b{display:block;font:600 16.5px/1.3 var(--sans)}
.orow span{display:block;font-size:14.5px;color:var(--ink-2);margin-top:2px}
.orow.rec{border-color:var(--accent)}
.listen{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 6px}
.bigmic{width:84px;height:84px;border-radius:42px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;position:relative}
.bigmic.on::before{content:"";position:absolute;inset:-10px;border-radius:52px;border:2px solid var(--accent);animation:pulse 1.2s ease-out infinite}
.heard{font:italic 400 20px/1.45 var(--serif);color:var(--his);margin:4px 0 14px;min-height:30px}
.reply{font-size:17px;margin:0 0 16px}
.sayrow{display:flex;gap:10px;margin-top:6px}
.sayrow .say-in{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:22px;font:500 15px/1.3 var(--sans);width:max-content;max-width:calc(100% - 40px);box-shadow:0 6px 24px rgba(0,0,0,.2);animation:toast 6s var(--ease) both;display:flex;align-items:center;gap:10px}
.toast span{padding:4px 0}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:16px;min-height:36px;padding:0 12px;font:600 14px/1 var(--sans)}
.faceid{display:grid;place-items:center;gap:12px;padding:20px 0}
.faceid i{width:64px;height:64px;border-radius:16px;border:3px solid var(--accent);animation:pulse2 1s ease-in-out infinite}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
@keyframes pulse{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
@keyframes pulse2{50%{transform:scale(.92)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}6%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- desk ---------- */
@media (min-width:1000px){
  body{font-size:17px}
  .door{padding-top:40px}
  .door h1{font-size:38px}

  .sit-head{display:none}
  .rail{display:block;position:sticky;top:calc(var(--bar) + 30px);align-self:start}
  .main{padding:0}
  .aside{padding:6px 0 0;position:sticky;top:calc(var(--bar) + 30px);align-self:start;max-height:calc(100vh - var(--bar) - 50px);overflow:auto}
  .acts{position:sticky;bottom:0;left:auto;right:auto;padding:18px 0 22px;margin-top:6px;flex-wrap:nowrap;grid-column:2;grid-row:2}
  html .ph{display:none} html .dk{display:inline}
  .dock{position:static;display:block;background:none;max-width:620px;margin:0 auto;padding:0 20px 48px}
  .door{padding-bottom:60px}
  .acts .btn{flex:0 0 auto;min-width:150px;padding:0 22px}
  .toast{bottom:40px}
  .ev summary{pointer-events:none}
  .ev summary::after{display:none}
  .c-net,.c-tax{display:table-cell}
  .tbl .sub.inv{display:none}
  .c-inv{display:table-cell!important}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:520px;transform:translate(-50%,-50%);border-radius:20px;animation:fade .2s both}
  .lockwrap{padding:36px 0 40px;flex-direction:column;align-items:center;gap:16px}
  .lock{flex:none;width:310px;height:540px;border-radius:44px;border:10px solid #0b0b0b;box-shadow:0 30px 80px rgba(0,0,0,.25);padding-top:44px}
  .lock .lt{font-size:72px;margin-bottom:26px}
  .lockwrap{min-height:0;padding:24px 0 30px}
  .lockcap{display:block;font-size:15px;color:var(--ink-2)}
  .end{padding-top:18vh}
  .end h1{font-size:46px}
}
.c-inv{display:none}
.dk{display:none}
html.still *{animation:none!important;transition:none!important}
.r-lbl{margin-bottom:10px}
.r-list{list-style:none;margin:0 0 14px;padding:0}
.r-it{display:grid;grid-template-columns:18px 1fr auto;gap:0 8px;width:100%;text-align:left;background:none;border:0;padding:10px 10px;border-radius:10px;align-items:baseline;min-height:44px}
.r-it:hover{background:var(--surface-2)}
.r-it .ic{font:700 13px/1 var(--sans);color:var(--ink-3)}
.r-it .rv{display:block;font:600 12px/1.3 var(--sans);color:var(--accent-ink)}
.r-it .rv.amber{color:var(--amber)} .r-it .rv.red{color:var(--red)}
.r-it .rg{font:500 16px/1.25 var(--serif)}
.r-it .rm{font:500 13px/1 var(--sans);color:var(--ink-2);white-space:nowrap}
.r-it[aria-current="step"]{background:var(--surface);box-shadow:var(--shadow), inset 3px 0 0 var(--accent);border:1px solid var(--card-border)}
.r-it.done .rg,.r-it.done .rv{opacity:.5}
.r-it.done .ic{color:var(--accent-ink)}
.r-after{font-size:14.5px;color:var(--ink-2);padding:12px 10px 0;border-top:1px solid var(--rule);margin:0}
.r-left{font:600 14px/1.3 var(--sans);padding:0 10px 10px}
</style>

function renderProto(){

/* ================= behaviour ================= */
function afterRender(){
  S.enter = false;
  if (S.focus){ const el = $(S.focus); if (el) el.focus({preventScroll:false}); S.focus = null; }
}
function go(view, focus){ S.view = view; S.focus = focus || null; window.scrollTo(0,0); render(); }
function complete(label, toast){
  S.out[S.i] = label || 'done';
  S.toast = toast || null;
  if (toast && S.items[S.i].kind !== 'read'){ S.undoI = S.i; S.lastUndo = S.i; }
  advance();
}
function advance(){
  const left = remaining();
  const doneCount = Object.keys(S.out).length;
  if (!left.length || (S.limit && doneCount >= S.limit)){ S.limit = null; go('end', '#end-h'); return; }
  S.i = left.find(i => i > S.i) ?? left[0];
  S.enter = true; go('sit', '#goal');
}
function act(a, d){
  const it = S.items[S.i], s = S.view==='sit' ? st(S.i) : null;
  switch(a){
    case 'begin': if (d.limit) S.limit = +d.limit; if (M[S.m].told) S.toldSeen = true; { const l = remaining(); if (!l.length) return; S.i = l[0]; } S.enter = true; go('sit', '#goal'); break;
    case 'goto': S.i = +d.i; S.overlay = null; S.enter = true; go('sit', '#goal'); break;
    case 'order': S.overlay = 'order'; S.focus = '.sheet .r-it[aria-current]'; render(); break;
    case 'leave': go('door', '#door-h'); break;
    case 'home': S.page = null; go('door', '#door-h'); break;
    case 'go': complete('agreed', `✓ Agreed${Object.keys(s.fix).length?', with your change':''}. ${it.next.split('.')[0]}.`); break;
    case 'next': complete(it.kind==='agree'?'agreed':'done'); break;
    case 'accept': complete('accepted', it.kind==='read' ? null : `✓ ${it.goal}: accepted`); break;
    case 'pick': s.picks[+d.c] = +d.o;
      if (it.kind==='decide' && it.choices.length===1){ render(); setTimeout(()=>complete('decided', `✓ ${it.done.replace('yearly first', d.o==='0'?'yearly first':'monthly first')}`), 450); }
      else render(); break;
    case 'decided': complete('decided', `✓ ${it.done}`); break;
    case 'fix': if (s.fix[d.k] === undefined){ s.fix[d.k] = ''; S.focus = `#ed-${d.k}`; render(); } break;
    case 'fixchip': s.fix[d.k] = d.v; render(); break;
    case 'unfix': delete s.fix[d.k]; render(); break;
    case 'point': s.stage = 'point'; S.focus = '.pointing [data-b]'; render(); break;
    case 'cancelpoint': s.stage = 'main'; s.marks = {}; render(); break;
    case 'mark': if (s.marks[d.b] === undefined){ s.marks[d.b] = {c:[], t:''}; S.active = d.b; } else if (S.active !== d.b && (s.marks[d.b].c.length || s.marks[d.b].t)) S.active = d.b; else { delete s.marks[d.b]; S.active = null; } render(); break;
    case 'editnote': S.active = d.n; render(); break;
    case 'notechip': { const n = s.marks[d.n]; const k = n.c.indexOf(d.v); if (k<0) n.c.push(d.v); else n.c.splice(k,1); render(); } break;
    case 'sendback': s.stage = 'scope'; S.focus = '.opt'; render(); break;
    case 'scope': {
      const sc = it.scope; const n = Object.keys(s.marks).length;
      s.afterHtml = sc ? `<p class="big">Sent back with ${n} note${n>1?'s':''}.</p>${+d.o===0?`<p class="lbl">Kept as a rule</p><p class="rule">${sc.rule}</p>`:'<p>Kept for this email only.</p>'}<p>${sc.after}</p>`
        : `<p class="big">Sent back with ${n} note${n>1?'s':''}.</p><p>It comes back at your next sitting, with only the parts you pointed at changed.</p>`;
      s.stage = 'after'; render(); } break;
    case 'notnow': S.overlay = 'park'; S.focus = '.orow'; render(); break;
    case 'park': { const pk = it.park || {opts:[{msg:'Parked until tomorrow morning.'},{msg:'Parked until Monday.'},{msg:'Parked until the day you picked.'}]};
      S.overlay = null; S.out[S.i] = 'parked'; S.toast = `${pk.opts[+d.o].msg} Nothing for you to remember.`; S.undoI = S.lastUndo = S.i; advance(); } break;
    case 'close': S.overlay = null; S.say = null; render(); break;
    case 'signin': s.stage = 'signing'; render(); setTimeout(()=>{ s.stage = 'after'; S.focus = '[data-primary]'; render(); }, 1300); break;
    case 'letwait': complete('waited', 'The update waits until next Tuesday.'); break;
    case 'pull': S.pulled = true; S.items.push(Object.assign({key:M[S.m].held}, I[M[S.m].held])); S.i = S.items.length-1; S.enter = true; go('sit', '#goal'); break;
    case 'undo': S.toast = 'Undone. It changes back before it ships.'; render(); break;
    case 'undolast': { const j = +S.lastUndo; delete S.out[j]; S.st[j] = null; delete S.st[j]; S.i = j; S.enter = true; go('sit', '#goal'); } break;
    case 'raw': S.rawKey = d.k; S.rawFrom = S.view; go('raw', '#pg-h'); break;
    case 'rawback': go(S.rawFrom || 'door', S.rawFrom === 'sit' ? '#goal' : '#pg-h'); break;
    case 'ask': S.toast = 'It goes to the checker directly, not through me. The answer comes back unedited, in your next sitting.'; render(); break;
    case 'pauseall': S.toast = 'All work is paused. Nothing new starts and nothing ships until you say “carry on”.'; render(); break;
    case 'revoke': S.overlay = 'revoke'; S.focus = '.orow'; render(); break;
    case 'revoked': S.overlay = null; S.toast = `Taken back: ${d.v.charAt(0).toLowerCase() + d.v.slice(1)}. From now on I ask you about it on ${S.goalKey}.`; render(); break;
    case 'ctl': S.toast = {pause:`Paused. Nothing more happens on ${S.goalKey} until you say “carry on”.`, amend:`Every line of the agreement for ${S.goalKey} will be open to change at your next sitting. Until then, work keeps to the current one.`, undo:`Undone: ${S.goalKey} is back as it was before its last change. Nothing else moved.`, stop:`Stopped. ${S.goalKey} is closed and kept in the record; nothing half-done ships.`}[d.c]; render(); break;
    case 'feel': S.toast = 'Noted. Next week’s sittings are sized with it.'; render(); break;
    case 'takeback': S.toast = 'Taken back: wording changes are shown to you again.'; render(); break;
    case 'glance': go('glance', '#pg-h'); break;
    case 'behind': go('behind', '#pg-h'); break;
    case 'goal': S.goalKey = d.g; S.goalFrom = d.from || 'behind'; go('goal', '#pg-h'); break;
    case 'notif': S.items = [Object.assign({key:'knock'}, I.knock)]; S.out = {}; S.st = {}; S.i = 0; S.enter = true; go('sit', '#goal'); break;
    case 'peek': go('door', '#door-h'); break;
    case 'lock': go('lock'); break;
    case 'say': S.overlay = 'say'; S.say = {stage:'idle'}; S.focus = '.bigmic'; render(); break;
    case 'listen': listen(); break;
    case 'saysend': { const v = ($('.say-in')||{}).value || ''; if (!v.trim()) return; S.say = {stage:'heard', text:v.trim(), reply:'Got it. I’ll say back what I heard at your next sitting. Nothing else for you to do now.'}; S.focus = '.sheet .btn'; render(); } break;
  }
}
function listen(){
  const m = M[S.m];
  const sc = m.say || {text:'Let customers pay by bank transfer on the shop site.', reply:'Got it. That’s the shop site’s checkout. I’ll say back what I heard at your next sitting.'};
  const words = sc.text.split(' ');
  S.say = {stage:'listening', shown:''}; render();
  let k = 0;
  const tick = () => {
    if (S.overlay !== 'say') return;
    k++; S.say.shown = words.slice(0,k).join(' ');
    const h = $('.heard'); if (h) h.textContent = `“${S.say.shown}”`;
    if (k < words.length) setTimeout(tick, 110);
    else setTimeout(()=>{ if (S.overlay!=='say') return; S.say = {stage:'heard', text:sc.text, reply:sc.reply}; S.focus = '.sheet .btn'; render(); }, 650);
  };
  setTimeout(tick, 400);
}

document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]');
  if (p){ proto(p.dataset.p); return; }
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  if (t.closest('.note') && t.dataset.act === 'mark') return;
  act(t.dataset.act, t.dataset);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.in) return;
  const s = st(S.i);
  if (t.dataset.in === 'fix') s.fix[t.dataset.k] = t.value;
  if (t.dataset.in === 'note' && s.marks[t.dataset.n]) s.marks[t.dataset.n].t = t.value;
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches && t.matches('input, textarea, select')){
    if (e.key === 'Escape') t.blur();
    if (e.key === 'Enter' && t.classList.contains('say-in')) act('saysend', {});
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ']'){ proto('next'); return; }
  if (e.key === '['){ proto('prev'); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button'){ e.preventDefault(); t.click(); return; }
  const onButton = t.tagName === 'BUTTON' || t.tagName === 'SUMMARY';
  if (e.key === 'Escape'){
    if (S.overlay){ act('close', {}); return; }
    if (S.view === 'sit'){ const s = st(S.i); if (s.stage==='point') act('cancelpoint', {}); else act('leave', {}); return; }
    if (['glance','behind','goal'].includes(S.view)){ act('home', {}); return; }
  }
  if (S.overlay) return;
  if (e.key === 'Enter' && !onButton){ const b = $('[data-primary]:not([disabled])'); if (b){ e.preventDefault(); b.click(); } return; }
  const k = e.key.toLowerCase();
  if (S.view === 'door'){ if (k==='s'){ e.preventDefault(); act('say', {}); } if (k==='g') act('glance', {}); return; }
  if (S.view === 'glance' && k === 'b'){ act('behind', {}); return; }
  if (S.view !== 'sit') return;
  const s = st(S.i), it = S.items[S.i];
  if (k === 'p' && it.kind === 'look' && s.stage === 'main'){ act('point', {}); return; }
  if (k === 'n' && $('[data-act="notnow"]')){ act('notnow', {}); return; }
  if (s.stage === 'point' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || k === 'j' || k === 'k')){
    e.preventDefault();
    const bl = [...document.querySelectorAll('.pointing [data-b]')]; let ix = bl.indexOf(document.activeElement);
    ix = (e.key === 'ArrowDown' || k === 'j') ? Math.min(bl.length-1, ix+1) : Math.max(0, ix-1);
    bl[ix] && bl[ix].focus(); return;
  }
  if (/^[1-4]$/.test(k)){
    const opts = [...document.querySelectorAll('.main [data-act="pick"], .main [data-act="scope"]')];
    const groups = {}; opts.forEach(o => { const c = o.dataset.c || 's'; (groups[c] = groups[c] || []).push(o); });
    const first = Object.keys(groups).find(c => c==='s' || s.picks[+c] === undefined) || Object.keys(groups)[0];
    const b = first && groups[first][+k-1]; if (b) b.click();
  }
});
function proto(a){
  if (a === 'next' && S.m < M.length-1) load(S.m+1);
  if (a === 'prev' && S.m > 0) load(S.m-1);
  if (a === 'theme'){ const cur = document.documentElement.dataset.theme; S.theme = cur === 'dark' ? 'light' : 'dark'; render(); }
  if (a === 'note'){ S.note = $('#p-note').hidden; render(); }
}

/* ================= instrumentation: #count=1 counts the words he must read on the scripted path ================= */
function countWeek(){
  const W = html => { const d = document.createElement('div'); d.innerHTML = html;
    d.querySelectorAll('kbd,.vh,.sit-head,.rail').forEach(e => e.remove());
    d.querySelectorAll('details[data-opt]').forEach(e => [...e.children].forEach(c => { if (c.tagName !== 'SUMMARY') c.remove(); }));
    return (d.textContent.match(/[A-Za-z0-9$“"(][^\s]*/g) || []).length; };
  const body = i => { const it = S.items[i]; const b = {agree:rAgree, look:rLook, decide:rDecide, knock:rKnock, read:rRead}[it.kind](it, st(i), i); return b.main + (b.aside || ''); };
  const plan = {0:['door',0,1,2,'end'], 1:['door','say'], 3:['door',0,1,2,3,[3,'point'],[3,'scope'],[3,'after'],'end'],
    5:['door',0,'park',1,2,3,'end'], 6:['notif',0,[0,'after'],'end'], 7:['door','glance'], 8:['door',0,1,2,'end'], 9:['door','say'], 11:['door',0,1,2,3,4,5,'end'], 13:['door','glance','behind','goal']};
  const out = []; let total = 0;
  Object.keys(plan).forEach(k => {
    const mi = +k; load(mi, true); let n = 0; const parts = [];
    plan[k].forEach(step => {
      let w = 0;
      if (step === 'door'){ S.view = 'door'; w = W(rDoor()) - W(sayDock()); }
      else if (step === 'say'){ w = W(M[mi].say.reply); }
      else if (step === 'park'){ S.overlay = 'park'; w = W(rOverlay()); S.overlay = null; }
      else if (step === 'notif'){ w = W(rLock()); }
      else if (step === 'end'){ S.items.forEach((x,j) => S.out[j] = 'done'); w = W(rEnd()); }
      else if (step === 'glance'){ w = W(rGlance()); }
      else if (step === 'behind'){ w = W(rBehind()); }
      else if (step === 'goal'){ S.goalKey = 'Driver ratings'; w = W(rGoal()); }
      else if (typeof step === 'number'){ S.i = step; w = W(body(step)); S.out[step] = 'done'; }
      else { const [i, stage] = step; S.i = i; const s = st(i); s.stage = stage; s.marks = JSON.parse(JSON.stringify(S.items[i].demo || {}));
        if (stage === 'after') s.afterHtml = '<p>Sent back with 3 notes.</p><p>Kept as a rule</p><p>' + (S.items[i].scope ? S.items[i].scope.rule + '</p><p>' + S.items[i].scope.after : '') + '</p>';
        w = stage === 'point' ? 12 + 6 * Object.keys(s.marks).length : W(body(i)); }
      n += w; parts.push(`${typeof step === 'object' ? step.join(':') : step}=${w}`);
    });
    total += (mi === 13 || mi === 7) ? 0 : n;
    out.push(`${M[mi].when}\t${n}\t${parts.join(' ')}`);
  });
  out.push(`TOTAL (without the two optional looks: 15:40 and Mon 11:00)\t${total}`);
  return out.join('\n');
}

/* #selftest=1 clicks through every moment of the week and reports what it saw */
async function selftest(){
  const log = [], wait = ms => new Promise(r => setTimeout(r, ms));
  const click = sel => { const el = $(sel); if (!el) throw new Error(`missing ${sel} (m${S.m} ${S.view} i${S.i})`); el.click(); };
  const key = k => document.dispatchEvent(new KeyboardEvent('keydown', {key:k, bubbles:true}));
  const see = (what) => log.push(`m${S.m} ${what}: ${S.view}${S.view==='sit'?' i'+S.i:''} | ${($('h1,h2.goal')||{}).textContent||''}`);
  window.addEventListener('error', e => log.push('ERROR ' + e.message));
  try {
    load(0); key('Enter'); see('enter begins'); click('[data-act="fix"][data-k="d0"]'); click('[data-act="fixchip"]'); see('fixed a line');
    key('Enter'); see('go'); click('[data-act="accept"]'); see('accepted'); click('.toast [data-act="undolast"]'); see('undo accept'); click('[data-act="accept"]'); see('accepted again'); click('[data-act="pick"][data-o="0"]'); await wait(600); see('picked yearly');
    click('[data-act="pull"]'); see('pulled email'); click('[data-act="accept"]'); see('after pull'); click('[data-act="home"]'); see('home');
    click('[data-act="glance"]'); see('glance'); click('[data-act="behind"]'); see('behind'); click('[data-act="goal"]'); see('goal'); key('Escape'); see('esc home');
    load(1); key('s'); see('say opened'); click('[data-act="listen"]'); await wait(2500); log.push('heard: ' + (S.say && S.say.text)); click('.sheet .btn'); see('say closed');
    load(2); see('lock'); click('#p-note [data-act="peek"]'); see('peek');
    load(3); click('[data-act="begin"]'); click('[data-act="go"]'); click('[data-act="pick"][data-c="0"][data-o="1"]'); click('[data-act="pick"][data-c="1"][data-o="0"]'); click('[data-act="decided"]'); see('signup decided');
    key('1'); await wait(600); see('photos by key 1'); key('p'); see('point mode');
    click('[data-b="p1"]'); click('[data-act="notechip"][data-v="Wrong tone"]'); click('[data-b="p2"]'); click('[data-act="notechip"][data-v="Cut this"]'); click('[data-b="p5"]'); click('[data-act="notechip"][data-v="Too long"]');
    click('[data-act="sendback"]'); see('scope'); click('[data-act="scope"][data-o="0"]'); log.push('rule shown: ' + !!$('.rule')); click('[data-act="next"]'); see('end');
    load(5); log.push('told lines: ' + document.querySelectorAll('.told p').length); click('[data-act="begin"]'); log.push('told after begin, door: ' + (S.toldSeen));
    key('n'); see('park sheet ' + !!$('.sheet')); click('[data-act="park"][data-o="0"]'); see('parked'); click('[data-act="accept"]'); click('[data-act="leave"]'); see('left'); log.push('door says: ' + $('#door-h').textContent);
    click('[data-act="begin"]'); click('[data-act="accept"]'); see('spot-check'); click('[data-act="raw"]'); see('raw report'); click('[data-act="rawback"]'); click('[data-act="accept"]'); see('wed end');
    load(6); click('[data-act="notif"]'); see('knock'); click('[data-act="signin"]'); await wait(1600); see('signed'); click('[data-act="next"]'); see('knock end');
    load(7); see('watcher down'); click('[data-act="glance"]'); log.push('stale rows: ' + document.querySelectorAll('.stale').length);
    load(8); log.push('thu told: ' + document.querySelectorAll('.told p').length); click('[data-act="begin"]'); click('[data-act="accept"]'); click('[data-act="accept"]'); click('[data-act="pick"][data-o="0"]'); await wait(600); see('thu end');
    load(11); click('[data-act="begin"][data-limit="3"]'); click('[data-act="accept"]'); click('[data-act="accept"]'); click('[data-act="accept"]'); see('after 3');
    click('[data-act="begin"]'); see('kept going'); click('[data-act="accept"]'); click('[data-act="go"]'); see('week'); click('[data-act="accept"]'); see('mon end');
    load(12); see('ledger direct'); click('[data-act="takeback"]'); load(13); see('curiosity door'); click('[data-act="glance"]'); click('.gl'); see('goal from list'); click('[data-act="ctl"][data-c="pause"]'); log.push('toast: ' + ($('.toast')||{}).textContent);
    click('[data-act="revoke"]'); click('[data-act="revoked"]'); log.push('toast: ' + ($('.toast')||{}).textContent); click('[data-act="back"], .back'); see('back');
  } catch (e) { log.push('FAIL ' + e.message); }
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = log.join('\n'); document.body.appendChild(pre);
}

/* ================= start: hash lets screenshots jump to a state ================= */
(function start(){
  const sel = $('#p-sel');
  sel.innerHTML = M.map((m,i)=>`<option value="${i}">${m.when} · ${m.ev.length ? (m.ev.length>1?'events ':'event ') + m.ev.join(', ') : 'extra'} · ${m.title}</option>`).join('');
  sel.addEventListener('change', () => { load(+sel.value); });
  const q = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (q.a === '0') document.documentElement.classList.add('still');
  if (q.selftest){ selftest(); return; }
  if (q.count){ const r = countWeek(); const pre = document.createElement('pre'); pre.id = 'count'; pre.textContent = r; document.body.appendChild(pre); return; }
  if (q.t) S.theme = q.t;
  if (q.n) S.note = q.n === '1';
  load(+(q.m||0), true);
  if (q.v) S.view = q.v;
  if (q.i != null){ S.view = 'sit'; S.i = +q.i; for (let j=0;j<S.i;j++) S.out[j] = S.out[j] || 'done'; }
  if (q.g) S.goalKey = q.g;
  if (q.s){ const s = st(S.i); s.stage = q.s; if (q.d && S.items[S.i].demo){ s.marks = JSON.parse(JSON.stringify(S.items[S.i].demo)); Object.values(s.marks).forEach(x=>{x.t=x.t||'';}); S.active = q.ac || null; } }
  if (q.pk){ const s = st(S.i); q.pk.split(',').forEach((v,c)=>{ if (v!=='') s.picks[c] = +v; }); }
  if (q.fx){ st(S.i).fix[q.fx] = 'Only the average, never single ratings.'; }
  if (q.o === 'say'){ S.overlay = 'say'; const sc = M[S.m].say; S.say = sc ? {stage:'heard', text:sc.text, reply:sc.reply} : {stage:'idle'}; }
  if (q.o === 'park' || q.o === 'order' || q.o === 'revoke') S.overlay = q.o;
  if (q.ts){ S.toast = '✓ Invoice export: accepted'; S.undoI = S.lastUndo = 1; }
  if (q.rk){ S.rawKey = q.rk; S.rawFrom = 'sit'; S.view = 'raw'; }
  if (q.o === 'sayidle'){ S.overlay = 'say'; S.say = {stage:'idle'}; }
  if (q.e){ S.view = 'end'; S.items.forEach((x,j)=>{ S.out[j] = 'done'; }); }
  if (q.s === 'after' && S.items[S.i] && S.items[S.i].kind === 'look'){ const it = S.items[S.i]; const s = st(S.i); s.marks = JSON.parse(JSON.stringify(it.demo||{})); act('scope', {o:'0'}); return; }
  if (q.s === 'after' && S.items[S.i] && S.items[S.i].kind === 'knock'){ render(); return; }
  render();
  window.addEventListener('resize', () => { clearTimeout(window.__r); window.__r = setTimeout(render, 150); });
})();
</script>
