<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The sheet</title>
<style>
:root{
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ph:48px;
}
/* Three voices. Black serif: the one who prepares everything. Blue italic: him. Plain sans: anyone else, unedited (a checker, the record).
   Dashes always mean "not known": not checked, not seen. Red appears once: the thing that cannot wait. */
html[data-theme=light]{
  --desk:#d9d5ca; --wall:radial-gradient(120% 70% at 50% -10%,#fbf4e2 0%,rgba(251,244,226,0) 62%),linear-gradient(165deg,#e8e2d5,#cdd3d6);
  --paper:#faf7f0; --paper2:#f0ece2; --text:#1d1c1a; --soft:#57534b; --faint:#8b867b; --rule:#ddd7c9;
  --ink:#2340b8; --wash:#e7ebf9; --onink:#fff; --pencil:#66625a;
  --alarm:#a3271a; --onalarm:#fff;
  --glass:rgba(255,255,255,.5); --gedge:rgba(255,255,255,.8);
  --thing:#fff; --shadow:0 1px 2px rgba(40,30,10,.08),0 14px 40px rgba(40,30,10,.13); --hatch:rgba(60,50,30,.09);
}
html[data-theme=dark]{
  --desk:#0e0e0d; --wall:radial-gradient(120% 70% at 50% 112%,#2b2219 0%,rgba(43,34,25,0) 62%),linear-gradient(165deg,#1a1b1d,#0b0c0e);
  --paper:#1c1b19; --paper2:#151413; --text:#ebe5d9; --soft:#aea89c; --faint:#7f796e; --rule:#37342f;
  --ink:#b9c8ff; --wash:#232a45; --onink:#10121c; --pencil:#a39d91;
  --alarm:#ff9a82; --onalarm:#1c0d09;
  --glass:rgba(255,255,255,.06); --gedge:rgba(255,255,255,.11);
  --thing:#e6e1d5; --shadow:0 0 0 1px #34312c; --hatch:rgba(255,245,220,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 var(--serif);color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
p{margin:0 0 10px}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus-visible{outline:none}
[inert]{pointer-events:none}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lab,.runin,.kick{font:600 11.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.his{color:var(--ink);font-style:italic}
html[data-theme=dark] .his,html[data-theme=dark] .inkline,html[data-theme=dark] .note{font-weight:500}
.quiet{color:var(--soft);font-size:15.5px;line-height:1.45}
.small{font-size:14px}
s{text-decoration-thickness:1.5px;color:var(--soft)}

/* ---------- the phone: lock screen and glance ---------- */
#stage{position:fixed;inset:0 0 var(--ph) 0;overflow:hidden;background:var(--wall)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:52px 16px 18px}
.clock{text-align:center;font-family:var(--sans)}
.date{font-size:17px;font-weight:500}
.time{font-size:88px;font-weight:300;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:22px}
.corner{flex:1;width:100%;max-width:372px;display:flex;flex-direction:column;gap:10px;min-height:0}
.glance{display:flex;align-items:stretch;border-radius:22px;background:var(--glass);border:1px solid var(--gedge);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.gmain{flex:1;display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:76px;border-radius:22px}
.gt{display:flex;flex-direction:column;gap:1px}
.gt b{font:600 19px/1.25 var(--serif)}
.gt span{font:400 14.5px/1.35 var(--sans);color:var(--soft)}
.gi{width:26px;display:grid;place-items:center;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:block}
.glance.due .gi{color:var(--ink)}
.glance.alarm .dot{background:var(--alarm)}
.glance.unknown{border:1.5px dashed var(--pencil)}
.glance.unknown .dot{width:24px;height:24px;background:none;border:1.5px dashed var(--pencil);display:grid;place-items:center;font:600 14px/1 var(--sans);font-style:normal;color:var(--text)}
.openit{align-self:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--glass);border:1px solid var(--gedge);font:500 15px var(--sans);color:var(--text);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.slip{border-radius:22px;padding:16px 18px;background:var(--paper);box-shadow:var(--shadow)}
.slip.alarm{box-shadow:0 0 0 2px var(--alarm),var(--shadow)}
.slip.alarm .lab{color:var(--alarm)}
.slip .lab{margin-bottom:6px}
.say{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.say button{width:68px;height:68px;border-radius:50%;background:var(--glass);border:1px solid var(--gedge);display:grid;place-items:center;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.say button .ic{width:28px;height:28px}
.say span{font:13.5px var(--sans);color:var(--text)}
.say.on button{background:var(--ink);color:var(--onink);border-color:transparent;animation:pulse 1.1s ease-in-out infinite}

/* ---------- places to make a mark ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:600 16px/1.2 var(--sans);border:1.5px solid var(--ink);color:var(--ink);background:transparent;text-align:center;position:relative;overflow:hidden}
.btn.pri{background:var(--ink);color:var(--onink)}
.btn.plain{border-color:transparent;color:var(--soft);font-weight:500;padding:0 12px}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.alarm{background:var(--alarm);border-color:var(--alarm);color:var(--onalarm)}
.btn .ic{width:19px;height:19px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .fill{position:absolute;inset:0;background:var(--onink);opacity:.25;transform-origin:left;transform:scaleX(0)}
.btn.holding .fill{transform:scaleX(1);transition:transform 1.1s linear}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.type{display:flex;gap:8px;flex:1 1 220px;min-width:0}
.type input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1.5px solid var(--faint);background:transparent;padding:0 16px;font:16px var(--sans)}
.type input::placeholder{color:var(--soft);opacity:1}
.side{min-height:44px;padding:0 0 0 14px;font:500 14px var(--sans);color:var(--soft);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.link{min-height:44px;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}

/* ---------- the sheet: one sitting, rewritten in place ---------- */
.wrap{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.sheet{max-width:640px;margin:0 auto;padding:10px 20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.lead{font-size:22px;line-height:1.36;margin:8px 0 2px;text-wrap:pretty}
.order{display:flex;flex-wrap:wrap;gap:2px 14px;font:14.5px/1.5 var(--sans);color:var(--soft);margin:4px 0 0}
.order b{font-weight:600;color:var(--text);margin-right:2px}
.know{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
.know .lab{margin-bottom:6px}
.know p{font-size:16.5px}
.klinks{display:flex;gap:18px;margin:-8px 0 2px}
.klinks .side{padding:0}
.know b{font-weight:600}
.know.miss{border-top:2px solid var(--text)}
.retbar{display:flex;gap:2px;height:10px;margin:14px 0 8px}
.retbar i{display:block;border-radius:5px;min-width:6px}
.rb1{background:var(--ink)}.rb2{background:var(--soft)}.rb3{background:var(--faint);opacity:.55}
.retleg{list-style:none;margin:0 0 12px;padding:0;font:15px/1.45 var(--sans)}
.retleg li{display:flex;gap:8px;align-items:baseline}
.retleg i{flex:none;width:10px;height:10px;border-radius:50%;transform:translateY(1px)}
.retleg b{font-weight:600}
.since{border-top:1px solid var(--rule);padding-top:10px}
.since p{font-size:16.5px;margin-bottom:6px}
.since b{font-weight:600}
.item{position:relative;border-top:1px solid var(--rule);margin-top:20px;padding-top:4px;scroll-margin-top:8px}
.item.folded,.item.done{margin-top:10px}
.hd{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.kick .n{font-family:var(--serif);font-weight:400;font-size:15px;margin-right:.6em;color:var(--text);letter-spacing:0}
.kick .min{text-transform:none;letter-spacing:0;font-weight:500}
.item h2,.fold .h{font:600 25px/1.2 var(--serif);margin:0 0 10px;text-wrap:balance}
.item h2 small,.fold .h small{font:italic 400 17px var(--serif);color:var(--soft)}
.item.done h2{font-size:19px;font-weight:500;color:var(--soft);margin-bottom:6px}
.fold{display:block;width:100%;position:relative;padding:10px 30px 8px 0;border-radius:6px}
.fold .kick{display:block}
.fold .h{display:block;font-size:20px;margin:4px 0 2px}
.fold .gist{display:block;font-size:16px;line-height:1.4;color:var(--soft)}
.fold>.ic{position:absolute;right:0;top:50%;margin-top:-11px;color:var(--soft)}
/* the one sentence that says why this reaches him at all */
.judge{margin:0 0 12px}
.judge .lab{color:var(--ink);margin-bottom:1px}
.judge p{font-size:21px;line-height:1.32;margin:0;text-wrap:pretty}
.gatehint{font:15px/1.4 var(--sans);color:var(--soft);margin:0;flex:1 1 220px;border-left:2px solid var(--faint);padding-left:10px}
.runin{margin-right:.7em}
.ln .runin{display:block;margin:4px 0 2px}
.ln ol{margin:0 0 4px;padding-left:1.35em}
.said .when{font:13px var(--sans);color:var(--soft);white-space:nowrap}
.q{font-size:19px;line-height:1.4}
/* proof is kept apart from judgement, and says nothing when it has nothing to say */
.proof{margin:2px 0 10px;font:15px/1.45 var(--sans)}
.proof>summary{color:var(--text);font-weight:500}
.proof ol{padding-left:1.3em;margin:0 0 8px}
.proof li{margin-bottom:6px}
.proof li b{font-weight:600}
.notchk{border:1.5px dashed var(--pencil);border-radius:10px;padding:8px 12px;margin:0 0 10px;font:15px/1.45 var(--sans)}
.notchk b{font-weight:600}
.proof .show{display:block;padding:0}
/* what I heard: my own words on paper, not a thing in its own colours */
.sbk{background:var(--paper);color:var(--text);border-radius:10px;padding:14px 16px 12px;box-shadow:var(--shadow)}
.started{font-size:19px;line-height:1.4;margin:12px 0 4px;border-left:2.5px solid var(--text);padding-left:14px}
/* his marks, come back on the next version where he made them */
.backmark{display:flex;gap:6px;align-items:flex-start;color:var(--ink);font:italic 14px/1.4 var(--serif);margin:-2px 0 10px}
.backmark .ic{width:16px;height:16px;stroke-width:2.4;margin-top:2px}
/* the choices that are his, on the thing they are about */
.yours{background:var(--paper);color:var(--text);border-radius:10px;padding:12px 14px 6px;box-shadow:var(--shadow);margin-top:12px}
.yours .fork{margin:8px 0 0;padding-top:8px}
.yours .lab+.fork{border-top:0;padding-top:0;margin-top:4px}
.obj .yours{background:var(--paper2);box-shadow:none;font-family:var(--serif);margin-top:12px}
.yours .q{font-size:17px;margin-bottom:2px}
.sk2{width:230px;max-width:100%;margin:10px auto 0;padding:10px 12px;border:1.5px dashed #8b867b;border-radius:12px;font:15px/1.4 var(--sans);color:#3d3a35;text-align:center}
.sk2 .t{font-size:12px;color:#66625a}
.from{border-left:2px solid var(--text);padding:1px 0 1px 14px;margin:2px 0 12px;font:15.5px/1.5 var(--sans)}
.from .lab{display:block;margin-bottom:3px}
.raw{font:13px/1.55 var(--mono);border-left:2px solid var(--faint);padding:1px 0 1px 12px;color:var(--text)}
/* what happens if he leaves it, in words */
.leave{font-size:16px;line-height:1.45;color:var(--soft);margin:12px 0 0}
.leave b{color:var(--text);font-weight:600}
.inkline{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-style:italic;margin:0 0 4px}
.inkline .ic{stroke-width:2.4;margin-top:1px}
.ask{border-left:2.5px solid var(--ink);padding:2px 0 2px 14px;margin:12px 0 0}
.ps{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.opt{min-height:48px;padding:6px 18px;border-radius:999px;border:1.5px solid var(--faint);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:600 16px/1.2 var(--sans)}
.opt small{font:italic 400 12.5px var(--serif);color:var(--soft)}
.opt.inked{border:2.5px solid var(--ink);color:var(--ink)}
.opt.inked small{color:var(--ink)}
.fork{margin:14px 0 4px;padding-top:10px;border-top:1px solid var(--rule)}
.fork:first-of-type{border-top:0;padding-top:0}
.fork .of{font:600 13px var(--sans);color:var(--soft)}
.fork .q{font-size:17px;margin-bottom:4px}
.built{margin:4px 0 12px;padding:0;list-style:none;border-left:2px solid var(--rule)}
.built li{padding:4px 0 6px 14px;font-size:16px}
.built b{font-weight:600}
details{margin:0 0 10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font:500 15px var(--sans);color:var(--soft);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details[open]>summary::before{transform:rotate(45deg)}
details ul,details ol{margin:0 0 6px;padding-left:1.3em;font-size:16px}
.foot{border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.end{font-size:22px;line-height:1.35;margin-bottom:4px}
.keys{display:none}
.sayrow{display:flex;gap:8px;margin-top:14px}
.sayrow input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1.5px solid var(--faint);background:transparent;padding:0 16px;font:16px var(--sans)}
.sayrow input::placeholder{color:var(--soft);opacity:1}

/* ---------- touch the thing where it is wrong ---------- */
.mk{cursor:pointer;border-radius:6px;padding:9px 6px;min-height:44px;margin-left:-6px;margin-right:-6px;transition:background .15s;position:relative}
p.mk{margin-bottom:2px}
li>.mk,.mail-h .mk{display:block}
.mk:hover,.mk.on{background:var(--wash)}
.mk.cut{text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:2px;color:var(--soft)}
.mk.noted{box-shadow:inset 3px 0 0 var(--ink);padding-left:12px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font:italic 16px/1.4 var(--serif);margin:0 0 10px}
.note .ic{width:18px;height:18px;margin-top:2px}
.note .side{margin:-11px 0 -11px auto;font-style:normal;padding:0 0 0 10px}
.note b{font:600 12px/20px var(--sans);font-style:normal;min-width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--onink);text-align:center}
.note.theirs{color:var(--text);font:15px/1.45 var(--sans)}
.note.theirs b{background:var(--text);color:var(--paper)}
.panel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px solid var(--ink);border-radius:18px;padding:10px;margin:4px 0 12px;background:var(--paper)}
.gen{margin:10px 0 0}

/* ---------- the thing itself, in its own colours ---------- */
.peek{display:flex;width:100%;align-items:center;gap:12px;margin:4px 0 12px;padding:12px 14px;border-radius:10px;background:var(--thing);color:#1b1b1b;box-shadow:var(--shadow);font:14px/1.4 var(--sans)}
.peek b{display:block;font-size:15px}
.peek span{color:#57534b}
.peek .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:15px;color:#2340b8}
.thing{position:absolute;inset:0;overflow:auto;background:var(--desk);padding:0 12px}
.tbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin:0 -4px}
.thing h3{font:600 22px/1.2 var(--serif);margin:0 4px 2px}
.what{font:13.5px/1.4 var(--sans);color:var(--soft);margin:0 4px 10px}
.thing .judge{margin:0 4px 10px}
.obj{--ink:#2340b8;--wash:#e7ebf9;--onink:#fff;--soft:#57534b;--faint:#8b867b;--pencil:#66625a;--rule:#dedad0;--paper:#fff;--paper2:#f4f2ec;--text:#1b1b1b;
  background:var(--thing);color:#1b1b1b;border-radius:10px;padding:14px 11px;box-shadow:var(--shadow);font:15px/1.5 var(--sans)}
html[data-theme=dark] .obj{--rule:#cbc5b6;--paper2:#d9d3c5;--faint:#6f6a60}
.obj.inline{margin:6px 0 12px;padding:14px}
.obj p{margin:0 0 8px}
.tfoot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 4px 14px;margin-top:12px;background:var(--desk);border-top:1px solid var(--rule)}
.seg{display:inline-flex;border:1.5px solid var(--faint);border-radius:999px;padding:2px;margin:0 0 10px;font:600 14px var(--sans)}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--paper)}
.file{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--soft)}
.file b{font:600 13.5px var(--mono);color:#1b1b1b}
.csv{width:100%;border-collapse:collapse;table-layout:fixed;font:12.5px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.csv th:nth-child(1){width:13%}.csv th:nth-child(2){width:26%}.csv th:nth-child(3){width:21%}.csv th:nth-child(4){width:19%}.csv th:nth-child(5){width:21%}
.csv th{font-weight:600;text-align:left;color:var(--soft);font-size:12px;padding:10px 3px 6px}
.csv td{padding:0 3px;height:44px;border-top:1px solid var(--rule);vertical-align:middle}
.csv td:first-child{white-space:nowrap;color:var(--soft)}
.csv .r{text-align:right;white-space:nowrap}
.csv tr.mk{display:table-row}
.csv tr.sum td{font-weight:650;font-size:12px;border-top:2px solid #1b1b1b;color:#1b1b1b}
.csv tr.more td{color:var(--soft);font-style:italic}
.csv tr.new td{background:var(--wash)}
.csv tr.aux td{height:auto;border-top:0;padding:0 4px}
.csv tr.cut td{text-decoration:line-through;text-decoration-color:var(--ink);color:var(--soft)}
.mail-h{font-size:13px;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.mail-h b{color:#1b1b1b;font-weight:600}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:start;padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.pair:first-child{border-top:0}
.pair b{font-weight:600}
.figs{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.fig b{display:block;font:600 30px/1.1 var(--serif)}
.fig span{font-size:13px;color:var(--soft)}
.fig.was b{color:var(--soft);font-weight:400;text-decoration:line-through;text-decoration-thickness:1.5px}
.pins{position:relative;cursor:crosshair}
.pindot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;z-index:2}
.pindot span{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--onink);font:700 13px/26px var(--sans);text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.sk{width:230px;max-width:100%;margin:4px auto 6px;padding:18px 16px 16px;border:1.5px dashed #8b867b;border-radius:26px;text-align:center;font:14px/1.4 var(--sans);color:#3d3a35}
.sk .t{font-size:12px;color:#66625a}
.sk .h{font:600 17px/1.3 var(--sans);margin:10px 0 12px}
.sk .stars{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.sk .stars svg{width:30px;height:30px;fill:none;stroke:#66625a;stroke-width:1.5;stroke-dasharray:3 2}
.sk .box{border:1.5px dashed #8b867b;border-radius:10px;padding:14px 8px;color:#66625a;font-size:13px;margin-bottom:12px}
.sk .go{border:1.5px dashed #3d3a35;border-radius:999px;padding:9px;font-weight:600;margin-bottom:8px}
/* a journey: the checker's recording, scrubbed by named step */
.jr{display:grid;gap:12px;margin:0 0 4px}
.chap{display:flex;flex-direction:column}
.chap .play{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;font:600 15px var(--sans);color:var(--text)}

.chap .ch{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:44px;padding:4px 8px;border-top:1px solid var(--rule);font:500 15px/1.25 var(--sans);text-align:left}
.chap .ch time{font:600 12.5px var(--sans);color:var(--soft);font-variant-numeric:tabular-nums}
.chap .ch em{font:italic 13.5px/1.2 var(--serif);color:var(--ink);text-align:right}
.chap .ch em.doubt{font:500 12.5px/1.2 var(--sans);color:var(--text);border:1.5px dashed var(--pencil);border-radius:999px;padding:2px 8px}
.chap .ch.cur{background:var(--paper2);font-weight:650}
.phn{width:236px;max-width:100%;margin:0 auto;border:2px solid #1b1b1b;border-radius:30px;padding:16px 14px 14px;min-height:330px;display:flex;flex-direction:column;gap:10px;font:14px/1.4 var(--sans);background:#fff;color:#1b1b1b}
.phn .t{font-size:12px;color:#66625a;text-align:center}
.phn .h{font:650 18px/1.25 var(--sans);text-align:center;margin:8px 0 6px}
.phn .fld{min-height:44px;border:1.5px solid #8b867b;border-radius:10px;padding:0 12px;display:flex;align-items:center;justify-content:center;font:600 16px var(--sans);width:100%;color:#1b1b1b}
.phn .fld.sel{border:2.5px solid #1b1b1b;background:#f4f2ec}
.phn .cta{margin-top:auto;min-height:44px;border-radius:999px;background:#1b1b1b;color:#fff;font:650 15px var(--sans);display:flex;align-items:center;justify-content:center;width:100%}
.phn .cta[disabled]{background:#dedad0;color:#57534b}
.phn .ok{text-align:center;font:650 17px/1.3 var(--sans);margin:auto 0}
/* a page at two widths: the same page, laid out by the room it is given */
.ppw{container-type:inline-size;background:#fff;color:#1b1b1b;border:1px solid var(--rule);border-radius:8px;overflow:hidden;font:15px/1.4 var(--sans)}
.wide1280{width:1280px}
.pp{padding:18px 16px 20px}
.pp .nav{display:none}
.pp h4{font:750 24px/1.15 var(--sans);margin:0 0 4px}
.pp .sub{color:#57534b;margin:0 0 4px}
.pp .tog{display:inline-flex;border:1.5px solid #8b867b;border-radius:999px;padding:2px;margin:10px 0 0;font:600 13px var(--sans)}
.pp .tog button,.pp .tog .tb{min-height:44px;padding:0 16px;border-radius:999px;color:#57534b;display:inline-flex;align-items:center}
.pp .tog [aria-pressed=true]{background:#1b1b1b;color:#fff}
.pp .cards{display:grid;gap:10px;margin-top:14px}
.pp .card{border:1.5px solid #cfcabd;border-radius:12px;padding:14px;display:block;width:100%}
.pp .card.first{border:2px solid #1b1b1b}
.pp .card small{display:block;color:#57534b;font-size:13px}
.pp .price{display:block;font:750 26px/1.15 var(--sans)}
.pp .start{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:999px;background:#1f5d4a;color:#fff;font:650 15px var(--sans);margin-top:10px;width:100%}
.pp ul{margin:14px 0 0;padding-left:1.2em;color:#57534b;font-size:14px}
@container (min-width:700px){
  .pp{padding:0 0 56px}
  .pp .nav{display:flex;justify-content:space-between;padding:22px 80px;border-bottom:1px solid #e4e0d6;font:600 18px var(--sans)}
  .pp .nav span{color:#57534b;font-weight:500}
  .pp .body{padding:56px 160px 0;text-align:center}
  .pp h4{font-size:52px}
  .pp .sub{font-size:22px}
  .pp .tog{font-size:18px;margin-top:22px}
  .pp .tog button,.pp .tog .tb{min-height:54px;padding:0 26px}
  .pp .cards{grid-template-columns:1fr 1fr;gap:32px;margin-top:40px;text-align:left}
  .pp .card{padding:32px;border-radius:18px}
  .pp .card small{font-size:18px}
  .pp .price{font-size:48px}
  .pp .start{min-height:60px;font-size:20px;margin-top:22px}
  .pp ul{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px;margin-top:40px;font-size:18px;text-align:left}
}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 10px}
.alt{display:block;width:100%;border-radius:14px;border:1.5px solid var(--faint);padding:8px;text-align:center}
.alt.inked{border:2.5px solid var(--ink)}
.alt .ppw{display:block;pointer-events:none;text-align:left}
.alt.mini .ppw{font-size:12px}
.alt.mini .ppw .pp{padding:10px}
.alt.mini .ppw .pp h4{font-size:15px}
.alt.mini .ppw .pp .sub,.alt.mini .ppw .pp ul,.alt.mini .ppw .pp .tog{display:none}
.alt.mini .ppw .card{padding:8px}
.alt.mini .ppw .price{font-size:17px}
.alt.mini .ppw .card small{font-size:11px}
.alt.mini .ppw .start{min-height:26px;font-size:12px;margin-top:6px}
.alts.big{gap:16px;margin:0}
.alts.big .alt{padding:10px}
.alt .lbl{display:block;font:600 16px var(--sans);margin-top:8px}
.alt .lbl small{display:block;font:italic 400 13px var(--serif);color:var(--soft)}
.alt.inked .lbl{color:var(--ink)}
/* a job nobody can look at: what actually ran, in order */
.tr{list-style:none;margin:0;padding:0}
.tr li{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.tr li:first-child{border-top:0}
.tr time{font:600 12.5px var(--sans);color:var(--soft);padding-top:5px}
.tr .mk{display:block;margin:0}
.tr li.later{color:var(--soft)}
.mf{margin:0}
.mf dt{font:600 11.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft);margin-top:12px}
.mf dd{margin:2px 0 0;font-size:17px}
.mf dd.no{border:1.5px dashed var(--pencil);border-radius:10px;padding:8px 12px;margin-top:4px;font:15px/1.45 var(--sans)}
.sayback{font-size:19px;line-height:1.4;border-left:2.5px solid var(--alarm);padding-left:14px;margin:16px 0 4px}

/* ---------- everything, in its place ---------- */
.big{font:600 28px/1.2 var(--serif);margin:8px 0 4px;text-wrap:balance}
.proj{border-top:1px solid var(--rule);padding:4px 0 2px}
.proj h3{font:600 18px/1.3 var(--serif);margin:8px 0 4px}
.proj h3 small{display:block;font:400 14px/1.35 var(--sans);color:var(--soft)}
.moreg{display:flex;align-items:center;width:100%;min-height:44px;padding:0 6px;font:500 14.5px var(--sans);color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.gl{list-style:none;margin:0 0 8px;padding:0}
.gl li{border-top:1px solid var(--rule)}
.gl button{display:flex;width:100%;align-items:baseline;gap:8px;min-height:48px;padding:10px 6px;font-size:17px;text-align:left}
.gl .nm{flex:0 1 auto}
.gl .dotl{flex:1;border-bottom:1.5px dotted var(--faint);min-width:12px;transform:translateY(-4px)}
.gl .nx{flex:0 0 auto;font:500 14.5px var(--sans);color:var(--soft);text-align:right;max-width:52%}
.gl .with .nx{color:var(--ink);font-weight:600}
.gl .park .nm,.gl .held .nm{font-style:italic;color:var(--soft)}
.gl .unseen button{background:repeating-linear-gradient(135deg,var(--hatch) 0 8px,transparent 8px 16px)}
.gl .unseen .nx{font-style:italic;color:var(--text)}
.kept{font:15px/1.45 var(--sans);color:var(--soft);margin:10px 0 0}
.rows{margin:0;padding:0;list-style:none}
.rows li{border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.rows .gn{display:flex;flex-direction:column;min-width:0}
.rows .gn b{font:400 17px/1.4 var(--serif)}
.rows .gn b.off{text-decoration:line-through;text-decoration-color:var(--ink);color:var(--soft)}
.rows .gn span{font:14.5px/1.4 var(--sans);color:var(--soft)}
.story{list-style:none;margin:0 0 12px;padding:0;border-left:2px solid var(--rule)}
.story li{padding:3px 0 5px 14px;font-size:16px}
.story time{font:600 12.5px var(--sans);color:var(--soft);margin-right:8px}
.led{font-size:19px;line-height:1.45;margin:0 0 6px}
.led b{font-weight:600}
.ledger details{border-top:1px solid var(--rule);margin:0}
.ledger summary{font:400 18px/1.4 var(--serif);color:var(--text);padding:9px 0;min-height:48px}
.ledger details>:not(summary){font-size:16px;color:var(--soft);padding-left:21px}
.ledger details>ol{padding-left:42px}
.ledger details>p:last-child,.ledger details>ol:last-child{padding-bottom:10px}

/* ---------- the desk: an open book. Left page, the words. Right page, the thing at its own size. ---------- */
.spread{display:none}
@media (min-width:1040px){
  body{font-size:17.5px}
  #stage{background:var(--desk)}
  .spread{position:absolute;inset:0;display:grid;grid-template-columns:minmax(430px,520px) minmax(0,1fr);padding:16px 20px 18px;max-width:1400px;margin:0 auto}
  .spread.wide{grid-template-columns:minmax(0,1fr)}
  .spread.wide .page.left{display:none}
  .page{overflow:auto;min-height:0;position:relative}
  .page.left{background:var(--paper);border-radius:6px 0 0 6px;box-shadow:var(--shadow);padding:16px 36px 40px 40px}
  .page.right{background:var(--paper2);border-radius:0 6px 6px 0;box-shadow:inset 14px 0 16px -14px rgba(0,0,0,.22),var(--shadow);padding:16px 34px 40px 38px}
  .spread.wide .page.right{border-radius:6px;box-shadow:var(--shadow)}
  .sheet{max-width:none;margin:0;padding:0}
  .wrap,.thing{position:static;overflow:visible;background:transparent;padding:0}
  .thing{max-width:720px;margin:0 auto}
  .spread.wide .thing{max-width:1300px}
  .tbar .back{display:none}
  .tbar .back.keep{display:inline-flex}
  .tbar{justify-content:flex-end;min-height:36px}
  .tbar:has(.keep){justify-content:space-between}
  .tfoot{position:static;background:transparent;border-top:0;padding:10px 0 0}
  .lead{font-size:24px}
  .keys{display:block;font:13px var(--sans);color:var(--soft);margin-top:16px}
  .keys kbd{font:600 12px var(--mono);border:1px solid var(--rule);border-radius:5px;padding:1px 6px}
  .deskline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft);min-height:40px}
  .slip{margin:6px 0 14px;border-radius:14px;box-shadow:0 0 0 1px var(--rule)}
  .slip.alarm{box-shadow:0 0 0 2px var(--alarm)}
}
@media (min-width:1040px){.jr{grid-template-columns:auto minmax(0,1fr);align-items:start;gap:18px}}
@media (max-width:1039.9px){.deskonly{display:none!important}}
@media (min-width:1040px){.phoneonly{display:none!important}}

/* ---------- prototype control: not part of the design ---------- */
#proto{position:fixed;left:0;right:0;bottom:0;height:var(--ph);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9;
  font:12px var(--mono);color:#e9e9e9;background:repeating-linear-gradient(135deg,#26262a 0 10px,#2e2e33 10px 20px);border-top:2px dashed #8d8d96}
#proto .tag{display:none;white-space:nowrap;color:#c9c9d2}
#proto button,#proto select{min-height:36px;min-width:40px;padding:0 8px;border:1px solid #6d6d76;border-radius:4px;background:#17171a;color:#f0f0f0;font:12px var(--mono);text-align:center}
#proto select{flex:1;min-width:0;text-overflow:ellipsis}
#proto :focus-visible{outline:2px solid #fff;outline-offset:1px}
#pnote{position:fixed;left:8px;right:8px;bottom:calc(var(--ph) + 8px);z-index:9;padding:12px 14px;border:2px dashed #8d8d96;border-radius:6px;background:#1c1c20;color:#eee;font:12.5px/1.5 var(--mono);max-width:760px;max-height:60vh;overflow:auto}
#pnote b{color:#fff}
@media (min-width:1040px){#proto .tag{display:inline}#proto select{flex:0 1 460px}#pnote{left:auto;right:12px}}

.new.wrap,.new.slip,.new.thing{animation:rise .26s ease-out}
.inkline.new,.note.new,.ask.new,.ps.new,.panel.new{animation:ink .35s ease-out}
.inkline.new .ic path{stroke-dasharray:34;animation:draw .45s ease-out}
@keyframes draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(120,140,220,.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.still *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="pnote" hidden></div>
<nav id="proto" aria-label="Prototype control, not part of the design">
  <span class="tag">PROTOTYPE CONTROL · not the design</span>
  <button id="pv" aria-label="Previous moment">◀</button>
  <select id="pm" aria-label="Moment in the stress week"></select>
  <button id="nx" aria-label="Next moment">next ▶</button>
  <button id="pn" aria-expanded="false" aria-controls="pnote">notes</button>
  <button id="pt" aria-label="Theme">auto</button>
</nav>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isDesk=()=>matchMedia('(min-width:1040px)').matches;
const svg=d=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I={
  tick:svg('<path d="M4 13.5c2.2 1.6 3.6 3.3 5 5.6C11.6 13 15 8.6 20 4.6"/>'),
  play:svg('<path d="M8 5.5v13l10-6.5z"/>'),pause:svg('<path d="M8.5 5.5v13M15.5 5.5v13"/>'),
  mic:svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>'),
  x:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back:svg('<path d="M14.5 5.5L8 12l6.5 6.5"/>'),
  fwd:svg('<path d="M9.5 5.5L16 12l-6.5 6.5"/>'),
  sheet:svg('<path d="M6 3.5h8.5L18 7v13.5H6zM14.5 3.5V7H18M9 11.5h6M9 15h6"/>'),
  pen:svg('<path d="M4 20l1-4L16.5 4.5l3 3L8 19l-4 1zM14.5 6.5l3 3"/>'),
};
const star='<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></svg>';

/* ---------- state ---------- */
const S={playing:false,other:null,sent:{},glanceOff:false,m:0,view:'lock',stack:[],sheet:null,cur:null,thing:null,ans:{},marks:{},panel:null,park:null,open:{},theme:'auto',heard:null,listening:false,typing:false,buzz:null,
  revoked:{},goal:{},goalOpen:null,allNow:{},mode:{},step:{},seen:{},width:{},bill:{},wide:false,stopped:false,stopAsk:false,undone:{},said:[],fx:null,top:null,tried:false};

/* ---------- what he has allowed. A default may act only inside one of these, and only on the side that can be undone. ---------- */
const AUTH={
 layout:{t:'On the Billing tool’s pages I choose order, layout and wording, and tell you.',short:'You left this page’s layout to me on 3 November',since:'3 November',till:'in February',goal:'Price page'},
 reports:{t:'Wrong numbers on reports are fixed, and I tell you in the week.',since:'12 October',till:'in January',goal:'Fix wrong totals on the weekly report'},
 wording:{t:'Small wording changes are made, and I tell you in the week. One in five still comes to you.',since:'18 November',when:()=>S.ans.trust&&S.ans.trust.v===0&&M[S.m].k!=='day30'&&M[S.m].k!=='all'},
 tests:{t:'Test repairs are made, and I tell you in the week. One in five still comes to you.',since:'2 December',when:()=>at('day30')<=S.m},
};
const authOK=it=>!!(it.auth&&!S.revoked[it.auth]);

/* ---------- the stress week, moment by moment. He sits at 8:30 and 5:00; the sheet opens at any time. ---------- */
const M=[
 {k:'tue',day:'Tuesday',date:'17 November',time:'8:30',sit:'8:30',seen:'8:28',title:'The morning',ev:'1',sheet:'tue',then:'5:00',
  note:'<b>8:30, a time he set.</b> Nothing arrives: the glance is his own widget, and it only says what has gathered, for when, and how fresh that is. One thing needs him. Two more are told, not asked: work that has started (what I heard is one touch away, and he can fix a line whenever he likes), and a choice inside what he allowed (yearly first, from 5:00, with “See both”).'},
 {k:'say',day:'Tuesday',date:'17 November',time:'12:40',title:'Saying it on the move',ev:'2',script:'The reminder texts go out too late, people miss their lesson.',then:'5:00',
  note:'<b>He is walking.</b> He holds the button and speaks. No project, no form. The work starts at once; what was heard is there to correct and waits for nothing. Voice is simulated here: press the microphone and it “hears” the scenario’s words.'},
 {k:'early',day:'Tuesday',date:'17 November',time:'2:30',seen:'2:28',title:'Opening it early; a send-back',ev:'4',sheet:'early',then:'5:00',
  note:'<b>Not a sitting time. He opens it anyway.</b> One thing is ready early, so he may take it now instead of at 5:00: a taste loop is not held a day. Open the email, touch a paragraph, pick a margin note or say it. The marks stay with this exact sketch, and come back beside the next one.'},
 {k:'tue5',day:'Tuesday',date:'17 November',time:'5:00',sit:'5:00',seen:'4:58',title:'The afternoon',ev:'9',sheet:'tue5',then:'tomorrow 8:30',
  note:'<b>What “from 5:00” meant:</b> at his next set time, whether or not he looked in. It is told once, on the goal’s own line, with Undo. The second sketch carries his three marks where he made them.'},
 {k:'wed',day:'Wednesday',date:'18 November',time:'8:30',sit:'8:30',seen:'8:28',title:'A job nobody can look at; trust offered',ev:'10',sheet:'wed',then:'5:00',
  note:'<b>A background job has nothing to judge,</b> so it is told, not asked: what ran is one touch away, and so is Undo, until the day the old storage is deleted. That day cannot be undone and will come to him first. After the third wording change, a P.S.: trust is offered on results that stayed right, keeps one in five, and is never offered for what cannot be undone.'},
 {k:'bad',day:'Thursday',date:'19 November',time:'8:30',sit:'8:30',seen:'8:28',title:'A bad day',ev:'3, 6, 7, 11',sheet:'bad',then:'5:00',
  note:'<b>Three helpers stalled overnight</b> (two recovered unseen, one moved a promise), 17 questions arrived, an accepted result is wrong and another goal was built on it, and today’s release cannot be undone. Only the release needs him. The miss is told first and plainly, with the corrected file and “Hold it”. The three questions that are his wait for the sign-up itself, where he can see what they are about.'},
 {k:'unseen',day:'Thursday',date:'19 November',time:'9:55',title:'Two goals it cannot see',ev:'–',part:true,then:'5:00',
  note:'<b>Not one of the 14 events.</b> A helper that watches two goals has stopped answering. Silence says exactly that: which two, since when, and what happens next. The other 38 are still vouched for. The phone itself counts the age of what it was told; with nothing fresh for 15 minutes it stops saying “Nothing needs you”.'},
 {k:'buzz',day:'Thursday',date:'19 November',time:'1:10',title:'The one thing that cannot wait',ev:'8',buzz:true,then:'5:00',
  note:'<b>The only sound in the design.</b> All three must hold: only he can do it, it cannot wait for his next set time, and a named loss follows. Signing in is only signing in: the release he confirmed this morning is pinned, and is not approved again. It is counted against the one who prepares his work, with its cause.'},
 {k:'thu5',day:'Thursday',date:'19 November',time:'5:00',sit:'5:00',seen:'4:58',title:'A first sketch, and not now',ev:'5',sheet:'thu5',then:'tomorrow 8:30',
  note:'<b>The first sketch of Driver ratings,</b> with the one choice that is his drawn on it both ways. He parks it until the sign-up work is done, with a latest date.'},
 {k:'week',day:'Friday',date:'20 November',time:'8:30',sit:'8:30',seen:'8:28',title:'The week',ev:'13',sheet:'fri',open:'week',then:'5:00',
  note:'<b>Once a week, on the back of Friday’s sheet.</b> Every line opens in place. Extra times something came back are split into discoveries and misses. The one buzz is counted as a miss.'},
 {k:'away',day:'Tuesday',date:'24 November',time:'11:20',seen:'11:18',title:'Five days away',ev:'12',sheet:'back',

/* ---------- small helpers ---------- */
const sheetKey=()=>M[S.m].sheet||null;
const sheetOf=()=>{ const k=sheetKey(); return k?SH[k]:null; };
function itemsOf(sh){ return sh?sh.items.map(id=>IT[id]):[]; }
function findItem(id){ if(IT[id]) return IT[id]; for(const k in IT){ const it=IT[k]; if(it.ps&&it.ps.id===id) return it.ps; if(it.choices){ const c=it.choices.find(c=>c.id===id); if(c) return c; } } return null; }
function isDone(it){ const a=S.ans[it.id]; return !!a&&!(a.a==='back'&&!a.scope); }
// a choice inside what he allowed, on the side that can be undone, goes ahead at his next sitting time. It is told, not asked.
function goesAhead(it){ return !S.ans[it.id]&&it.kind==='decide'&&authOK(it); }
function sheetDone(sh){ return itemsOf(sh).every(isDone); }
// what must happen before a thing can be accepted: it was really looked at, and the choices that are his are settled
function gateOf(it){ const T=it.thing&&TH[it.thing], g=T&&T.gate?T.gate('t:'+it.thing):''; if(g) return g; const open=(it.choices||[]).filter(c=>!S.ans[c.id]).length; return open?`To accept it, first settle the ${NUM[open]} that ${open===1?'is':'are'} yours.`:''; }
// a thing that is not ready for his yes says what is missing, in words; it is never a greyed-out button
function acceptHTML(it){ const g=gateOf(it); return g?`<p class="gatehint">${g}</p>`:btn('accept:'+it.id,it.acceptLabel||'Accept','pri'); }
function assumedHTML(it){ return `<div class="lab" style="margin-top:10px">I assumed · touch one to change it</div>${it.assumed.map((t,i)=>mk(scopeOf(it),'a'+i,t,{chips:'line'})).join('')}`; }
const scopeOf=it=>it.thing?'t:'+it.thing:'i:'+it.id;
const marksOf=sc=>S.marks[sc]||(S.marks[sc]=[]);
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const NUM=['no','one','two','three','four','five','six','seven','eight','nine'];
const btn=(a,label,cls='',extra='')=>`<button class="btn ${cls}" data-act="${a}" data-fid="${a}" ${extra}>${label}</button>`;
function det(id,sum,body,cls=''){return `<details data-d="${id}"${cls?` class="${cls}"`:''}${S.open[id]?' open':''}><summary>${sum}</summary>${body}</details>`;}

/* ---------- marking: touch the thing where it is wrong; a margin note is one touch ---------- */
const CHIPS={para:['Cut this','Too long','Wrong tone'],row:['This is wrong'],line:['Not what I meant'],pin:['Too small','Hard to find'],gap:['Too slow']};
function panelHTML(o,m){
  const chips=(o.chips?CHIPS[o.chips]:[]).map((c,i)=>`<button class="btn sm" data-act="chip:${i}" data-chips="${o.chips}" data-fid="chip${i}">${c}</button>`).join('');
  return `<span class="panel" data-new="panel-${S.panel.sc}-${S.panel.k}" role="group" aria-label="Your mark">
   ${m&&m.kind!=='pin'?`<button class="btn sm" data-act="unmark" data-fid="p-un">Rub out this mark</button>`:chips}
   <button class="btn sm" data-act="speak" data-fid="p-say">${I.mic} Say it</button>
   <form class="type" data-form="note"><input name="t" aria-label="Or type what is wrong" placeholder="${S.tried?'voice is simulated here: type it':'or type it'}" autocomplete="off"><button class="btn sm">Mark</button></form>
   ${m&&m.kind==='pin'?`<button class="btn sm plain" data-act="pin-keep">Just here</button><button class="btn sm plain" data-act="unmark">Rub out</button>`:`<button class="btn sm plain" data-act="panel-x">Close</button>`}</span>`;
}
function mk(sc,k,inner,o={}){
  const m=marksOf(sc).find(x=>x.k===k), on=S.panel&&S.panel.sc===sc&&S.panel.k===k, tag=o.tag||'p';
  const at=`class="mk${m?(m.kind==='cut'?' cut':' noted'):''}${on?' on':''}${o.cls?' '+o.cls:''}" tabindex="0" role="button" data-act="mark" data-sc="${sc}" data-k="${k}" data-fid="mk-${sc}-${k}"${o.say?` data-say="${esc(o.say)}"`:''}`;
  const extra=(m&&m.kind==='note'?`<span class="note" data-new="n-${sc}-${k}">${I.pen}<span>${esc(m.text)}</span></span>`:'')+(on?panelHTML(o,m):'');
  if(tag==='tr') return `<tr ${at}>${inner}</tr>`+(extra?`<tr class="aux"><td colspan="5">${extra}</td></tr>`:'');
  if(tag==='li') return `<li><span ${at}>${inner}</span>${extra}</li>`;
  return `<${tag} ${at}>${inner}</${tag}>${extra}`;
}
// a picture is marked at the spot touched; `where` says which screen or width the spot belongs to, so the mark stays tied to what was shown
function pinsHTML(sc,inner,say,where,label,chips){
  const all=marksOf(sc).filter(m=>m.kind==='pin'), here=all.filter(m=>(m.where||'')===(where||'')), on=S.panel&&S.panel.sc===sc&&S.panel.pin;
  return `<div class="pins" data-act="pin" data-sc="${sc}" data-where="${where||''}"${say?` data-say="${esc(say)}"`:''}>${inner}${here.map(m=>`<button class="pindot" style="left:${m.x}%;top:${m.y}%" data-act="pin-open" data-k="${m.k}" aria-label="Your mark ${all.indexOf(m)+1}"><span>${all.indexOf(m)+1}</span></button>`).join('')}</div>
  ${all.map((m,i)=>`<p class="note" data-new="n-${sc}-${m.k}"><b>${i+1}</b><span>${m.where&&label?label(m.where)+': ':''}${esc(m.text||'Here.')}</span></p>`).join('')}${on?panelHTML({chips:chips||'pin'},all.find(m=>m.k===S.panel.k)):''}`;
}
function wholeHTML(sc,say,label){
  const ms=marksOf(sc).filter(m=>m.k.startsWith('gen')), on=S.panel&&S.panel.sc===sc&&S.panel.gen;
  return `<div class="gen" data-sc="${sc}"${say?` data-say="${esc(say)}"`:''}>${ms.map(m=>`<p class="note" data-new="n-${sc}-${m.k}">${I.pen}<span>${esc(m.text)}</span><button class="side" data-act="gen-x" data-k="${m.k}">Rub out</button></p>`).join('')}
   ${on?panelHTML({}):`<button class="btn sm plain" data-act="gen-add" data-sc="${sc}" data-fid="gen-add">${I.mic} ${label||'Say what is wrong with the whole thing'}</button>`}</div>`;
}
function setNote(p,text){ const ms=marksOf(p.sc); let m=ms.find(x=>x.k===p.k); if(!m){m={k:p.k,kind:'note'};ms.push(m);} if(m.kind==='cut') m.kind='note'; m.text=text; S.panel=null; S.fx=p.pin||p.gen?'.tfoot .btn':`[data-fid="mk-${p.sc}-${p.k}"]`; }

/* ---------- proof, kept apart from judgement. One line when all is well; more only when there is more to say. ---------- */
function proofHTML(id,key){
  const p=PROOF[key]; if(!p) return '';
  return (p.open?`<p class="notchk"><b>Not tried:</b> ${p.open}</p>`:'')+
   det(id,`Checked by someone who did not make it: ${p.n} “done” lines pass`,'<ol>'+p.lines.map(l=>`<li><b>${l[0]}</b> ${l[1]}${l[2]?`<button class="side show" data-act="${l[2]}">Show me</button>`:''}</li>`).join('')+'</ol>'+det(id+'-n','The checker’s own notes, unedited',`<p class="raw">${p.note}</p>`),'proof');
}
// what I heard, line by line; every line can be touched and changed
function linesHTML(o,sc){
  let h=`<p class="said"><span class="runin">You said</span><q class="his">${o.said[1]}</q> <span class="when">${o.said[0]}</span></p>`;
  for(const [k,lab,val] of o.lines){
    if(Array.isArray(val)) h+=`<div class="ln"><span class="runin">${lab}</span><ol>${val.map((v,j)=>mk(sc,k+j,v,{tag:'li',chips:'line'})).join('')}</ol></div>`;
    else h+=mk(sc,k,`<span class="runin">${lab}</span>${val}`,{chips:'line'});
  }
  return h;
}
// the choices that are his, gathered on the thing they are about, each built the way I would pick so he can see it
function choicesHTML(it,at){
  if(!it||!it.choices) return '';
  const cs=it.choices.filter(c=>at==null?c.at==null:c.at===at);
  return cs.length?`<div class="yours"><div class="lab">Yours to settle, here where you can see it</div>${cs.map(c=>`<div class="fork"><p class="q">${c.q}</p>${c.note?`<p class="quiet small" style="margin:0">${c.note}</p>`:''}${optsHTML(c)}</div>`).join('')}</div>`:'';
}

  const cells=r=>r.map((c,j)=>`<td class="${j>1?'r':''}">${c}</td>`).join(''), o={tag:'tr',chips:'row'};
  let h=`<div class="file"><b>invoices-2026-10.csv</b> <span>${fixed?'44 rows':'43 invoices'} · October 2026</span></div>
  <table class="csv"><thead><tr><th>Date</th><th>Customer</th><th class="r">Net</th><th class="r">Tax</th><th class="r">Total</th></tr></thead><tbody>`;

// a journey comes as the checker's recording on a real phone. He plays it, or scrubs it by named step, and touches a frame to mark it.
// The wait is a step of its own, so it can be pointed at. "Try it yourself" runs the same build here.
const JF=[['0:00','Your number'],['0:08','The wait for the code'],['0:11','The code'],['0:16','Pick a lesson'],['0:34','Booked']];
function frameHTML(f,use){
  const J=S.jr||(S.jr={}), ch=id=>S.ans[id]&&S.ans[id].a==='opt'?S.ans[id].v:0, typed=!use||J.phone, slot=use?J.slot:1;
  const a=(act,cls,label,dis)=>use?`<button class="${cls}" data-act="${act}" data-fid="${act}"${dis?' disabled':''}>${label}</button>`:`<div class="${cls}">${label}</div>`;
  return [
   `<div class="t">1 of 3</div><div class="h">Your phone number</div>${a('juse:phone','fld'+(typed?' sel':''),typed?'07700 900 123':'Tap to type')}${ch('c1')===1?`<div class="t">And your email</div><div class="fld${typed?' sel':''}">${typed?'sam@example.com':'Tap to type'}</div>`:''}${a('juse:next','cta','Next',!typed)}`,
   `<div class="t">1 of 3</div><div class="h">Texting you a code…</div><div class="ok" style="font-weight:500">3 seconds here.</div>`,
   `<div class="t">2 of 3</div><div class="h">The code we texted you</div><div class="fld sel">4 4 7 1</div><div class="t">It filled itself in.</div>${a('juse:next','cta','Next')}`,
   `<div class="t">3 of 3</div><div class="h">Pick your first lesson</div>${['Thu 4 pm','Fri 10 am','Sat 9 am'].map((x,i)=>a('juse:slot:'+i,'fld'+(slot===i?' sel':''),x+(ch('c2')===0?' · $45':''))).join('')}${a('juse:book','cta','Book',slot==null)}${ch('c3')===1?'<div class="t" style="text-decoration:underline">Skip for now</div>':''}`,
   `<div class="ok">Booked.<br>${['Thu 4 pm','Fri 10 am','Sat 9 am'][slot==null?1:slot]} with Dana.${ch('c2')===1?'<br>$45, paid at the lesson.':''}</div><div class="t">Three screens. No more to fill in.</div>`][f];
}
function journeyHTML(sc){
  const use=(S.mode[sc]||'rec')==='use', f=S.step[sc]||0, ms=marksOf(sc), phone=`<div class="phn">${frameHTML(f,use)}</div>`;
  const where=w=>{ const i=+w.slice(1); return `${JF[i][1]}, at ${JF[i][0]}`; };
  const drawn=IT.signup.choices.some(c=>c.at===f&&S.ans[c.id]&&S.ans[c.id].a==='opt'&&S.ans[c.id].v!==c.pick);
  const list=`<div class="chap" role="group" aria-label="The recording, step by step"><button class="play" data-act="jplay" data-fid="jplay">${S.playing?I.pause+'Pause':I.play+'Play it'} <span>34 seconds</span></button>
    ${JF.map((x,i)=>{ const n=IT.signup.choices.filter(c=>c.at===i&&!S.ans[c.id]).length, pins=ms.filter(m=>m.where==='f'+i).length;
      return `<button class="ch${i===f?' cur':''}" data-act="jstep:${i}" data-fid="jstep${i}"${i===f?' aria-current="step"':''}><time>${x[0]}</time><span>${x[1]}</span>${n?`<em>${n===1?'a choice of yours':n+' choices of yours'}</em>`:pins?`<em>${plural(pins,'mark')} of yours</em>`:i===1?'<em class="doubt">the checker’s doubt</em>':''}</button>`; }).join('')}</div>`;
  const pinNotes=ms.filter(m=>m.kind==='pin').map((m,i)=>`<p class="note"><b>${i+1}</b><span>${where(m.where)}: ${esc(m.text||'Here.')}</span></p>`).join('');
  return `<div class="seg" role="group" aria-label="The recording, or try it yourself"><button data-act="mode:${sc}:rec" data-fid="mode-rec" aria-pressed="${!use}">The recording</button><button data-act="mode:${sc}:use" data-fid="mode-use" aria-pressed="${use}">Try it yourself</button></div>
   <div class="jr"><div>${use?phone+pinNotes:pinsHTML(sc,phone,f===1?'Thirty seconds is too long to stand waiting.':'Say what the lesson costs before they book.','f'+f,where,f===1?'gap':'pin')}
    ${f===1?`<p class="note theirs"><b>!</b><span>The checker: in 2 of 20 tries this wait was over 30 seconds.</span></p>`:''}${drawn?`<p class="quiet small" style="margin:8px 0 0">Drawn for you, to show the other way. It is not built.</p>`:''}</div>
    ${use?'':list}</div>${choicesHTML(IT.signup,f)}
   <p class="quiet small" style="margin:10px 0 0">${use?'Tap through it as a new learner would. To mark something, go back to the recording and touch it there.':'Touch a frame where it is wrong. Your mark keeps its step and its time.'}</p>`;
}

function glance(){
  const mo=M[S.m], sh=sheetOf(), seen='Seen 2 min ago';
  if(S.stopped) return {kind:'quiet',act:'all',l1:'Everything is stopped.',l2:'By you. Nothing is lost',l3:`${seen} · open this to go on`};
  if(mo.buzz&&!S.buzz) return {kind:'alarm',act:'sheet',l1:'One thing cannot wait.',l2:'Before 3:00 · nothing else needs you',l3:'Seen 1 min ago'};
  if(mo.part) return {kind:'unknown',act:'all',l1:`I cannot see 2 of your ${NG()} goals.`,l2:`Not since 9:14. The other ${NG()-2}: seen 2 min ago`,l3:'Nothing else needs you before 5:00'};
  if(mo.k==='away') return {kind:'quiet',act:'sheet',l1:'Away, by the look of it.',l2:'9 things held for when you are back. Nothing new starts',l3:seen};
  if(sh){ const its=itemsOf(sh), left=its.filter(it=>!isDone(it)), min=left.reduce((a,it)=>a+it.min,0);
    if(left.length&&sh.early) return {kind:'quiet',act:'sheet',l1:'Nothing needs you before 5:00.',l2:`${seen} · all ${NG()} goals`,l3:'One thing is ready early, if you want it now'};
    if(left.length&&sh.ret&&left.length===its.length) return {kind:'sheet',act:'sheet',l1:'Welcome back · 3 things now',l2:'About 10 minutes; 6 more at 5:00 and tomorrow',l3:seen};
    if(left.length) return {kind:'sheet',act:'sheet',l1:`${plural(left.length,'thing')}${left.length<its.length?' left':''} · about ${plural(min,'minute')}`,l2:`Gathered for ${mo.sit||mo.time} · seen 2 min ago`,l3:''};
  }
  return {kind:'quiet',act:'sheet',l1:`Nothing needs you before ${mo.then||'5:00'}.`,l2:`${seen} · all ${NG()} goals`,l3:mo.k==='say'&&S.heard?'Then, at 5:00: 1 thing, about a minute':''};
}

const SOON=[/5:00|8:30|today|now/,/tomorrow/,/\b(Mon|Tue|Wed|Thu|Fri)\b/,/this week/,/next week/,/Nov\b/,/mid-December|Dec\b/,/January/], soon=t=>{ const i=SOON.findIndex(r=>r.test(t)); return i<0?99:i; };
function lineOf(g){ let v=null; for(let i=0;i<=S.m;i++){ const x=g[2][M[i].k]; if(x!==undefined) v=x; } return v; }
function goals(){
  const sh=sheetOf(), open={}; itemsOf(sh).forEach(it=>{ if(it.proj>=0) open[it.g||it.goal]=isDone(it)?'answered just now':'on your sheet now'; });
  const part=!!M[S.m].part;
  return G.map(g=>{ const v=lineOf(g); if(!v) return null; const a=S.goal[g[0]];
    let grp=v[0], txt=v.slice(2);
    if(open[g[0]]){ grp=open[g[0]]==='on your sheet now'?'W':'M'; txt=open[g[0]]; }
    if(part&&UNSEEN.includes(g[0])){ grp='U'; txt=txt.replace(/<s>.*?<\/s>\s*/g,'').split(' · ')[0]+' · not seen since 9:14'; }

  ok(!Object.values(IT).some(it=>it.kind==='agree'),'an agreement still waits for him as an item');
  // 2. what he must read to act, and what is merely available, counted from the same text the screen draws
  for(const k of Object.keys(PATH)){ reset(k); S.cur=null; S.view='sheet';
    const sh=sheetOf(), its=itemsOf(sh);
    const one=c=>words(sheetHTML(),c)+its.reduce((s,it)=>s+words(bodyHTML(it)+actsHTML(it)+leaveHTML(it)+choicesHTML(it),c)-words(it.judge,c)
        +(!isDesk()&&it.thing&&it.proof?words(proofHTML('x',it.proof),c):0)+(isDesk()&&it.thing&&it.assumed?words(assumedHTML(it),c):0)+(it.ps?words(`${it.ps.text} ${it.ps.ask} ${it.ps.terms} ${it.ps.leave}`,c)+8:0)
        +(it.thing?thingWords(it,c):0),0);
    const told=[...(sh.know||[]),...(sh.miss?[sh.miss]:[]),...((sh.ret&&sh.ret.lines)||[])].filter(n=>n.thing).map(n=>TH[n.thing]);
    out.must[k]=one(true);
    out.avail[k]=one(false)-out.must[k]+told.reduce((s,T)=>s+words(T.html('x:told'),false)+words(T.what,false)+(T.told?words(proofHTML('x',T.proof||T.told),false):0),0); }
  reset('buzz'); out.must.glances=M.reduce((s,m,i)=>{ S.m=i; const g=glance(); return s+words(`${g.l1} ${g.l2} ${g.l3||''}`); },0); S.m=at('buzz'); out.must.buzz=words(slipHTML(),true);
  S.m=at('say'); S.heard={text:M[S.m].script,m:S.m}; out.must.heard=words(slipHTML(),true); S.heard=null;
  S.m=at('week'); out.must.week=words(weekHTML(),true); out.avail.week=words(weekHTML(),false)-out.must.week;
  S.m=at('all'); out.avail.everything=words(allHTML(),false); out.avail.behind=words(behindHTML(),false);
  // 3. the walk, on the real buttons
  for(const k of Object.keys(PATH)){ reset(k); taps=0; if(!isDesk()) click('[data-fid="glance"]');
    for(const a of PATH[k]){
      if(a.startsWith('#chip')){ const p=a.split(':'); click(`.thing [data-k="${p[1]}"]`); click(`[data-act="chip:${p[2]}"]`); }
      else if(a.startsWith('#say')){ click(`.thing [data-k="${a.split(':')[1]}"]`); click('[data-act="speak"]'); }
      else if(a==='#journey'){ ok(!q('[data-act="accept:signup"]')&&q('.gatehint'),'the journey can be accepted before it was watched'); ['opt:c1:0','jstep:2','jstep:3','opt:c2:0','opt:c3:0','jstep:4'].forEach(x=>click(`[data-act="${x}"]`)); }
      else if(a==='#widths'){ ok(!q('[data-act="accept:pricepage"]')&&q('.gatehint'),'the page can be accepted before both widths were seen'); click('[data-fid="w-desk"]'); }
      else if(a.startsWith('hold:')){ const el=q(`[data-hold="${a.slice(5)}"]`); ok(el,'nothing to hold: '+a); if(el){ el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); taps++; await wait(1300); } }
      else if(a.startsWith('thing:')){ if(!S.thing) click(`[data-fid="peek-${a.slice(6)}"]`); }
      else click(`[data-act="${a}"]`);
    }
    out.taps[k]=taps; ok(sheetDone(sheetOf())&&q('#end'),'it does not end with “That is all”: '+k); }
  // 4. the paths the week does not take
  reset('tue'); if(!isDesk()) click('[data-fid="glance"]');
  ok(/I have started\. First look: a sketch on Thursday/.test(stage.textContent)&&!q('[data-act^="go:"]'),'what I heard still waits for a go');
  click('[data-act="kthing:sb-ratings"]'); ok(q('.sbk')&&/Point at any line that is wrong/.test(q('.sbk').textContent),'what I heard does not open'); click('.sbk [data-k="done1"]'); click('[data-act="chip:0"]'); click('[data-act="ksend:sb-ratings"]'); ok(S.sent['sb-ratings']===1&&/The done lines now read as you marked them/.test(stage.textContent),'a line of what I heard cannot be changed');
  if(!isDesk()) click('[data-act="thing-x"]');
  click('[data-act="kthing:alts"]'); ok(goesAhead(IT.price)&&/If you leave it, yearly comes first at 5:00/.test(stage.textContent),'the default is not written in words'); click('[data-act="revoke:layout"]'); ok(!goesAhead(IT.price)&&/This waits for you/.test(stage.textContent),'a permission taken back still acts'); click('[data-act="grant:layout"]'); ok(goesAhead(IT.price),'a permission given back does not act');
  click('.alt[data-act="opt:price:1"]'); ok(S.ans.price&&S.ans.price.v===1&&/Monthly first, as you said/.test(stage.textContent),'the told choice cannot be changed'); click('[data-act="take:price"]'); ok(!S.ans.price,'the changed choice cannot be taken back');
  if(!isDesk()) click('[data-act="thing-x"]');
  click('[data-act="park:invoice"]'); click('[data-act="until:invoice:1"]'); ok(S.ans.invoice.a==='park','not now does not park'); click('[data-act="take:invoice"]'); ok(!S.ans.invoice,'take back does not take back');
  reset('say'); if(!isDesk()){ click('[data-act="say"]'); await wait(1700); ok(S.heard&&/reminder/.test(S.heard.text)&&/I have started on it/.test(stage.textContent),'what he said is not heard back'); click('[data-act="saynow"]'); ok(q('.sbk')&&/No text goes to a learner until you say go/.test(q('.sbk').textContent),'what I heard cannot be seen at once'); }
  reset('tue5'); ok(/yearly came first at 5:00, as you allowed/.test(sheetHTML()),'the default that went ahead is not told'); if(!isDesk()) click('[data-fid="glance"]'); click('[data-act="kundo:yearly"]'); ok(S.undone.yearly&&/Undone/.test(stage.textContent),'what went ahead cannot be undone'); ok(stage.querySelectorAll('.backmark').length===2,'his marks do not come back on the second sketch');
  reset('wed'); if(!isDesk()) click('[data-fid="glance"]'); click('[data-act="kthing:photos"]'); ok(q('.tr')&&q('[data-act="kundo:photos"]'),'the job nobody can look at has no trace, or no undo'); click('.tr [data-k="t1"]'); click('[data-act="chip:0"]'); ok(marksOf('t:photos').length===1,'a line of the trace cannot be marked');
  reset('bad'); if(!isDesk()) click('[data-fid="glance"]'); ok(itemsOf(sheetOf()).length===1&&/My miss/.test(stage.textContent)&&/you will meet them on the sign-up itself/.test(stage.textContent),'the miss and the questions are not told'); click('[data-act="kundo:holdinv"]'); ok(S.undone.holdinv&&/Not sent\. It goes to nobody/.test(stage.textContent),'the corrected file cannot be kept from sending');
  { const el=q('[data-hold="release"]'); el.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); await wait(200); el.dispatchEvent(new PointerEvent('pointerup',{bubbles:true})); await wait(1200); ok(!S.ans.release&&/Keep holding/.test(stage.textContent),'a slip of the thumb releases it'); }
  reset('unseen'); ok(glance().kind==='unknown'&&!/^Nothing needs you/.test(glance().l1),'two unseen goals still read as all is well'); if(!isDesk()) click('[data-fid="glance"]'); ok(stage.querySelectorAll('.gl .unseen').length===2,'the two unseen goals are not marked where they live');
  reset('buzz'); click('[data-act="buzz:signed"]'); await wait(1100); ok(S.buzz==='signed'&&glance().kind==='quiet','the one thing that cannot wait is not answered in one press');
  reset('thu5'); if(!isDesk()) click('[data-fid="glance"]'); if(!S.thing) click('[data-fid="peek-sketch"]'); pin(); click('[data-act="speak"]'); ok(marksOf('t:ratings').some(m=>m.kind==='pin'&&m.text),'a picture cannot be marked at a spot');
  click('[data-act="opt:who:1"]'); ok(/Maya ·/.test(q('.sk2').textContent),'the choice that is his does not show on the sketch');
  reset('away'); ok(/^Away, by the look of it/.test(glance().l1)&&/Nothing new starts/.test(glance().l2),'the away card is missing');
  reset('back'); ok(/^Welcome back/.test(glance().l1),'the return card is missing'); if(!isDesk()) click('[data-fid="glance"]');
  { const r=SH.back.ret, gs=goals(); ok(r.need+r.done+r.held+(NG()-r.need-r.done-r.held)===40&&q('.retbar')&&stage.querySelectorAll('.since>p').length===5,'the return does not open on one bar and five lines');
    ok(gs.filter(g=>g.away&&g.grp==='D').length===r.done&&gs.filter(g=>g.grp==='H').length===r.held&&itemsOf(sheetOf()).length+SH.back.split.rest.length===r.need,'the bar’s numbers do not match the goals behind them'); }
  if(!S.thing) click('[data-fid="peek-signup"]');
  ok(q('.chap')&&stage.querySelectorAll('.chap .ch').length===5&&stage.querySelectorAll('.chap .ch em:not(.doubt)').length===2,'the recording has no named steps, or the steps with a choice of his are not marked');
  click('[data-act="opt:c1:1"]'); ok(/And your email/.test(q('.phn').textContent)&&/Drawn for you/.test(stage.textContent),'a choice that is his does not change the screen it is about');
  click('[data-act="jplay"]'); await wait(4200); ok(!S.playing&&S.step['t:signup']===4&&[0,1,2,3,4].every(f=>S.seen['t:signup'][f]),'the recording does not play through'); ok(!q('[data-act="accept:signup"]')&&/first settle the two/.test(stage.textContent),'the journey can be accepted before the choices that are his are settled');
  click('[data-fid="mode-use"]'); ['juse:phone','juse:next','juse:next','juse:slot:1','juse:book'].forEach(x=>click(`[data-act="${x}"]`)); ok(/Booked/.test(q('.phn').textContent),'he cannot try it himself'); click('[data-fid="mode-rec"]');
  click('[data-fid="jstep1"]'); pin(); click('[data-act="chip:0"]'); ok(marksOf('t:signup').some(m=>m.kind==='pin'&&m.where==='f1'&&/slow/i.test(m.text)),'the wait cannot be marked'); click('[data-fid="jstep0"]'); pin(); click('[data-act="chip:1"]'); ok(marksOf('t:signup').some(m=>m.kind==='pin'&&m.where==='f0'),'a mark on the recording does not keep its step');
  click('[data-act="back:signup"]'); click('[data-act="scope:signup:here"]'); ok(S.ans.signup.scope==='here','a send-back does not ask here or always');
  if(S.cur!=='pricepage') click('[data-act="cur:pricepage"]'); if(!S.thing) click('[data-fid="peek-pricepage"]'); click('[data-fid="bill-month"]'); ok(/\$19/.test(q('.ppw').textContent),'the page’s own buttons do not work in “Use it”'); click('[data-fid="w-desk"]'); click('[data-fid="mode-mark"]'); pin(); click('[data-act="pin-keep"]'); ok(marksOf('t:pricepage').some(m=>m.where==='desk'),'a mark on the page does not keep its width');
  reset('all'); ok(stage.querySelectorAll('.gl li').length<=10&&stage.querySelectorAll('.moreg').length===4,'the forty goals are all listed by default'); click('[data-act="expand:1"]'); click('[data-fid="g-Price page"]'); ok(q('#goal'),'a goal does not open'); click('[data-act="goal:undo"]'); ok(S.goal['Price page']==='undo','a done goal cannot be undone'); click('[data-act="goal-x"]'); click('[data-act="goal-close"]');
  ok(G.length===40&&goals().length===40,'not forty goals'); click('[data-act="stopall-ask"]'); click('[data-act="stopall"]'); ok(glance().l1==='Everything is stopped.','stop everything does not show on the glance'); click('[data-act="stopall-x"]');
  click('[data-fid="glance-toggle"]'); ok(S.glanceOff&&!/class="glance/.test(lockHTML()),'the glance cannot be taken off the lock screen'); click('[data-fid="glance-toggle"]'); ok(!S.glanceOff,'the glance cannot be put back');
  reset('tue'); if(!isDesk()) click('[data-fid="glance"]'); ['j','k','t','/','Escape','Escape','Escape'].forEach(key); key(']'); ok(M[S.m].k==='say','the keys do not step');
  // report, where a person or a screenshot can read it
  const sum=o=>Object.values(o).reduce((a,b)=>a+b,0), kv=o=>Object.keys(o).map(k=>k+' '+o[k]).join(', ');
  document.documentElement.classList.remove('still'); reset('tue');
  CHECKNOTE=`<b>Self-check at ${isDesk()?'desk':'phone'} width: ${errs.length?errs.length+' FAILED':'all pass'}.</b> ${errs.length?esc(errs.join(' · ')):'Every moment draws; all 14 scenario events are carried; nothing waits for him to agree; no word of the method is on any screen and no control is under 44 px (${audits} states looked at, every fold opened); every card says how fresh it is; each of the nine sheets ends with “That is all” when walked on the real buttons; and the side paths hold: what I heard opens and a line of it can be changed, the default in words, a permission taken back, the told choice changed and taken back, not now, take back, say it and see what was heard, undo of what went ahead, marks back on the second sketch, the trace, the miss told and held, a slipped hold, two unseen goals, the one interruption, the away card, the return’s bar that adds up and its five lines, the recording played and scrubbed by named step, trying it himself, a pin on a picture, a choice shown on the sketch and on the journey, a mark on the wait, a mark that keeps its step and its width, forty goals folded by project, a goal undone, stop everything, the glance taken off and put back, the keys.'}
   <br><b>Taps</b> (total ${sum(out.taps)+3}: ${kv(out.taps)}; plus 1 hold to speak, 1 sign-in, 1 to turn to the week).
   <br><b>Words he must read to act</b> (total ${sum(out.must)}): ${kv(out.must)}.
   <br><b>Words merely available</b> (total ${sum(out.avail)}): ${kv(out.avail)}.`;
  document.body.insertAdjacentHTML('beforeend',`<pre id="check" hidden>${esc(JSON.stringify({errs,...out,taps_total:sum(out.taps)+3,must_total:sum(out.must),avail_total:sum(out.avail)}))}</pre>`);
  $('#pnote').hidden=false; render();
}

/* ---------- start. The address can open one state: #k=back&v=sheet&t=dark&th=signup ---------- */
(function(){
  const q=new URLSearchParams(location.hash.slice(1));
  if(q.get('t')) S.theme=q.get('t'); applyTheme(); if(q.has('still')) document.documentElement.classList.add('still');
  if(q.has('check')){ selfCheck(); return; }
  S.jr={}; setMoment(q.get('k')?Math.max(0,at(q.get('k'))):+(q.get('m')||0));
  const mo=M[S.m], d=q.get('d'), v=q.get('v');
  if(d==='heard') S.heard={text:mo.script,m:S.m};
  if(d==='signed') S.buzz='signed';
  if(mo.sheet&&PATH[mo.sheet]&&d){ const n=d==='done'?null:+d; if(d==='done'||!isNaN(n)) walk(mo.sheet,n); }
  (q.get('a')||'').split(',').filter(Boolean).forEach(x=>{ const [id,val]=x.split(':'); S.ans[id]={a:'opt',v:+val}; });
  (q.get('o')||'').split(',').filter(Boolean).forEach(id=>S.open[id]=true);
  (q.get('un')||'').split(',').filter(Boolean).forEach(id=>S.undone[id]=true);
  if(q.has('noglance')) S.glanceOff=true;
  if(v&&v!=='lock'&&S.view==='lock'){ if(v==='sheet') act('sheet'); else { S.stack=['lock']; S.view=v; } }
  if(q.get('cur')){ S.cur=q.get('cur'); autoThing(); }
  if(q.get('th')){ const id=q.get('th'), it=itemsOf(sheetOf()).find(x=>x.thing===id); S.thing={id,item:it?it.id:null}; if(it) S.cur=it.id; if(!isDesk()) S.view='sheet'; touchThing(); }
  if(q.get('mode')&&S.thing) S.mode['t:'+S.thing.id]=q.get('mode');
  if(q.get('step')&&S.thing){ S.step['t:'+S.thing.id]=+q.get('step'); S.jr={phone:true,slot:1}; touchThing(); }
  if(q.get('w')&&S.thing){ S.width['t:'+S.thing.id]=q.get('w'); touchThing(); }
  if(q.has('wide')) S.wide=true;
  if(q.get('goal')){ S.goalOpen=q.get('goal'); if(!isDesk()) S.view='goal'; }
  if(q.get('park')) S.park=q.get('park');
  if(q.get('pan')){ const [sc,k]=q.get('pan').split('|'); S.panel={sc,k,gen:k==='gen',gap:k.startsWith('gap')}; }
  if(q.has('note')) $('#pnote').hidden=false; if(q.has('nonote')) $('#pnote').hidden=true;
  if(isDesk()&&S.view==='lock') S.view='sheet';
  render();
})();
