<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The sheet</title>
<style>
:root{
  --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ph:48px;
}
/* Three voices. Black serif: the one who prepares everything. Blue italic: him. Plain sans: anyone else, unedited (a checker, the record).
   Dashes always mean "not known": not checked, not seen. Red appears once: the thing that cannot wait. */
html[data-theme=light]{
  --desk:#d9d5ca; --wall:radial-gradient(120% 70% at 50% -10%,#fbf4e2 0%,rgba(251,244,226,0) 62%),linear-gradient(165deg,#e8e2d5,#cdd3d6);
  --paper:#faf7f0; --paper2:#f0ece2; --text:#1d1c1a; --soft:#57534b; --faint:#8b867b; --rule:#ddd7c9;
  --ink:#2340b8; --wash:#e7ebf9; --onink:#fff; --pencil:#66625a;
  --alarm:#a3271a; --onalarm:#fff;
  --glass:rgba(255,255,255,.5); --gedge:rgba(255,255,255,.8);
  --thing:#fff; --shadow:0 1px 2px rgba(40,30,10,.08),0 14px 40px rgba(40,30,10,.13); --hatch:rgba(60,50,30,.09);
}
html[data-theme=dark]{
  --desk:#0e0e0d; --wall:radial-gradient(120% 70% at 50% 112%,#2b2219 0%,rgba(43,34,25,0) 62%),linear-gradient(165deg,#1a1b1d,#0b0c0e);
  --paper:#1c1b19; --paper2:#151413; --text:#ebe5d9; --soft:#aea89c; --faint:#7f796e; --rule:#37342f;
  --ink:#b9c8ff; --wash:#232a45; --onink:#10121c; --pencil:#a39d91;
  --alarm:#ff9a82; --onalarm:#1c0d09;
  --glass:rgba(255,255,255,.06); --gedge:rgba(255,255,255,.11);
  --thing:#e6e1d5; --shadow:0 0 0 1px #34312c; --hatch:rgba(255,245,220,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.5 var(--serif);color:var(--text);background:var(--desk);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
p{margin:0 0 10px}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:3px;border-radius:8px}
[tabindex="-1"]:focus-visible{outline:none}
[inert]{pointer-events:none}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lab,.runin,.kick{font:600 11.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.his{color:var(--ink);font-style:italic}
html[data-theme=dark] .his,html[data-theme=dark] .inkline,html[data-theme=dark] .note{font-weight:500}
.quiet{color:var(--soft);font-size:15.5px;line-height:1.45}
.small{font-size:14px}
s{text-decoration-thickness:1.5px;color:var(--soft)}

/* ---------- the phone: lock screen and glance ---------- */
#stage{position:fixed;inset:0 0 var(--ph) 0;overflow:hidden;background:var(--wall)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:52px 16px 18px}
.clock{text-align:center;font-family:var(--sans)}
.date{font-size:17px;font-weight:500}
.time{font-size:88px;font-weight:300;line-height:1.02;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:22px}
.corner{flex:1;width:100%;max-width:372px;display:flex;flex-direction:column;gap:10px;min-height:0}
.glance{display:flex;align-items:stretch;border-radius:22px;background:var(--glass);border:1px solid var(--gedge);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.gmain{flex:1;display:flex;gap:12px;align-items:center;padding:14px 16px;min-height:76px;border-radius:22px}
.gt{display:flex;flex-direction:column;gap:1px}
.gt b{font:600 19px/1.25 var(--serif)}
.gt span{font:400 14.5px/1.35 var(--sans);color:var(--soft)}
.gi{width:26px;display:grid;place-items:center;flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:block}
.glance.sheet{background:var(--paper);border-color:transparent;box-shadow:var(--shadow)}
.glance.sheet .gi{color:var(--ink)}
.glance.alarm .dot{background:var(--alarm)}
.glance.unknown{border:1.5px dashed var(--pencil)}
.glance.unknown .dot{width:24px;height:24px;background:none;border:1.5px dashed var(--pencil);display:grid;place-items:center;font:600 14px/1 var(--sans);font-style:normal;color:var(--text)}
.slip{border-radius:22px;padding:16px 18px;background:var(--paper);box-shadow:var(--shadow)}
.slip.alarm{box-shadow:0 0 0 2px var(--alarm),var(--shadow)}
.slip.alarm .lab{color:var(--alarm)}
.slip .lab{margin-bottom:6px}
.say{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}
.say button{width:68px;height:68px;border-radius:50%;background:var(--glass);border:1px solid var(--gedge);display:grid;place-items:center;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.say button .ic{width:28px;height:28px}
.say span{font:13.5px var(--sans);color:var(--text)}
.say.on button{background:var(--ink);color:var(--onink);border-color:transparent;animation:pulse 1.1s ease-in-out infinite}

/* ---------- places to make a mark ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font:600 16px/1.2 var(--sans);border:1.5px solid var(--ink);color:var(--ink);background:transparent;text-align:center;position:relative;overflow:hidden}
.btn.pri{background:var(--ink);color:var(--onink)}
.btn.plain{border-color:transparent;color:var(--soft);font-weight:500;padding:0 12px}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.btn.alarm{background:var(--alarm);border-color:var(--alarm);color:var(--onalarm)}
.btn .ic{width:19px;height:19px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .fill{position:absolute;inset:0;background:var(--onink);opacity:.25;transform-origin:left;transform:scaleX(0)}
.btn.holding .fill{transform:scaleX(1);transition:transform 1.1s linear}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.type{display:flex;gap:8px;flex:1 1 220px;min-width:0}
.type input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1.5px solid var(--faint);background:transparent;padding:0 16px;font:16px var(--sans)}
.type input::placeholder{color:var(--soft);opacity:1}
.side{min-height:44px;padding:0 0 0 14px;font:500 14px var(--sans);color:var(--soft);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.link{min-height:44px;display:inline-flex;align-items:center;gap:6px;font:500 15px var(--sans);color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}

/* ---------- the sheet: one sitting, rewritten in place ---------- */
.wrap{position:absolute;inset:0;overflow:auto;background:var(--paper)}
.sheet{max-width:640px;margin:0 auto;padding:10px 20px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;font:600 12px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 10px;border-radius:999px;font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.lead{font-size:22px;line-height:1.36;margin:8px 0 2px;text-wrap:pretty}
.order{display:flex;flex-wrap:wrap;gap:2px 14px;font:14.5px/1.5 var(--sans);color:var(--soft);margin:4px 0 0}
.order b{font-weight:600;color:var(--text);margin-right:2px}
.know{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
.know .lab{margin-bottom:6px}
.know p{font-size:16.5px}
.klinks{display:flex;gap:18px;margin:-8px 0 2px}
.klinks .side{padding:0}
.know b{font-weight:600}
.back{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule)}
.back .lab{margin:12px 0 4px}
.back p{font-size:16.5px;margin-bottom:6px}
.item{position:relative;border-top:1px solid var(--rule);margin-top:20px;padding-top:4px;scroll-margin-top:8px}
.item.folded,.item.done{margin-top:10px}
.hd{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.kick .n{font-family:var(--serif);font-weight:400;font-size:15px;margin-right:.6em;color:var(--text);letter-spacing:0}
.kick .min{text-transform:none;letter-spacing:0;font-weight:500}
.item h2,.fold .h{font:600 25px/1.2 var(--serif);margin:0 0 10px;text-wrap:balance}
.item h2 small,.fold .h small{font:italic 400 17px var(--serif);color:var(--soft)}
.item.done h2{font-size:19px;font-weight:500;color:var(--soft);margin-bottom:6px}
.fold{display:block;width:100%;position:relative;padding:10px 30px 8px 0;border-radius:6px}
.fold .kick{display:block}
.fold .h{display:block;font-size:20px;margin:4px 0 2px}
.fold .gist{display:block;font-size:16px;line-height:1.4;color:var(--soft)}
.fold>.ic{position:absolute;right:0;top:50%;margin-top:-11px;color:var(--soft)}
/* the one sentence that says why this reaches him at all */
.judge{background:var(--wash);border-radius:12px;padding:10px 14px 12px;margin:0 0 12px}
.judge .lab{color:var(--ink);margin-bottom:2px}
.judge p{font-size:19.5px;line-height:1.35;margin:0}
.runin{margin-right:.7em}
.ln .runin{display:block;margin:4px 0 2px}
.ln ol{margin:0 0 4px;padding-left:1.35em}
.said .when{font:13px var(--sans);color:var(--soft);white-space:nowrap}
.q{font-size:19px;line-height:1.4}
/* proof is kept apart from judgement, and says nothing when it has nothing to say */
.proof{margin:2px 0 10px;font:15px/1.45 var(--sans)}
.proof>summary{color:var(--text);font-weight:500}
.proof ol{padding-left:1.3em;margin:0 0 8px}
.proof li{margin-bottom:6px}
.proof li b{font-weight:600}
.notchk{border:1.5px dashed var(--pencil);border-radius:10px;padding:8px 12px;margin:0 0 10px;font:15px/1.45 var(--sans)}
.notchk b{font-weight:600}
.from{border-left:2px solid var(--text);padding:1px 0 1px 14px;margin:2px 0 12px;font:15.5px/1.5 var(--sans)}
.from .lab{display:block;margin-bottom:3px}
.raw{font:13px/1.55 var(--mono);border-left:2px solid var(--faint);padding:1px 0 1px 12px;color:var(--text)}
/* what happens if he leaves it, in words */
.leave{font-size:16px;line-height:1.45;color:var(--soft);margin:12px 0 0}
.leave b{color:var(--text);font-weight:600}
.inkline{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-style:italic;margin:0 0 4px}
.inkline .ic{stroke-width:2.4;margin-top:1px}
.ask{border-left:2.5px solid var(--ink);padding:2px 0 2px 14px;margin:12px 0 0}
.ps{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.opt{min-height:48px;padding:6px 18px;border-radius:999px;border:1.5px solid var(--faint);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font:600 16px/1.2 var(--sans)}
.opt small{font:italic 400 12.5px var(--serif);color:var(--soft)}
.opt.inked{border:2.5px solid var(--ink);color:var(--ink)}
.opt.inked small{color:var(--ink)}
.fork{margin:14px 0 4px;padding-top:10px;border-top:1px solid var(--rule)}
.fork:first-of-type{border-top:0;padding-top:0}
.fork .of{font:600 13px var(--sans);color:var(--soft)}
.fork .q{font-size:17px;margin-bottom:4px}
.built{margin:4px 0 12px;padding:0;list-style:none;border-left:2px solid var(--rule)}
.built li{padding:4px 0 6px 14px;font-size:16px}
.built b{font-weight:600}
details{margin:0 0 10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font:500 15px var(--sans);color:var(--soft);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:7px;height:7px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
details[open]>summary::before{transform:rotate(45deg)}
details ul,details ol{margin:0 0 6px;padding-left:1.3em;font-size:16px}
.foot{border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.end{font-size:22px;line-height:1.35;margin-bottom:4px}
.keys{display:none}
.sayrow{display:flex;gap:8px;margin-top:14px}
.sayrow input{flex:1;min-width:0;min-height:44px;border-radius:999px;border:1.5px solid var(--faint);background:transparent;padding:0 16px;font:16px var(--sans)}
.sayrow input::placeholder{color:var(--soft);opacity:1}

/* ---------- touch the thing where it is wrong ---------- */
.mk{cursor:pointer;border-radius:6px;padding:3px 6px;margin-left:-6px;margin-right:-6px;transition:background .15s;position:relative}
li>.mk{display:block;padding-top:9px;padding-bottom:9px}
.mk:hover,.mk.on{background:var(--wash)}
.mk.cut{text-decoration:line-through;text-decoration-color:var(--ink);text-decoration-thickness:2px;color:var(--soft)}
.mk.noted{box-shadow:inset 3px 0 0 var(--ink);padding-left:12px}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font:italic 16px/1.4 var(--serif);margin:0 0 10px}
.note .ic{width:18px;height:18px;margin-top:2px}
.note .side{margin:-11px 0 -11px auto;font-style:normal;padding:0 0 0 10px}
.note b{font:600 12px/20px var(--sans);font-style:normal;min-width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--onink);text-align:center}
.note.theirs{color:var(--text);font:15px/1.45 var(--sans)}
.note.theirs b{background:var(--text);color:var(--paper)}
.panel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1.5px solid var(--ink);border-radius:18px;padding:10px;margin:4px 0 12px;background:var(--paper)}
.gen{margin:10px 0 0}

/* ---------- the thing itself, in its own colours ---------- */
.peek{display:flex;width:100%;align-items:center;gap:12px;margin:4px 0 12px;padding:12px 14px;border-radius:10px;background:var(--thing);color:#1b1b1b;box-shadow:var(--shadow);font:14px/1.4 var(--sans)}
.peek b{display:block;font-size:15px}
.peek span{color:#57534b}
.peek .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-weight:600;font-size:15px;color:#2340b8}
.thing{position:absolute;inset:0;overflow:auto;background:var(--desk);padding:0 12px}
.tbar{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin:0 -4px}
.thing h3{font:600 22px/1.2 var(--serif);margin:0 4px 2px}
.what{font:13.5px/1.4 var(--sans);color:var(--soft);margin:0 4px 10px}
.thing .judge{margin:0 0 10px}
.obj{--ink:#2340b8;--wash:#e7ebf9;--onink:#fff;--soft:#57534b;--faint:#8b867b;--pencil:#66625a;--rule:#dedad0;--paper:#fff;--paper2:#f4f2ec;--text:#1b1b1b;
  background:var(--thing);color:#1b1b1b;border-radius:10px;padding:14px 11px;box-shadow:var(--shadow);font:15px/1.5 var(--sans)}
html[data-theme=dark] .obj{--rule:#cbc5b6;--paper2:#d9d3c5;--faint:#6f6a60}
.obj.inline{margin:6px 0 12px;padding:14px}
.obj p{margin:0 0 8px}
.tfoot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 4px 14px;margin-top:12px;background:var(--desk);border-top:1px solid var(--rule)}
.seg{display:inline-flex;border:1.5px solid var(--faint);border-radius:999px;padding:2px;margin:0 0 10px;font:600 14px var(--sans)}
.seg button{min-height:44px;padding:0 16px;border-radius:999px;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--paper)}
.file{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--soft)}
.file b{font:600 13.5px var(--mono);color:#1b1b1b}
.csv{width:100%;border-collapse:collapse;table-layout:fixed;font:12.5px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.csv th:nth-child(1){width:13%}.csv th:nth-child(2){width:26%}.csv th:nth-child(3){width:21%}.csv th:nth-child(4){width:19%}.csv th:nth-child(5){width:21%}
.csv th{font-weight:600;text-align:left;color:var(--soft);font-size:12px;padding:10px 3px 6px}
.csv td{padding:0 3px;height:44px;border-top:1px solid var(--rule);vertical-align:middle}
.csv td:first-child{white-space:nowrap;color:var(--soft)}
.csv .r{text-align:right;white-space:nowrap}
.csv tr.mk{display:table-row}
.csv tr.sum td{font-weight:650;font-size:12px;border-top:2px solid #1b1b1b;color:#1b1b1b}
.csv tr.more td{color:var(--soft);font-style:italic}
.csv tr.new td{background:var(--wash)}
.csv tr.aux td{height:auto;border-top:0;padding:0 4px}
.csv tr.cut td{text-decoration:line-through;text-decoration-color:var(--ink);color:var(--soft)}
.mail-h{font-size:13px;color:var(--soft);border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:10px}
.mail-h b{color:#1b1b1b;font-weight:600}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:start;padding:8px 0;border-top:1px solid var(--rule);font-size:14px}
.pair:first-child{border-top:0}
.pair b{font-weight:600}
.figs{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.fig b{display:block;font:600 30px/1.1 var(--serif)}
.fig span{font-size:13px;color:var(--soft)}
.fig.was b{color:var(--soft);font-weight:400;text-decoration:line-through;text-decoration-thickness:1.5px}
.pins{position:relative;cursor:crosshair}
.pindot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--ink);color:var(--onink);font:700 13px/26px var(--sans);text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.9);z-index:2}
.pindot::after{content:"";position:absolute;inset:-9px}
.sk{width:230px;max-width:100%;margin:4px auto 6px;padding:18px 16px 16px;border:1.5px dashed #8b867b;border-radius:26px;text-align:center;font:14px/1.4 var(--sans);color:#3d3a35}
.sk .t{font-size:12px;color:#66625a}
.sk .h{font:600 17px/1.3 var(--sans);margin:10px 0 12px}
.sk .stars{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.sk .stars svg{width:30px;height:30px;fill:none;stroke:#66625a;stroke-width:1.5;stroke-dasharray:3 2}
.sk .box{border:1.5px dashed #8b867b;border-radius:10px;padding:14px 8px;color:#66625a;font-size:13px;margin-bottom:12px}
.sk .go{border:1.5px dashed #3d3a35;border-radius:999px;padding:9px;font-weight:600;margin-bottom:8px}
/* a journey: the real screens, usable; the waits between them are places too */
.strip{display:flex;align-items:center;justify-content:center;gap:0;margin:0 0 12px;font:600 13px var(--sans)}
.strip .st{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;color:var(--soft);flex:none}
.strip .st.seen{border-color:#1b1b1b;color:#1b1b1b}
.strip .st.cur{background:#1b1b1b;color:#fff;border-color:#1b1b1b}
.strip .gap{flex:1;max-width:76px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 11.5px/1.2 var(--sans);color:var(--soft);position:relative}
.strip .gap::before{content:"";position:absolute;left:4px;right:4px;top:50%;border-top:1.5px solid var(--faint)}
.strip .gap span{position:relative;background:var(--thing);padding:0 4px}
.strip .gap.doubt span{border:1.5px dashed var(--pencil);border-radius:999px;padding:1px 7px;color:#1b1b1b}
.strip .gap.marked span{border:2px solid var(--ink);border-radius:999px;padding:1px 7px;color:var(--ink)}
.phn{width:236px;max-width:100%;margin:0 auto;border:2px solid #1b1b1b;border-radius:30px;padding:16px 14px 14px;min-height:330px;display:flex;flex-direction:column;gap:10px;font:14px/1.4 var(--sans);background:#fff;color:#1b1b1b}
.phn .t{font-size:12px;color:#66625a;text-align:center}
.phn .h{font:650 18px/1.25 var(--sans);text-align:center;margin:8px 0 6px}

}

/* ---------- the desk: an open book. Left page, the words. Right page, the thing at its own size. ---------- */

/* ---------- prototype control: not part of the design ---------- */
#proto{position:fixed;left:0;right:0;bottom:0;height:var(--ph);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:9;
  font:12px var(--mono);color:#e9e9e9;background:repeating-linear-gradient(135deg,#26262a 0 10px,#2e2e33 10px 20px);border-top:2px dashed #8d8d96}
#proto .tag{display:none;white-space:nowrap;color:#c9c9d2}
#proto button,#proto select{min-height:36px;min-width:40px;padding:0 8px;border:1px solid #6d6d76;border-radius:4px;background:#17171a;color:#f0f0f0;font:12px var(--mono);text-align:center}
#proto select{flex:1;min-width:0;text-overflow:ellipsis}
#proto :focus-visible{outline:2px solid #fff;outline-offset:1px}
#pnote{position:fixed;left:8px;right:8px;bottom:calc(var(--ph) + 8px);z-index:9;padding:12px 14px;border:2px dashed #8d8d96;border-radius:6px;background:#1c1c20;color:#eee;font:12.5px/1.5 var(--mono);max-width:760px;max-height:60vh;overflow:auto}

@media (min-width:1040px){#proto .tag{display:inline}#proto select{flex:0 1 460px}#pnote{left:auto;right:12px}}

.new.wrap,.new.slip,.new.thing{animation:rise .26s ease-out}
.inkline.new,.note.new,.ask.new,.ps.new,.panel.new{animation:ink .35s ease-out}
.inkline.new .ic path{stroke-dasharray:34;animation:draw .45s ease-out}
@keyframes draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(120,140,220,.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html.still *{animation:none!important;transition:none!important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="pnote" hidden></div>
<nav id="proto" aria-label="Prototype control, not part of the design">
  <span class="tag">PROTOTYPE CONTROL · not the design</span>
  <button id="pv" aria-label="Previous moment">◀</button>
  <select id="pm" aria-label="Moment in the stress week"></select>
  <button id="nx" aria-label="Next moment">next ▶</button>
  <button id="pn" aria-expanded="false" aria-controls="pnote">notes</button>
  <button id="pt" aria-label="Theme">auto</button>
</nav>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isDesk=()=>matchMedia('(min-width:1040px)').matches;
const svg=d=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I={
  tick:svg('<path d="M4 13.5c2.2 1.6 3.6 3.3 5 5.6C11.6 13 15 8.6 20 4.6"/>'),
  mic:svg('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>'),
  x:svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  back:svg('<path d="M14.5 5.5L8 12l6.5 6.5"/>'),
  fwd:svg('<path d="M9.5 5.5L16 12l-6.5 6.5"/>'),
  sheet:svg('<path d="M6 3.5h8.5L18 7v13.5H6zM14.5 3.5V7H18M9 11.5h6M9 15h6"/>'),
  pen:svg('<path d="M4 20l1-4L16.5 4.5l3 3L8 19l-4 1zM14.5 6.5l3 3"/>'),
};
const star='<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 16.9 6.4 20l1.3-6.2L3 9.5l6.3-.7z"/></svg>';

/* ---------- state ---------- */
const S={other:null,m:0,view:'lock',stack:[],sheet:null,cur:null,thing:null,ans:{},marks:{},panel:null,park:null,open:{},theme:'auto',heard:null,listening:false,typing:false,buzz:null,
  revoked:{},goal:{},goalOpen:null,allNow:{},mode:{},step:{},seen:{},width:{},bill:{},wide:false,stopped:false,stopAsk:false,undone:{},said:[],fx:null,top:null,tried:false};

/* ---------- what he has allowed. A default may act only inside one of these, and only on the side that can be undone. ---------- */
const AUTH={
 layout:{t:'On the Billing tool’s pages I choose order, layout and wording, and tell you.',short:'You left this page’s layout to me on 3 November',since:'3 November',till:'in February',goal:'Price page'},
 reports:{t:'Wrong numbers on reports are fixed, and I tell you in the week.',since:'12 October',till:'in January',goal:'Fix wrong totals on the weekly report'},
 wording:{t:'Small wording changes are made, and I tell you in the week. One in five still comes to you.',since:'18 November',when:()=>S.ans.trust&&S.ans.trust.v===0&&M[S.m].k!=='day30'&&M[S.m].k!=='all'},
 tests:{t:'Test repairs are made, and I tell you in the week. One in five still comes to you.',since:'2 December',when:()=>at('day30')<=S.m},
};
const authOK=it=>!!(it.auth&&!S.revoked[it.auth]);

/* ---------- the stress week, moment by moment. He sits at 8:30 and 5:00; the sheet opens at any time. ---------- */
const M=[
 {k:'tue',day:'Tuesday',date:'17 November',time:'8:30',sit:'8:30',seen:'8:28',title:'The morning sitting',ev:'1',sheet:'tue',then:'5:00',
  note:'<b>8:30, a time he set.</b> No sound: the glance becomes the sitting. He sees the whole running order with its minutes before he begins. Each thing opens on the one sentence only he can judge; the proof sits apart and says nothing when it has nothing to report. Leave the price page alone and it goes ahead at 5:00, in words, because he allowed that kind of choice.'},
 {k:'say',day:'Tuesday',date:'17 November',time:'12:40',title:'Saying it on the move',ev:'2',script:'The reminder texts go out too late, people miss their lesson.',then:'5:00',
  note:'<b>He is walking.</b> He holds the button and speaks. No project, no form. Voice is simulated here: press the microphone and it “hears” the scenario’s words.'},
 {k:'early',day:'Tuesday',date:'17 November',time:'2:30',seen:'2:28',title:'Opening it early; a send-back',ev:'4',sheet:'early',then:'5:00',
  note:'<b>Not a sitting time. He opens it anyway.</b> One thing is ready early, so he may take it now instead of at 5:00: a taste loop is not held a day. Open the email, touch a paragraph, pick a margin note or say it. The marks stay with this exact sketch, and come back beside the next one.'},
 {k:'tue5',day:'Tuesday',date:'17 November',time:'5:00',sit:'5:00',seen:'4:58',title:'The afternoon sitting',ev:'9',sheet:'tue5',then:'tomorrow 8:30',
  note:'<b>What “goes ahead at 5:00” meant:</b> at his next sitting time, whether or not he sat. It is told once, on the goal’s own line, with Undo. The second sketch comes back with his three marks beside it.'},
 {k:'wed',day:'Wednesday',date:'18 November',time:'8:30',sit:'8:30',seen:'8:28',title:'A job nobody can look at; trust offered',ev:'10',sheet:'wed',then:'5:00',
  note:'<b>A background job has nothing to judge,</b> so it is told, not asked: what ran is one touch away, and so is Undo, until the day the old storage is deleted. That day cannot be undone and will come to him first. After the third wording change, a P.S.: trust is offered on results that stayed right, keeps one in five, and is never offered for what cannot be undone.'},
 {k:'bad',day:'Thursday',date:'19 November',time:'8:30',sit:'8:30',seen:'8:28',title:'A bad day',ev:'3, 6, 7, 11',sheet:'bad',then:'5:00',
  note:'<b>Three helpers stalled overnight</b> (two recovered unseen, one moved a promise), 17 questions arrived, an accepted result is wrong and another goal was built on it, and today’s release cannot be undone. Fourteen minutes of work for a ten-minute sitting: the sheet says so, takes the three that cost most by waiting, and names what moves to 5:00.'},
 {k:'unseen',day:'Thursday',date:'19 November',time:'9:55',title:'Two goals it cannot see',ev:'–',part:true,then:'5:00',
  note:'<b>Not one of the 14 events.</b> A helper that watches two goals has stopped answering. Silence says exactly that: which two, since when, and what happens next. The other 38 are still vouched for. The phone itself counts the age of what it was told; with nothing fresh for 15 minutes it stops saying “Nothing needs you”.'},
 {k:'buzz',day:'Thursday',date:'19 November',time:'1:10',title:'The one thing that cannot wait',ev:'8',buzz:true,then:'5:00',
  note:'<b>The only sound in the design.</b> All three must hold: only he can do it, it cannot wait for his next sitting, and a named loss follows. Signing in is only signing in: the release he confirmed this morning is pinned, and is not approved again. It is counted against the one who prepares his work, with its cause.'},
 {k:'thu5',day:'Thursday',date:'19 November',time:'5:00',sit:'5:00',seen:'4:58',title:'The rest of the bad day',ev:'5',sheet:'thu5',then:'tomorrow 8:30',
  note:'<b>The two things that were moved here this morning.</b> He parks the ratings sketch until the sign-up work is done, with a latest date. The question about texts is his alone: it waits, and says so.'},
 {k:'week',day:'Friday',date:'20 November',time:'8:30',sit:'8:30',seen:'8:28',title:'The week',ev:'13',sheet:'fri',open:'week',then:'5:00',
  note:'<b>Once a week, on the back of Friday’s sheet.</b> Every line opens in place. Extra times something came back are split into discoveries and misses. The one buzz is counted as a miss.'},
 {k:'away',day:'Tuesday',date:'24 November',time:'11:20',seen:'11:18',title:'Five days away',ev:'12',sheet:'back',
  note:'<b>He has not sat since Friday morning.</b> No reminder. Still one sheet, rewritten in place. Only what he had allowed went ahead; everything else held; nothing new that needs him was started.'},
 {k:'back',day:'Thursday',date:'26 November',time:'8:30',sit:'8:30',seen:'8:28',title:'The return; things that move',ev:'12',sheet:'back',then:'5:00',
  note:'<b>Five days away, one sheet.</b> First what the wait cost, honestly; then what went ahead (each with Undo); then nine things split across three sittings, the costliest first. The sign-up is a journey he can use, then mark, on the exact build the checks ran on. The price page must be seen at both widths before it can be accepted.'},
 {k:'thin',day:'Friday',date:'4 December',time:'5:00',sit:'5:00',seen:'4:58',title:'A week he opened it twice',ev:'–',sheet:'thin',then:'Monday 8:30',
  note:'<b>Not one of the 14 events.</b> Two sittings instead of ten. The sheet does not nag; it slows what starts, says what it held, and asks one thing only he can say: is this the pace now?'},
 {k:'day30',day:'Wednesday',date:'16 December',time:'8:30',sit:'8:30',seen:'8:28',title:'Day 30: a rule used too widely; trust lost',ev:'–',sheet:'day30',then:'5:00',
  note:'<b>Thirty rules by now; he curates none of them.</b> One rule comes to him because it was stretched and something went wrong: where he said it, every time it was used, what was done about it. A grant of trust was lost after one miss: told, not asked. One piece of unshown work comes at random. And the day the old photo storage is deleted has arrived: it cannot be undone, so it pauses for him.'},
 {k:'all',day:'Wednesday',date:'16 December',time:'8:45',title:'Forty goals, and curiosity',ev:'14',open:'all',then:'5:00',
  note:'<b>One level down, never pushed.</b> Forty goals in four projects, each in a fixed place, each showing only when he will next see it. Open a goal for its story, its cost and the way out: pause, change, take back, undo, stop. “Behind this” has who is working where, the record, and a line to a checker.'},
];
const at=k=>M.findIndex(m=>m.k===k);

/* ---------- forty goals, each in its place. A line says only when he will next see it. ---------- */
// [his words, project, {from a moment: 'G:line'}]  M moving · P parked · H held · D done.  "With you" is worked out from the open sheet.
const P4=['Driving app','Billing tool','Shop site','Tools'];
const HELD='H:held: not started while things wait on you';
const G=[
 ['Faster sign-up',0,{tue:'M:Thu',bad:'M:<s>Thu</s> Fri · a computer was off overnight',week:'M:this afternoon',away:'M:ready since Friday',thin:'D:done 26 Nov'}],
 ['Driver ratings',0,{tue:'M:sketch Thu',week:'P:after Faster sign-up, Monday at the latest',back:'M:sketch again at 5:00',thin:'M:11 Dec',day30:'D:done 11 Dec'}],
 ['Move photos to cheaper storage',0,{tue:'M:tomorrow',wed:'D:done Tue · undo until 18 Dec'}],
 ['Reminder texts',0,{say:'M:said at 12:40 · back to you at 5:00',wed:'M:next Wednesday',back:'M:result at 5:00',thin:'D:done 27 Nov'}],
 ['Sign-up error messages, reworded',0,{tue:'M:Wed',bad:'D:done · in Thursday’s release'}],
 ['Thursday’s release',0,{tue:'M:Thu, before it goes',buzz:'M:needs your sign-in before 3:00',thu5:'D:out Thu 3:00 · cannot be undone'}],
 ['Instructors can swap a lesson',0,{tue:'M:next week',thin:'D:done 2 Dec'}],
 ['Show the next lesson on the home screen',0,{tue:'M:27 Nov',thin:'D:done 27 Nov'}],
 ['Lesson notes for parents',0,{tue:'M:early December',away:HELD,day30:'M:January'}],
 ['Fix the map freezing in tunnels',0,{tue:'M:Mon',thin:'D:done 23 Nov'}],
 ['Instructor sign-up checks the licence',0,{tue:'M:early December',away:HELD,day30:'M:this week'}],

const CHIPS={para:['Cut this','Too long','Wrong tone'],row:['This is wrong'],line:['Not what I meant'],pin:['Too small','Hard to find'],gap:['Too slow']};
function panelHTML(o,m){

   ${m&&m.kind==='pin'?`<button class="btn sm plain" data-act="pin-keep">Just here</button><button class="btn sm plain" data-act="unmark">Rub out</button>`:`<button class="btn sm plain" data-act="panel-x">Close</button>`}</span>`;
}
function mk(sc,k,inner,o={}){
  const m=marksOf(sc).find(x=>x.k===k), on=S.panel&&S.panel.sc===sc&&S.panel.k===k, tag=o.tag||'p';
  const at=`class="mk${m?(m.kind==='cut'?' cut':' noted'):''}${on?' on':''}${o.cls?' '+o.cls:''}" tabindex="0" role="button" data-act="mark" data-sc="${sc}" data-k="${k}" data-fid="mk-${sc}-${k}"${o.say?` data-say="${esc(o.say)}"`:''}`;
  const extra=(m&&m.kind==='note'?`<span class="note" data-new="n-${sc}-${k}">${I.pen}<span>${esc(m.text)}</span></span>`:'')+(on?panelHTML(o,m):'');
  if(tag==='tr') return `<tr ${at}>${inner}</tr>`+(extra?`<tr class="aux"><td colspan="5">${extra}</td></tr>`:'');
  if(tag==='li') return `<li><span ${at}>${inner}</span>${extra}</li>`;
  return `<${tag} ${at}>${inner}</${tag}>${extra}`;
}

  if(v&&v!=='lock'&&S.view==='lock'){ if(v==='sheet') act('sheet'); else { S.stack=['lock']; S.view=v; } }
  if(q.get('cur')){ S.cur=q.get('cur'); autoThing(); }
  if(q.get('th')){ const id=q.get('th'), it=itemsOf(sheetOf()).find(x=>x.thing===id); S.thing={id,item:it?it.id:null}; if(it) S.cur=it.id; if(!isDesk()) S.view='sheet'; touchThing(); }
  if(q.get('mode')&&S.thing) S.mode['t:'+S.thing.id]=q.get('mode');
  if(q.get('step')&&S.thing){ S.step['t:'+S.thing.id]=+q.get('step'); S.jr={phone:true,slot:1}; touchThing(); }
  if(q.get('w')&&S.thing){ S.width['t:'+S.thing.id]=q.get('w'); touchThing(); }
  if(q.has('wide')) S.wide=true;
  if(q.has('allnow')) S.allNow.bad=true;
  if(q.get('goal')){ S.goalOpen=q.get('goal'); if(!isDesk()) S.view='goal'; }
  if(q.get('park')) S.park=q.get('park');
  if(q.get('pan')){ const [sc,k]=q.get('pan').split('|'); S.panel={sc,k,gen:k==='gen',gap:k.startsWith('gap')}; }
  if(q.has('note')) $('#pnote').hidden=false; if(q.has('nonote')) $('#pnote').hidden=true;
  if(isDesk()&&S.view==='lock') S.view='sheet';
  render();
})();
</script>
</body>
</html>
