<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The sitting, round 2</title>
<style>
:root{
  --serif:"New York",ui-serif,"Iowan Old Style",Charter,Georgia,serif;
  --sans:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.2,1); --bar:44px;
}
html[data-theme=light]{color-scheme:light;
  --desk:#E8E2D4; --paper:#FBF8F1; --paper2:#F2EDE2; --ink:#1E1C18; --ink2:#55514A; --ink3:#6B675E; --rule:#DCD4C4;
  --blue:#2340A8; --blue-soft:#E4E9FA; --on-blue:#fff; --amber:#8A5300; --amber-soft:#F6E8CB; --red:#A3262A; --red-soft:#F8E0DD;
  --hatch:rgba(138,83,0,.13); --shadow:0 1px 2px rgba(60,45,20,.07),0 10px 30px rgba(60,45,20,.08); --thing-f:none; --lock1:#33463F; --lock2:#121816}
html[data-theme=dark]{color-scheme:dark;
  --desk:#0B0C0D; --paper:#18191C; --paper2:#212226; --ink:#ECE8DF; --ink2:#B7B2A7; --ink3:#9B968B; --rule:#30323A;
  --blue:#A9B8FF; --blue-soft:#232A45; --on-blue:#0C1230; --amber:#E7B566; --amber-soft:#2D2617; --red:#F2958D; --red-soft:#3A2020;
  --hatch:rgba(231,181,102,.14); --shadow:0 0 0 1px #2A2C33; --thing-f:brightness(.92); --lock1:#22302B; --lock2:#08090A}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-top:var(--bar);min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
p{margin:0 0 8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
kbd{display:none;font:600 11px/1 var(--mono);border:1px solid currentColor;border-radius:4px;padding:2px 4px;margin-left:6px;opacity:.65}
@media (hover:hover) and (min-width:1000px){kbd{display:inline-block}}
.serif{font-family:var(--serif)}
.his{font-family:var(--serif);font-style:italic;color:var(--blue)}
.lab{font:600 11.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.small{font-size:14px;color:var(--ink2)}
.still *{animation:none!important;transition:none!important}

/* prototype controls: not part of the design */
#proto{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:90;display:flex;gap:6px;align-items:center;padding:0 8px;font:12px var(--mono);color:#111;
  background:repeating-linear-gradient(-45deg,#e4e4e4 0 7px,#d9d9d9 7px 14px);border-bottom:1px dashed #777}
#proto button,#proto select,#pnote button{height:32px;min-width:34px;border:1px solid #777;border-radius:6px;background:#f7f7f7;color:#111;font:12px var(--mono);padding:0 8px}
#proto select{flex:1;min-width:0}
#pnote{font:12.5px/1.5 var(--mono);color:#111;background:repeating-linear-gradient(-45deg,#e4e4e4 0 7px,#d9d9d9 7px 14px);border-bottom:1px dashed #777;padding:8px 12px}
#pnote p{margin:3px 0 0;max-width:110ch}
html[data-theme=dark] #proto,html[data-theme=dark] #pnote{background:repeating-linear-gradient(-45deg,#2a2a2a 0 7px,#232323 7px 14px);color:#e8e8e8}
html[data-theme=dark] #proto button,html[data-theme=dark] #proto select,html[data-theme=dark] #pnote button{background:#383838;color:#eee}
.ptag span{display:none}
@media (min-width:1000px){.ptag span{display:inline}}
#checkout{position:fixed;inset:var(--bar) 0 0 0;z-index:95;overflow:auto;background:#fff;color:#111;font:12.5px/1.45 var(--mono);padding:14px;white-space:pre-wrap}

/* buttons */
.btn{min-height:50px;padding:0 18px;border-radius:25px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font:600 16px/1.2 var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.warn{background:var(--amber);border-color:var(--amber);color:var(--on-blue)}
html[data-theme=light] .btn.warn{color:#fff}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;padding:0;min-height:44px;color:var(--blue);font:600 15px/1.3 var(--sans);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link.inl{min-height:0;font-size:inherit;font-weight:600}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--rule);background:var(--paper);font:500 15px/1 var(--sans);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

/* lock screen and the cover */
.lockwrap{min-height:calc(100vh - var(--bar));display:flex;justify-content:center}
.lock{flex:1;max-width:520px;background:radial-gradient(120% 70% at 30% 0%,var(--lock1),var(--lock2));color:#F3F0E8;padding:56px 14px 28px;display:flex;flex-direction:column;align-items:center;position:relative}
.lock .ld{font:500 18px var(--sans);opacity:.9}.lock .lt{font:300 84px/1 var(--sans);letter-spacing:-.03em;margin:4px 0 28px}
.card{width:100%;max-width:372px;text-align:left;border:0;border-radius:22px;padding:14px 16px;background:rgba(250,248,242,.9);color:#1d1b17;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:10px;animation:drop .5s var(--ease) both}
.card .t1{font:600 19px/1.25 var(--serif)}
.card .t2{font:400 14.5px/1.4 var(--sans);color:#4a463e;margin-top:3px}
.card .age{font:500 12.5px var(--sans);color:#5e5a52}
.card.blind{background:rgba(246,232,203,.95)}
.card.buzz{border:2px solid #b5651d}
.card .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card .btn{min-height:44px;font-size:15px}
.lockmic{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 14px var(--sans);opacity:.92;background:none;border:0;color:inherit}
.lockmic i{width:66px;height:66px;border-radius:33px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.heardcard{border-left:4px solid #2340A8}
.cover{padding:28px 30px}
.cover h1{font:500 34px/1.15 var(--serif);margin:6px 0 6px}

/* the sheet */
.wrap{max-width:640px;margin:0 auto;min-height:calc(100vh - var(--bar));background:var(--paper)}
.sheet{padding:18px 20px 150px}
.head .lab{display:flex;justify-content:space-between;gap:8px}
.head h1{font:500 29px/1.15 var(--serif);margin:6px 0 4px}
.head .sub{color:var(--ink2);margin:0 0 12px}
.told{margin:4px 0 14px;padding:0;list-style:none}
.told li{padding:7px 0 7px 14px;border-left:3px solid var(--amber);margin-bottom:6px;font-size:15.5px}
.told li.grey{border-left-color:var(--ink3)}
.since{margin:6px 0 14px;padding:12px 14px;border-radius:14px;background:var(--paper2)}
.since p{margin:0 0 6px;font-size:16px}
.order{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.fold{display:grid;grid-template-columns:24px 1fr auto;gap:0 10px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule)}
.fold .n{font:600 14px var(--sans);color:var(--ink3)}
.fold .v{display:block;font:600 11.5px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.fold .v.red{color:var(--red)} .fold .v.amber{color:var(--amber)}
.fold .g{font:500 18px/1.3 var(--serif)}
.fold .m{font:500 13.5px var(--sans);color:var(--ink2)}
.fold .r{grid-column:2/4;font:italic 16px/1.4 var(--serif);color:var(--blue);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fold.done .g{color:var(--ink2)}
.fold.later{opacity:.75}
.splitlab{padding:14px 0 4px;border-bottom:1px solid var(--rule)}
.open{padding:16px 0 18px;border-bottom:1px solid var(--rule);animation:rise .3s var(--ease) both}
.open .kick{display:flex;gap:8px;align-items:baseline}
.open .kick .v{font:600 11.5px/1.4 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--blue)}
.open .kick .v.red{color:var(--red)} .open .kick .v.amber{color:var(--amber)}
.open h2{font:500 27px/1.15 var(--serif);margin:2px 0 6px}
.open h2:focus{outline:none}
.judge{font:500 19px/1.35 var(--serif);margin:6px 0 12px}
.judge .lab{display:block;margin-bottom:2px;color:var(--blue)}
.judge.none{font-size:16.5px;color:var(--ink2)}
.judge.none .lab{color:var(--ink3)}
.line{display:grid;grid-template-columns:84px 1fr;gap:2px 12px;padding:8px 0;border-top:1px solid var(--rule)}
.line .lab{padding-top:4px}
.line ol{margin:0;padding-left:20px}
.fx{cursor:pointer;border-radius:6px}
.fx:hover{background:var(--paper2)}
.fx.marked{text-decoration:line-through;text-decoration-color:var(--blue)}
.ex{font:italic 16px/1.45 var(--serif);color:var(--ink2);padding:8px 12px;border-left:2px solid var(--rule);margin:6px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.opt{min-height:56px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper);text-align:left;font:600 15.5px/1.25 var(--sans)}
.opt .rec{display:block;font:500 12.5px var(--sans);color:var(--ink3);margin-top:2px}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt[aria-pressed=true]::after{content:" ✓";color:var(--blue)}
.why{font-size:15.5px;margin:0 0 6px}
.dflt{font-size:15px;margin:4px 0 0;color:var(--ink2)}
.dflt b{font-weight:650}
.dflt .go{color:var(--blue)} .dflt .wait{color:var(--amber)}
.fork{padding:10px 0 12px;border-top:1px solid var(--rule)}
.fork h3{font:600 17px/1.3 var(--sans);margin:0 0 2px}
.proofline{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:10px 0;min-height:44px;font:500 14.5px/1.35 var(--sans);color:var(--ink2)}
.proofline .ok{color:var(--ink);font-weight:600}
.proofline .un{color:var(--amber);font-weight:600}
.proofline .more{margin-left:auto;color:var(--blue)}
.assumed{font-size:15px;color:var(--ink2);margin:2px 0 6px}
.callout{padding:10px 12px;border-radius:12px;background:var(--paper2);margin:8px 0;font-size:16px}
.callout.red{border-left:3px solid var(--red)} .callout.amber{border-left:3px solid var(--amber)}
.trace{list-style:none;margin:6px 0;padding:0}
.trace li{padding:8px 0 8px 22px;position:relative;border-top:1px dashed var(--rule);font-size:15.5px}
.trace li::before{content:"↳";position:absolute;left:2px;top:7px;color:var(--ink3)}
.receipt{font:italic 16px/1.45 var(--serif);color:var(--blue);padding:10px 0}
.ps{margin:10px 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--blue)}
.ps ul{margin:6px 0;padding-left:20px;font-size:15.5px}
.endnote{padding:28px 0 8px}
.endnote h2{font:500 32px/1.1 var(--serif);margin:0 0 6px}
.endnote .rule{height:2px;width:56px;background:var(--blue);margin-bottom:18px;transform-origin:left;animation:draw .8s var(--ease) both}
.endnote p{margin:0 0 6px}
.say{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,transparent)}
.saybtn{display:flex;align-items:center;gap:10px;width:100%;max-width:600px;min-height:52px;border-radius:26px;border:1.5px solid var(--rule);background:var(--paper);padding:0 8px;text-align:left;font:500 15.5px var(--sans);color:var(--ink2)}
.saybtn i{width:38px;height:38px;border-radius:19px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,transparent);justify-content:center}
.bar .btn{flex:1 1 0;max-width:320px;padding:0 10px}

/* the thing itself, in its own colours */
.thing{position:relative;background:#fff;color:#1d1d1f;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.07);filter:var(--thing-f);overflow:hidden;font-family:var(--sans);margin:8px 0}
html[data-theme=dark] .thing{box-shadow:0 0 0 1px #34363d}
.tag{display:flex;justify-content:space-between;gap:8px;font:500 12px/1.3 var(--sans);color:#55555b;padding:8px 12px;background:#f6f6f3;border-bottom:1px solid #ececec}
.marking .tag{background:#FFF3CF}
.marking [data-b]{cursor:pointer;outline:1.5px dashed rgba(35,64,168,.45);outline-offset:-2px;border-radius:5px}
.pinarea{position:relative}
.marking .pinarea{cursor:crosshair}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:13px;background:#2340A8;color:#fff;font:700 13px/26px var(--sans);text-align:center;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.struck{text-decoration:line-through;text-decoration-color:#2340A8;text-decoration-thickness:2px;color:#777}
.mnote{font:italic 15.5px/1.4 var(--serif);color:#2340A8;padding:2px 10px 8px}
.mnote .pn{font:700 12px var(--sans);font-style:normal;background:#2340A8;color:#fff;border-radius:9px;padding:1px 6px;margin-right:6px}
.markbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:#FFF3CF;color:#3b3020;font:500 14px var(--sans)}
.markbar .chip{min-height:44px;font-size:14px;background:#fff;color:#222;border-color:#d8cfb7}
.markbar .chip[aria-pressed=true]{background:#2340A8;color:#fff;border-color:#2340A8}
.markbar input{flex:1 1 160px;min-height:44px;border:1px solid #d8cfb7;border-radius:10px;padding:0 10px;font:15px var(--sans);background:#fff;color:#222}
.tbl{width:100%;border-collapse:collapse;font:14px/1.35 var(--sans);font-variant-numeric:tabular-nums}
.tbl th{font:600 11.5px var(--sans);color:#55555b;text-align:left;padding:7px 10px;border-bottom:1px solid #e6e6e6}
.tbl td{padding:8px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top}
.tbl .r{text-align:right} .tbl .sub{display:block;font-size:12px;color:#6a6a70}
.tbl tr.gone td{color:#6f6f75} .tbl tr.gone .sub{color:#A3262A;font-weight:600}
.dsk{display:none}
.mail{padding:14px 16px}
.mail .subj{font:650 16.5px/1.3 var(--sans);padding:3px 4px;margin:0 -4px 2px}
.mail .from{font-size:12.5px;color:#6a6a70;margin-bottom:8px}
.mail p{margin:0 -4px 4px;padding:4px;font:15px/1.5 var(--sans)}
.mail .gone{display:none}
.mail .was{font:italic 13.5px/1.4 var(--serif);color:#2340A8;margin:-2px 0 6px;padding:0 4px}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.pcard{padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;border-radius:14px;border:1.5px solid var(--rule);background:var(--paper)}
.pcard .pg{display:block;background:#fff;color:#1d1d1f;padding:14px 12px;border-bottom:1px solid #eee;filter:var(--thing-f)}
.pcard .big{display:block;font:700 21px/1.1 var(--sans)} .pcard .s1{display:block;font:500 13px var(--sans);color:#3d3d42;margin-top:3px}
.pcard .s2{display:block;font:12.5px var(--sans);color:#66666c;margin-top:7px} .pcard .cta{display:block;margin-top:9px;background:#1f6f5c;color:#fff;border-radius:8px;text-align:center;font:600 13px/30px var(--sans)}
.pcard .lb{display:block;padding:9px 12px;font:600 15px/1.25 var(--sans)} .pcard .lb small{display:block;font:500 12.5px var(--sans);color:var(--ink3)}
.pcard[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.phone{width:226px;margin:14px auto;background:#fff;border:7px solid #1d1d1f;border-radius:28px;padding:18px 14px 16px;min-height:330px;position:relative}
.phone h4{font:650 16px/1.3 var(--sans);margin:4px 0 10px}
.phone .stars{font-size:27px;letter-spacing:4px;color:#d39b00;margin-bottom:8px}
.phone .fld{height:34px;border:1px solid #d6d6db;border-radius:9px;margin:0 0 8px;font:13px/32px var(--sans);color:#77777d;padding:0 9px;overflow:hidden;white-space:nowrap}
.phone .cta{background:#1f6f5c;color:#fff;border-radius:10px;text-align:center;font:600 14.5px/40px var(--sans);margin-top:12px}
.phone .muted{font:13px var(--sans);color:#6a6a70;text-align:center;margin-top:10px}
.stage{background:#f3f2ee;padding:4px 0 2px}
.timeline{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-top:1px solid #eee}
.timeline .play{width:44px;height:44px;border-radius:20px;border:0;background:#1d1d1f;color:#fff;font-size:15px;flex:none}
.steps{display:flex;flex:1;gap:4px}
.steps button{flex:1;min-height:44px;border:0;border-radius:8px;background:#eeeeea;font:600 12px/1.15 var(--sans);color:#3d3d42;padding:2px}
.steps button[aria-current=true]{background:#1d1d1f;color:#fff}
.steps button small{display:block;font-weight:500;opacity:.8}
.wbar{display:flex;gap:6px;padding:8px 12px;background:#f6f6f3;border-bottom:1px solid #ececec;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #d3d3d0;border-radius:18px;overflow:hidden}
.seg button{min-height:44px;padding:0 12px;border:0;background:#fff;font:600 13px var(--sans);color:#333}
.seg button[aria-pressed=true]{background:#1d1d1f;color:#fff}
.web{background:#fff;color:#1d1d1f;font-family:var(--sans)}
.web .nav{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #eee;font:700 14px var(--sans)}
.web .hero{padding:16px 14px 6px} .web .hero h5{font:750 22px/1.15 var(--sans);margin:0 0 4px}
.web .hero p{font:13.5px/1.4 var(--sans);color:#55555b;margin:0}
.web .tog{display:inline-flex;margin:10px 14px;border:1px solid #ccc;border-radius:16px;overflow:hidden}
.web .tog span{padding:5px 12px;font:600 12px var(--sans)} .web .tog .on{background:#1f6f5c;color:#fff}
.web .plans{display:grid;gap:10px;padding:0 14px 16px}
.web .plan{border:1px solid #e3e3e3;border-radius:12px;padding:12px}
.web .plan b{display:block;font:750 20px var(--sans)} .web .plan span{font:12.5px var(--sans);color:#55555b}
.web .plan i{display:block;font-style:normal;margin-top:8px;background:#1f6f5c;color:#fff;border-radius:8px;text-align:center;font:600 12.5px/30px var(--sans)}
.web.wd .plans{grid-template-columns:1fr 1fr 1fr} .web.wd .hero h5{font-size:28px}
.frame{border:1px solid #ddd;border-radius:10px;overflow:hidden;margin:10px auto;background:#fff}
.two{display:flex;gap:14px;justify-content:center;align-items:flex-start;padding:10px;background:#f3f2ee;flex-wrap:wrap}
.two .cap{font:600 11.5px var(--sans);color:#55555b;text-align:center;margin-top:4px}
.job{list-style:none;margin:0;padding:10px 12px}
.job li{display:grid;grid-template-columns:66px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;font:14.5px/1.4 var(--sans)}
.job li b{font:600 12.5px var(--sans);color:#55555b}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 12px 12px}
.tiles i{display:block;aspect-ratio:1;border-radius:4px}
.plot{padding:8px 12px 12px}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:16px 12px;background:#f6f6f4}
.ba .l{display:block;font:500 11.5px var(--sans);color:#66666c;margin-bottom:5px}
.uib{display:inline-block;background:#1f6f5c;color:#fff;border-radius:9px;padding:9px 12px;font:600 14.5px/1.2 var(--sans)} .uib.old{background:#e2e2df;color:#4c4c51}
.sms{padding:12px;background:#f6f6f4} .sms .t{font:500 11.5px var(--sans);color:#66666c;text-align:center;margin:2px 0 6px}
.sms .b{background:#e9e9eb;border-radius:16px;padding:8px 12px;max-width:88%;font:14.5px/1.4 var(--sans);margin-bottom:8px}
.act{padding:14px 16px;font:15px/1.45 var(--sans)}
.act .what{font:650 18px/1.35 var(--sans);margin:0 0 10px}
.act ul{margin:0 0 10px;padding-left:18px}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:70;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--paper);border-radius:22px;padding:6px 6px 6px 16px;font:500 14.5px/1.3 var(--sans);width:max-content;max-width:calc(100% - 32px);animation:toast 6s var(--ease) both}

.allow li{padding:8px 0;border-top:1px solid var(--rule);font-size:15.5px;display:flex;justify-content:space-between;gap:10px;list-style:none}
.allow{margin:0;padding:0}

@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}}

  .sheet{padding-bottom:26px}
  .wrap{max-width:760px;background:none}

}
@media (max-width:999px){.desktop{display:none!important}}

/* ============ state ============ */
const S = {m:0, view:'lock', items:[], out:{}, st:{}, cur:0, theme:'auto', note:null, overlay:null, say:null, toast:null, goal:null, from:'stand', marks:false, limit:null};
const $ = (s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isDesk = ()=>matchMedia('(min-width:1000px)').matches;
const st = i=>(S.st[i]=S.st[i]||{picks:{}, marks:{}, pins:[], stage:'main'});
const left = ()=>S.items.map((x,i)=>i).filter(i=>!S.out[i]);
const minsOf = ids=>Math.max(1,Math.round(ids.reduce((a,i)=>a+S.items[i].mins,0)));
const sizeOf = ids=>{ const n = ids.length, m = minsOf(ids); return `${n} thing${n>1?'s':''}, about ${m} minute${m>1?'s':''}`; };
const goalName = it=>it.goal || (it.gid ? GN[it.gid].name : '');
const mic = (z=20)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 1 2 0A8 8 0 0 1 13 19.4V22h-2v-2.6A8 8 0 0 1 4 11.5a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>`;

function load(mi, keep){
  const m = M[mi]; S.m = mi;
  S.items = (m.items||[]).map(k=>Object.assign({key:k}, I[k]));
  S.out = {}; S.st = {}; S.cur = 0; S.overlay = null; S.say = null; S.toast = null; S.marks = false; S.limit = m.split || null;
  S.view = m.view; S.h1 = null; S.signed = false; S.ps = null; S.jt = 0; S.ww = 'phone'; S.wmode = 'use'; S.wprice = 'yearly'; S.v3 = 'new'; S.tried = false;
  if (!keep) render();
}

/* ============ render ============ */
function render(){
  const t = S.theme==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : S.theme;
  document.documentElement.dataset.theme = t;
  proto();
  const v = {lock:rLock, sheet:rSheet, stand:rStand, goal:rGoal, behind:rBehind, allow:rAllow}[S.view];
  $('#app').innerHTML = v() + rOverlay() + (S.toast?`<div class="toast" role="status"><span>${S.toast.t}</span>${S.toast.undo!=null?`<button data-act="undo">Undo</button>`:''}</div>`:'');
  S.toast = null;
  if (S.focus){ const f=$(S.focus); if(f) f.focus({preventScroll:true}); S.focus=null; }
}
function proto(){
  const m = M[S.m]; $('#psel').value = String(S.m);
  const open = S.note==null ? isDesk() : S.note;
  const pn = $('#pnote'); pn.hidden = !open; $('#pinfo').setAttribute('aria-expanded', String(open));
  pn.innerHTML = `<b>${m.when} · ${m.title}</b> · ${m.ev}<p>${m.note}</p>${m.alt&&S.view==='lock'?`<button data-act="${m.alt}">Open “Where everything stands” ›</button>`:''}${S.view!=='lock'&&m.view==='lock'?` <button data-act="tolock">Back to his phone ›</button>`:''}`;
}

/* --- the lock screen: the glance, the mic, the one buzz --- */
function glanceCard(m){
  const c = m.card, n = left().length;
  const t1 = (S.view==='lock' && m.items.length && n===0 && !m.card.look) ? 'Nothing needs you now.' : c.t1;
  const t2 = (S.view==='lock' && m.items.length && n===0 && !m.card.look) ? `Next: ${m.next}` : c.t2;
  const cls = m.blind ? 'card blind' : 'card';
  const tap = m.blind ? 'stand' : (m.items.length && !(n===0 && !c.look)) ? 'open' : 'stand';
  return `<button class="${cls}" data-act="${tap}"><div class="age">${c.age}</div><div class="t1">${t1}</div><div class="t2">${t2}</div>${c.look&&n?`<div class="t2" style="color:#2340A8;font-weight:600;margin-top:6px">Look now ›</div>`:''}</button>`;
}
function buzzCard(){
  if (S.signed) return `<div class="card"><div class="t1">Signed in, 13:12.</div><div class="t2">Thursday’s release can go. I count this as my miss: I could have asked in this morning’s sitting. Sign-ins due within 2 days now come in a sitting.</div><div class="acts"><button class="btn" data-act="buzzok">Fine</button></div></div>`;
  return `<div class="card buzz" role="alert"><div class="age" style="color:#8A5300;font-weight:700;letter-spacing:.04em">CAN’T WAIT FOR A SITTING · BEFORE 3 PM</div><div class="t1">Sign in to the app store, so Thursday’s release can go.</div><div class="t2">If not, it goes next Thursday. Not in this morning’s sitting because the store ended your sign-in at noon. First buzz in three weeks.</div><div class="acts"><button class="btn pri" data-act="signin">Sign in now</button><button class="btn" data-act="buzzlater">Let it go next week</button></div></div>`;
}
function rLock(){
  const m = M[S.m];
  const phone = `<div class="lockwrap"><div class="lock" role="region" aria-label="His phone’s lock screen"><div class="ld">${m.day}</div><div class="lt">${m.clock}</div>

  const desk = `<div class="spread desktop"><section class="lpage cover" aria-label="The glance">${coverDesk(m)}</section><section class="rpage" aria-label="Where everything stands"><div data-opt>${standBody(true)}</div></section></div>`;

}
function coverDesk(m){
  const c = m.card, n = left().length;
  return `<div class="lab">${m.day} · ${m.clock} · ${c.age}</div>
   ${m.buzz && S.signed!=='done'?`<div style="margin-top:14px">${buzzCard()}</div>`:`<h1 style="${m.blind?'color:var(--amber)':''}">${c.t1}</h1><p class="small" style="font-size:16px">${c.t2}</p>
   ${m.items.length&&!m.blind?`<div class="bar" style="position:static;padding:10px 0"><button class="btn pri" data-act="open">${c.look?'Look now':'Open'}<kbd>⏎</kbd></button></div>`:''}`}
   <div class="say"><button class="saybtn" data-act="say"><i>${mic()}</i>Say what you want<kbd>S</kbd></button></div>`;
}

/* --- the sheet: one sitting, folded lines and one open thing --- */
function rSheet(){
  const m = M[S.m], n = left(), doneN = Object.keys(S.out).length;
  const lim = S.limit || null;
  const nowIds = n.filter(i=>!lim || i < lim);
  const head = `<header class="head"><div class="lab"><span>${m.day} · ${m.clock}</span><span>${(m.card||{}).age||''}</span></div>
    <h1 id="sh-h" tabindex="-1">${S.h1 || (m.since ? 'Welcome back.' : sizeOf(nowIds))}</h1>
    ${m.since&&!doneN?`<div class="since">${m.since.map(x=>`<p>${x}</p>`).join('')}</div>`:''}
    ${m.told&&!S.toldSeen?`<ul class="told">${m.told.map(([c,t])=>`<li class="${c}">${t}</li>`).join('')}</ul>`:''}</header>`;
  let list = '<ol class="order">', thingHtml = '', bar = '';
  S.items.forEach((it,i)=>{
    if (lim && i===lim) list += `<li class="splitlab"><span class="lab">At 5 pm · about ${minsOf(n.filter(j=>j>=lim))} minutes</span> <button class="link inl" data-act="pullall">Do them now</button></li>`;
    if (S.out[i]) list += `<li class="fold done"><span class="n">✓</span><span><span class="v">${it.verb}</span><span class="g">${goalName(it)}</span></span><span></span><span class="r">${S.out[i].r}${S.out[i].undo!==false?` <button class="link inl" data-act="undo" data-i="${i}">Undo</button>`:''}</span></li>`;
    else if (i===S.cur && n.length && !(lim && i>=lim)){ const b = rItem(it, st(i), i); list += `<li>${b.main}</li>`; thingHtml = b.thing; bar = b.bar; }
    else list += `<li><button class="fold ${lim&&i>=lim?'later':''}" data-act="goto" data-i="${i}" style="width:100%;background:none;border:0;border-bottom:1px solid var(--rule);text-align:left"><span class="n">${i+1}</span><span><span class="v ${it.vcls||''}">${it.verb}</span><span class="g">${goalName(it)}</span></span><span class="m">${it.mins<1?'30 sec':Math.round(it.mins)+' min'}</span></button></li>`;
  });
  list += '</ol>';
  const end = !n.length || (lim && !nowIds.length) ? endNote(m, lim) : '';
  const desk = isDesk();
  const leftHtml = `<div class="sheet">${head}${list}${end}${desk?bar:''}${!n.length||(lim&&!nowIds.length)?`<div class="say"><button class="saybtn" data-act="say"><i>${mic()}</i>Say what you want<kbd>S</kbd></button></div>`:''}</div>`;
  if (desk) return `<div class="spread"><section class="lpage" aria-label="Your sitting">${leftHtml}</section><section class="rpage" aria-label="The thing itself">${thingHtml || `<div data-opt>${standBody(true)}</div>`}</section></div>`;
  return `<div class="wrap">${leftHtml}</div>${bar}`;
}
function endNote(m, lim){
  if (lim) return `<div class="endnote"><div class="rule"></div><h2>That’s this morning’s share.</h2><p>The rest gathers for 5 pm.</p></div>`;
  return `<div class="endnote"><div class="rule"></div><h2>That is all.</h2><p style="font-size:19px" class="serif">Nothing else needs you.</p><p class="small">Next: ${m.next||'tomorrow'} <button class="link inl" data-act="stand">Where everything stands</button></p></div>`;
}

/* each item: main text (left page), the thing (right page on the desk, inline on the phone), and its answers */
function rItem(it, s, i){
  const kick = `<div class="kick"><span class="v ${it.vcls||''}">${it.verb}</span><span class="small">${it.gid?PROJ[GN[it.gid].p]:''}</span></div><h2 id="goal" tabindex="-1">${goalName(it)}</h2>${it.sub?`<p class="small">${it.sub}</p>`:''}`;
  const judge = it.kind==='read' ? '' : it.none ? `<p class="judge none">${it.none}</p>` : `<p class="judge"><span class="lab">Only you can ${it.kind==='act'?'decide':'judge'}</span>${it.judge}</p>`;
  let body = '', bar = '', thing = '';
  if (it.kind==='agree'){
    const dk = isDesk();
    body = (it.fact?`<p class="callout amber">${it.fact}</p>`:'') + (dk?'':`<div class="line"><span class="lab">You said</span><span class="his">“${it.said[1]}” <span class="small" style="font-style:normal">${it.said[0]}</span></span></div>`) + `
      <div class="line"><span class="lab">I heard</span><span>${fx(s,'h',it.heard)}</span></div>
      <div class="line"><span class="lab">Done means</span><span><ol>${it.done.map((d,j)=>`<li>${fx(s,'d'+j,d)}</li>`).join('')}</ol>${it.example&&!dk?`<p class="ex">For example: ${it.example}</p>`:''}</span></div>
      <div class="line"><span class="lab">I’ll decide</span><span>${fx(s,'c',it.decide)}</span></div>
      ${it.only?`<div class="line"><span class="lab">Only you</span><span>${it.only.q}<span class="opts" style="display:grid">${it.only.opts.map((o,j)=>`<button class="opt" data-act="pick" data-c="0" data-o="${j}" aria-pressed="${(s.picks[0]??it.only.rec)===j}">${o}</button>`).join('')}</span><span class="small">Go takes the marked one.</span></span></div>`:''}
      <div class="line"><span class="lab">Next</span><span>${it.next}</span></div>`;
    const nf = Object.keys(s.marks).length;
    bar = barHtml(`<button class="btn pri" data-act="go">${nf?`Go, with ${nf} change${nf>1?'s':''}`:'Go'}<kbd>⏎</kbd></button><button class="btn" data-act="notnow">Not now<kbd>N</kbd></button>`);
    thing = '';
  }
  let pre = '';
  if (it.kind==='look' || it.kind==='act' || it.kind==='rule'){
    if (it.miss) pre += `<p class="callout red">October counted 4 invoices twice: $1,180. Your accountant noticed. The check had listed this case as not tried, and I showed you the file anyway.</p>
      <p class="lab" style="margin-top:10px">Built on it</p><ul class="trace"><li><b>Accountant’s monthly pack</b> used the wrong file. Paused before it was sent; rebuilt from the fixed file.</li><li>Nothing else used it.</li></ul>
      <p class="small">From now on a case not tried holds the showing. Billing files are shown to you again until 3 stay right.</p>`;
    if (it.kind==='rule') body += `<p>From your answer on 17 November about the price page. I widened it to every amount; that was my guess, not yours. <b>I stopped using it at 07:10.</b></p>`;

    if (it.picks) body += `<p class="small">${it.picks} <button class="link inl" data-act="undo1">Undo any</button></p>`;
    if (it.assumed) body += `<p class="assumed">Assumed: ${it.assumed}</p>`;
    if (it.proof) body += proofLine(it, i);
    if (it.choices) body += it.choices.map((c,ci)=>forkHtml(it,s,c,ci)).join('');
    if (it.ps && S.ps==='show') body += psHtml();
    if (S.marks && S.cur===i){
      const nm = Object.keys(s.marks).length + s.pins.length;

    } else if (it.kind==='act'){

    } else if (it.ps && S.ps==='show'){
      bar = '';
    } else {
      bar = barHtml(`<button class="btn pri" data-act="accept">${it.acceptLabel||'Accept'}<kbd>⏎</kbd></button>${it.chips?`<button class="btn" data-act="mark">Mark<kbd>M</kbd></button>`:''}${it.notnow?`<button class="btn" data-act="notnow">Not now<kbd>N</kbd></button>`:''}`);
    }

  if (it.kind==='decide'){

    if (it.choices.length>1){ const rest = it.choices.filter((c,ci)=>s.picks[ci]==null).length; bar = barHtml(`<button class="btn pri" data-act="decided">${rest?`Done; ${rest} wait${rest>1?'':'s'}`:'Done'}<kbd>⏎</kbd></button><button class="btn" data-act="notnow">Not now<kbd>N</kbd></button>`); }

  if (it.kind==='read'){ body = weekHtml(); bar = barHtml(`<button class="btn pri" data-act="accept">Done<kbd>⏎</kbd></button>`); }
  const desk = isDesk();
  const main = `<article class="open" aria-labelledby="goal">${kick}${judge}${pre}${desk?'':thing}${body}</article>`;
  return {main, thing: desk ? (thing || sideFor(it)) : '', bar};
}
function sideFor(it){
  if (it.kind==='agree') return `<div class="lab">You said</div><p class="his" style="font-size:22px;line-height:1.4">“${it.said[1]}”</p><p class="small">${it.said[0]}</p>${it.example?`<div class="lab" style="margin-top:22px">For example</div><p class="serif" style="font-size:18px">${it.example}</p>`:''}`;

function barHtml(x){ return `<div class="bar">${x}</div>`; }
function fx(s,k,txt){ return `<span class="fx ${s.marks[k]?'marked':''}" data-act="fix" data-k="${k}" role="button" tabindex="0" title="Touch to change">${txt}</span>${s.marks[k]?` <span class="his" style="font-size:15px">${s.marks[k].t||'(say what it should be)'}</span>`:''}`; }
function forkHtml(it,s,c,ci){
  return `<div class="fork">${c.q?`<h3>${c.q}</h3>`:''}<div class="opts" role="group">${c.opts.map((o,j)=>`<button class="opt" data-act="pick" data-c="${ci}" data-o="${j}" aria-pressed="${s.picks[ci]===j}">${o}${j===c.rec?'<span class="rec">I’d say this</span>':''}</button>`).join('')}</div>
    <p class="why">${c.why}</p>${dflt(c.dflt)}</div>`;
}
function dflt(d){

}

  if (o==='park'){ const it = S.items[S.cur];
    return wrap('Not now', `<h2>Not now. Back when…</h2>${(it.park||[{b:'Tomorrow morning',s:'',r:'Parked until tomorrow.'},{b:'Monday',s:'',r:'Parked until Monday.'}]).map((p,j)=>`<button class="orow ${p.rec?'rec':''}" data-act="park" data-o="${j}"><b>${p.b}</b>${p.s?`<span>${p.s}</span>`:''}</button>`).join('')}<p class="small">It comes back by itself. Nothing for you to remember.</p><button class="btn" data-act="close" style="width:100%">Cancel</button>`); }

  if (o==='try') return wrap('Try it on your phone', S.tried ? `<h2>Back from your phone</h2><p class="his">“The password rule shows too late.”</p><p class="small">Marked at 0:14, screen 2, build 4.12. It’s on the recording now.</p><button class="btn pri" data-act="close" style="width:100%">Fine</button>`
     : `<h2>Try it on your phone</h2><p>Opens build 4.12, the one checked, on this phone. A small pencil floats on top: anything you mark comes back here, at the same screen.</p><button class="btn pri" data-act="tried" style="width:100%">Open build 4.12</button><button class="btn" data-act="close" style="width:100%;margin-top:8px">Cancel</button>`);
  if (o==='rule') return wrap('What the rule decided', T.affected() + `<button class="btn" data-act="close" style="width:100%;margin-top:10px">Close</button>`);
  if (o==='say'){ const sy = S.say||{stage:'idle'};
    let inner;
    if (sy.stage==='idle') inner = `<h2>Say what you want</h2><button class="bigmic" data-act="listen" aria-label="Hold to talk">${mic(32)}</button><p class="small" style="text-align:center">Hold and talk. Or type: <input data-in="say" style="min-height:40px;border:1px solid var(--rule);border-radius:10px;padding:0 10px;background:var(--paper);color:var(--ink)" aria-label="Type it"></p>`;
    else if (sy.stage==='listening') inner = `<button class="bigmic on" aria-label="Listening">${mic(32)}</button><p class="heard" aria-live="polite">${sy.shown?`“${esc(sy.shown)}”`:''}</p>`;
    else inner = `<div class="lab">You said</div><p class="heard">“${esc(sy.text)}”</p><p>${sy.reply}</p><button class="btn pri" data-act="sayok" style="width:100%">Fine</button><div class="opts"><button class="opt" data-act="notsaid">That is not what I said</button>${sy.pull?`<button class="opt" data-act="sayback">Say it back now</button>`:'<span></span>'}</div>`;
    return wrap('Say what you want', inner); }

}

    case 'undo': { const j = d.i!=null ? +d.i : S.lastUndo; if (j==null || !S.out[j]) return; delete S.out[j]; S.st[j] = null; delete S.st[j]; if (S.items[j].ps) S.ps = null; S.cur = j; go('sheet', '#goal'); } break;

    case 'goal': S.goal = d.g; go('goal', '.back'); break;
    case 'behind': go('behind', '.back'); break;
    case 'allow': S.from = S.view==='sheet'?'sheet':S.from; go('allow', '.back'); break;
    case 'ctl': toast(d.v); render(); break;
    case 'pauseall': toast('Everything is paused. Nothing starts and nothing ships until you say “carry on”.'); render(); break;
    case 'carry': toast('Started. They gather for your next sittings, at your pace.'); render(); break;
    case 'pullall': S.limit = null; render(); break;
    case 'feel': toast('Noted. Next week’s sittings are sized with it.'); render(); break;
    case 'openrule': S.overlay = 'rule'; render(); break;
    case 'v3': S.v3 = d.v; render(); break;
    case 'play': S.playing = !S.playing; if (S.playing) play(); render(); break;
    case 'jt': S.jt = +d.v; S.playing = false; render(); break;
    case 'try': S.overlay = 'try'; render(); break;
    case 'tried': S.tried = true; st(S.cur).pins.push({x:50,y:46,c:['Too slow here'],t:'The password rule shows too late.',time:'0:14'}); S.jt = 1; render(); break;

  }
}
function play(){ const tick = ()=>{ if (!S.playing) return; S.jt = (S.jt+1)%FRAMES.length; if (S.view==='sheet') render(); if (S.jt===FRAMES.length-1){ S.playing = false; render(); return; } setTimeout(tick, 900); }; setTimeout(tick, 900); }
function listen(){
  const sc = M[S.m].say || {text:'Let customers pay by bank transfer on the shop.', reply:'I have it: the shop’s checkout. What I heard comes back at your next sitting.'};
  const w = sc.text.split(' '); let k = 0; S.say = {stage:'listening', shown:''}; render();
  const tick = ()=>{ if (S.overlay!=='say') return; k++; S.say.shown = w.slice(0,k).join(' '); const h=$('.heard'); if (h) h.textContent = `“${S.say.shown}”`;
    if (k<w.length) setTimeout(tick, 100); else setTimeout(()=>{ if (S.overlay!=='say') return; S.say = {stage:'heard', text:sc.text, reply:sc.reply, pull:sc.pull}; S.focus='.sheetov .btn'; render(); }, 500); };
  setTimeout(tick, 300);
}

document.addEventListener('input', e=>{

document.addEventListener('keydown', e=>{
  const t = e.target;
  if (t.matches && t.matches('input,textarea,select')){ if (e.key==='Escape') t.blur(); if (e.key==='Enter' && t.dataset.in==='say' && t.value.trim()){ S.say = {stage:'heard', text:t.value.trim(), reply:'I have it. What I heard comes back at your next sitting.'}; render(); } return; }
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key===']') return protoAct('next'); if (e.key==='[') return protoAct('prev');
  if ((e.key==='Enter'||e.key===' ') && t.getAttribute && t.getAttribute('role')==='button'){ e.preventDefault(); t.click(); return; }
  if (e.key==='Escape'){ if (S.overlay) return act('close',{}); if (S.marks) return act('unmark',{}); if (S.view!=='lock') return act(S.view==='sheet'?'tolock':'back',{}); }
  if (S.overlay) return;

  if (k==='s'){ e.preventDefault(); return act('say',{}); }

  if (S.view!=='sheet') return;

  if (k==='n' && $('[data-act="notnow"]')) return act('notnow',{});
  if (k==='j'||k==='k'){ const n = S.items.map((x,i)=>i).filter(i=>!S.out[i]); const ix = n.indexOf(S.cur); const to = n[Math.max(0,Math.min(n.length-1, ix+(k==='j'?1:-1)))]; if (to!=null) act('goto',{i:to}); return; }
  if (/^[1-2]$/.test(k)){ const b = $$('.open [data-act="pick"]').find(x=>{ const s = st(S.cur); return s.picks[+x.dataset.c]==null && x.dataset.o===String(+k-1); }) || $$('.open [data-act="pick"]')[+k-1]; if (b) b.click(); }
});
function protoAct(a){

/* ============ #check: walk every moment through the real buttons, count, report ============ */
const PATHSEL = {open:'[data-act="open"]', go:'.bar [data-act="go"]', accept:'.bar [data-act="accept"]', pick0:'.open [data-act="pick"][data-o="0"]', decided:'.bar [data-act="decided"]',
  mark:'.bar [data-act="mark"]', sendback:'.bar [data-act="sendback"]', notnow:'.bar [data-act="notnow"]', park0:'[data-act="park"][data-o="0"]', act:'.bar [data-act="act"]', ps0:'[data-act="ps"][data-o="0"]',
  expand0:'[data-act="expand"][data-v="0"]', stand:'[data-act="stand"]', pullall:'[data-act="pullall"]', say:'.lockmic', listen:'[data-act="listen"]', sayok:'[data-act="sayok"]', signin:'[data-act="signin"]', buzzok:'[data-act="buzzok"]', behind:'[data-act="behind"]'};
function words(el){
  if (!el) return [];
  const c = el.cloneNode(true), box = document.createElement('div');
  box.style.cssText = `position:absolute;left:-20000px;top:0;width:${el.getBoundingClientRect().width||390}px`;
  c.querySelectorAll('kbd,.lockwrap .ld,.lockwrap .lt,.say,.thing .tag,.tbl,.tiles,svg,.proofline .more,[aria-hidden=true],.bar,[data-opt]').forEach(x=>x.remove());
  c.querySelectorAll('.lock,.lockwrap,.fold,.open').forEach(x=>{ x.style.animation='none'; });
  box.appendChild(c); document.body.appendChild(box);
  const lines = c.innerText.split('\n').map(x=>x.trim()).filter(Boolean); box.remove(); return lines;
}
async function runCheck(){
  document.documentElement.classList.add('still');
  const wait = ms=>new Promise(r=>setTimeout(r,ms)), out = [], fails = [];
  let RW = 0, AW = 0, TAPS = 0, DEC = 0, HIS = 0, ACC = 0;
  const desk = isDesk();
  for (let mi=0; mi<M.length; mi++){
    const m = M[mi]; load(mi); await wait(20);
    const seen = new Set(); let rw = 0, taps = 0, dec = 0, his = 0, acc = 0;
    const read = ()=>{ const root = S.view==='lock' ? (desk ? $('.lpage') : $('.lock')) : (desk ? $('.spread') || $('.page') : ($('.wrap')||$('.page'))); words(root).concat(words($('.sheetov'))).forEach(l=>{ if (!seen.has(l)){ seen.add(l); rw += l.split(/\s+/).filter(w=>/[\p{L}\p{N}]/u.test(w)).length; } }); };
    try {
      if (m.view==='lock') read();
      for (const step of m.path){
        let sel = PATHSEL[step];
        if (step.startsWith('pick:')){ const [,c,o] = step.split(':'); sel = `.open [data-act="pick"][data-c="${c}"][data-o="${o}"]`; }
        if (step.startsWith('b:')) sel = `[data-b="${step.slice(2)}"]`;
        if (step.startsWith('c:')) sel = `[data-act="chip"][data-v="${step.slice(2)}"]`;
        if (step.startsWith('goal:')) sel = `[data-act="goal"][data-g="${step.slice(5)}"]`;
        const el = $(sel); if (!el) throw new Error(`${step}: nothing matches ${sel} (view ${S.view})`);
        const cur = S.items[S.cur];
        if (['go','accept','decided','act','park0'].includes(step) && !(step==='accept' && cur && cur.kind==='read') || (step.startsWith('pick') && cur && cur.choices) || step==='ps0' || step==='sendback' || step==='signin'){ dec++; if (cur && cur.dec==='acc') acc++; else his++; }
        if (step==='pick0' && cur && cur.kind==='decide' && cur.choices.length===1){}
        el.click(); taps++; await wait(step.startsWith('pick')||step==='say'?(step==='say'?2800:500):40); read(); if (window.__lines) window.__lines.push(...[...seen].map(l=>`m${mi+1}| ${l}`));
      }
      if (mi===6 && /Nothing needs you/.test($('.lock')?.innerText||$('.lpage')?.innerText||'')) fails.push('m7: says “Nothing needs you” while it cannot see');
    } catch(err){ fails.push(`m${mi+1}: ${err.message}`); }
    // available, not required: proof sheets, where everything stands
    let aw = 0; S.overlay = null;
    out.push(`${String(mi+1).padStart(2)}  ${m.when.padEnd(18)} read ${String(rw).padStart(4)}  taps ${String(taps).padStart(2)}  decisions ${dec} (only his ${his}, acceptances ${acc})  ${m.title}`);
    RW += rw; TAPS += taps; DEC += dec; HIS += his; ACC += acc;
  }
  // optional surfaces: count once
  load(3); act('open',{}); act('stand',{}); const sw = words($('.page')).join(' ').split(/\s+/).length; act('back',{});
  load(0); act('open',{}); act('proof',{i:'1'}); const pw = words($('.sheetov')).join(' ').split(/\s+/).length; act('close',{});
  // side paths
  const side = [];
  try { load(8); act('open',{}); act('mark',{}); $('[data-pin="1"]').dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:200,clientY:300})); side.push('journey pin at '+(st(0).pins[0]||{}).time); act('unmark',{});
    act('try',{}); act('tried',{}); side.push('marks back from the phone: '+st(0).pins.length); act('close',{});
    act('accept',{}); act('wmode',{v:'mark'}); side.push('web mark mode: '+S.marks); act('wmode',{v:'use'}); act('wprice',{v:'monthly'}); side.push('web use mode switches price: '+S.wprice);
    load(0); act('open',{}); act('go',{}); act('undo',{i:'0'}); side.push('undo returns to: '+goalName(S.items[S.cur]));
    load(6); act('stand',{}); side.push('hatched lines while blind: '+$$('.gl.hatch').length);
    load(11); act('open',{}); side.push('return shows now/later split: '+!!$('.splitlab')); act('pullall',{}); side.push('pull early: '+!$('.splitlab'));
    load(13); act('open',{}); side.push('rule shows what it decided: '+!!$('.open .job, .rpage .job'));
    load(14); act('goal',{g:'signup'}); side.push('goal page verbs: '+$$('.verbs .btn').length);
  } catch(err){ fails.push('side: '+err.message); }
  const rep = `CHECK · ${desk?'desk':'phone'} · ${new Date().toTimeString().slice(0,5)}\n\n${out.join('\n')}\n\nWords to read to act: ${RW}\nTaps: ${TAPS}\nDecisions: ${DEC} (only his: ${HIS}; acceptances of what a check had passed: ${ACC})\nAvailable, not required: where everything stands ${sw} words; one proof sheet ${pw} words\n\nSide paths: ${side.join(' · ')}\n\n${fails.length?'FAILURES:\n'+fails.join('\n'):'All moments walked without a failure.'}`;
  const pre = document.createElement('pre'); pre.id = 'checkout'; pre.textContent = rep + (window.__lines ? '\n\nLINES\n' + [...new Set(window.__lines)].join('\n') : ''); document.body.appendChild(pre);
}

/* ============ start ============ */
(function(){
  $('#psel').innerHTML = M.map((m,i)=>`<option value="${i}">${i+1}/${M.length} · ${m.when} · ${m.title}</option>`).join('');
  $('#psel').addEventListener('change', e=>load(+e.target.value));
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('t')) S.theme = q.get('t');
  if (q.has('still')) document.documentElement.classList.add('still');
  if (q.get('n')) S.note = q.get('n')==='1';
  if (q.has('check')){ if (q.get('check')==='lines') window.__lines = []; load(0, true); render(); runCheck(); return; }
  load(+(q.get('m')||1)-1, true);
  if (q.get('v')) S.view = q.get('v');
  if (q.get('i')!=null){ S.view = 'sheet'; S.h1 = M[S.m].since ? 'Welcome back.' : sizeOf(S.items.map((x,j)=>j).filter(j=>!S.limit||j<S.limit)); S.cur = +q.get('i'); for (let j=0;j<S.cur;j++) S.out[j] = {r:S.items[j].rcpt, undo:S.items[j].kind==='act'?false:undefined}; }
  if (q.has('mark')){ S.marks = true; const s = st(S.cur), it = S.items[S.cur]; if (it.demo){ s.marks = JSON.parse(JSON.stringify(it.demo)); S.active = 'p1'; } }
  if (q.has('pins')){ const s = st(S.cur); s.pins.push({x:62,y:40,c:['Too small'],t:'Stars too small for a thumb.',time:''}); S.marks = true; S.active = 'pin0'; }
  if (q.get('st')) st(S.cur).stage = q.get('st');
  if (q.get('ov')){ S.overlay = q.get('ov'); S.proofI = S.cur; if (S.overlay==='say'){ const sc = M[S.m].say; S.say = sc?{stage:'heard',text:sc.text,reply:sc.reply,pull:sc.pull}:{stage:'idle'}; } }
  if (q.get('ww')) S.ww = q.get('ww'); if (q.get('jt')) S.jt = +q.get('jt'); if (q.has('tried')){ S.tried = true; st(S.cur).pins.push({x:50,y:46,c:['Too slow here'],t:'The password rule shows too late.',time:'0:14'}); S.jt = 1; }
  if (q.get('v3')) S.v3 = q.get('v3'); if (q.has('ps')) S.ps = 'show'; if (q.has('signed')) S.signed = true;
  if (q.has('end')){ S.h1 = sizeOf(S.items.map((x,j)=>j)); S.items.forEach((x,j)=>S.out[j] = {r:x.rcpt, undo:x.kind==='act'?false:undefined}); S.view = 'sheet'; S.cur = -1; }
  if (q.has('pull')) S.limit = null;
  if (q.get('g')) S.goal = q.get('g');
  render();
})();
</script>
</body>
