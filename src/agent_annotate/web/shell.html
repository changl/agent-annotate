<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>annotate</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>

<!-- ── Header (version-stable chrome) ──────────────────────────────── -->
<header class="hdr">
  <div class="hdr-left">
    <div class="hdr-title" id="hdr-title">annotate</div>
    <div class="hdr-sub" id="hdr-sub">&nbsp;</div>
    <select class="mobile-version-select" id="mobile-version-select" aria-label="Select version"></select>
  </div>
  <div class="hdr-right">
    <!-- v2.19 owner chip: which agent session published/claimed this page.
         Filled from current.meta.json `owner`; hidden when absent. -->
    <span class="owner-chip" id="owner-chip" style="display:none"></span>
    <span class="author-ind" id="author-ind" title="Identity supplied by OAuth">&nbsp;</span>
    <button class="push-session-btn" id="push-session-btn" title="Send comments to an armed session monitor, or queue them for the next turn">
      <span class="push-session-text"><span class="push-session-icon">&#128238;</span><span class="push-session-label"> Push to session</span></span><span class="push-session-counter" id="push-session-counter">0</span>
    </button>
  </div>
</header>

<!-- ── Main ─────────────────────────────────────────────────────────── -->
<div class="main">

  <!-- Version rail -->
  <aside class="vrail" id="vrail">
    <button type="button" class="rail-strip" id="vrail-strip" aria-expanded="false" aria-controls="vrail-body" aria-label="Expand the versions rail" title="Expand the versions rail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></button>
    <div class="vrail-hdr">Versions
      <button type="button" class="rail-collapse" id="vrail-collapse" aria-expanded="true" aria-controls="vrail-body" aria-label="Collapse the versions rail" title="Collapse the versions rail (more room for the document)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button>
    </div>
    <div class="vrail-body" id="vrail-body">
      <div class="vrail-empty">Loading&hellip;</div>
    </div>
  </aside>

  <!-- Content iframe -->
  <div class="frame-area" id="frame-area">
    <div class="repin-banner" id="repin-banner" style="display:none">
      <span class="repin-banner-txt">Re-pinning &mdash; click the comment's correct location in the document</span>
      <button class="repin-banner-cancel" id="repin-cancel">Cancel (Esc)</button>
    </div>
    <iframe id="content-frame" class="content-frame" title="Document content"></iframe>
  </div>

  <!-- Comment drawer -->
  <aside class="drawer" id="drawer">
    <button type="button" class="rail-strip" id="drawer-strip" aria-expanded="false" aria-controls="drawer-body" aria-label="Expand the feedback rail" title="Expand the feedback rail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m10 15-3-3 3-3"/></svg><span class="rail-strip-badge" id="drawer-strip-unread" style="display:none">0</span></button>
    <div class="drawer-hdr">
      <div class="drawer-hdr-top">
        <span class="drawer-title">Feedback</span>
        <span class="unread-badge" id="unread-badge" style="display:none" title="Comments with activity you haven't seen yet">0 unread</span>
        <span class="cnt-badge" id="cnt-badge">0</span>
        <button type="button" class="rail-collapse" id="drawer-collapse" aria-expanded="true" aria-controls="drawer-body" aria-label="Collapse the feedback rail" title="Collapse the feedback rail (full document width, e.g. for expanded diagrams)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/></svg></button>
      </div>
      <div class="chip-row" id="chip-row">
        <button class="chip chip-review" data-filter="review">Needs my review <span class="chip-n">0</span></button>
        <button class="chip chip-waiting" data-filter="waiting">Waiting on agent <span class="chip-n">0</span></button>
        <button class="chip chip-done" data-filter="done">Done <span class="chip-n">0</span></button>
        <button class="chip chip-all active" data-filter="all">All <span class="chip-n">0</span></button>
      </div>
      <div class="drawer-controls">
        <button class="tgl" id="allversions-toggle" title="Show comments from every version, not just the version being viewed">All versions</button>
        <button class="tgl" id="unreadfirst-toggle" title="Sort unread comments to the top">Unread first</button>
        <button class="tgl tgl-action" id="markallread-btn" title="Mark every comment in the current view as read">Mark all read</button>
      </div>
    </div>
    <div class="drawer-body" id="drawer-body">
      <div class="drawer-empty" id="drawer-empty">
        <div class="drawer-empty-ico">&#x1F4AC;</div>
        <div style="font-weight:600;color:#64748B">No comments yet</div>
        <div>Click any element in the document to add feedback.</div>
      </div>
      <div id="comment-list" style="display:none"></div>
    </div>
    <!-- v2.19 round bar (desktop slot: above the rail footer). On mobile
         shell.js moves the #round-bar node to <body> so it stays visible
         above the closed bottom sheet. Hidden unless the server reports
         capabilities.rounds AND at least one verdict is pending. -->
    <div class="round-bar-slot" id="round-bar-slot">
      <div class="round-bar" id="round-bar" style="display:none" role="status" aria-live="polite">
        <div class="round-bar-txt">
          <span class="round-bar-main" id="round-bar-main">0 of 0 decided</span>
          <span class="round-bar-sub" id="round-bar-sub"></span>
        </div>
        <button type="button" class="round-bar-btn" id="round-finish-btn">Finish review (<span id="round-pending-n">0</span>)</button>
      </div>
    </div>
    <div class="drawer-footer">
      <button class="footer-link" id="general-feedback-toggle">+ General feedback</button>
      <button class="footer-link" id="archived-toggle">Archived (<span id="archived-count">0</span>)</button>
    </div>
    <div class="general-feedback-box" id="general-feedback-box" style="display:none">
      <textarea class="gf-ta" id="gf-ta" placeholder="Feedback not tied to a specific section&hellip;" rows="3"></textarea>
      <div class="gf-ft">
        <button class="btn btn-sec btn-sm" id="gf-cancel">Cancel</button>
        <button class="btn btn-pri btn-sm" id="gf-save">Save</button>
      </div>
    </div>
  </aside>

</div>

<!-- Mobile-only floating action button: opens the feedback bottom sheet.
     Hidden entirely outside the mobile breakpoint (shell.css). -->
<button class="mobile-fab" id="mobile-fab" title="Open feedback" aria-label="Open feedback panel">
  <span class="mobile-fab-icon">&#128172;</span>
  <span class="mobile-fab-count" id="mobile-fab-count">0</span>
  <span class="mobile-fab-badge" id="mobile-fab-badge" style="display:none">0</span>
</button>

<!-- Mobile-only dimming backdrop behind the create-comment / pin popovers
     when they render as bottom sheets. Inert (display:none) outside the
     mobile breakpoint. -->
<div id="mobile-dialog-backdrop"></div>

<!-- Pin popover (reverse lookup: shown when a numbered pin is clicked;
     lists the pin's existing comment(s) and focuses the sidebar card) -->
<div id="pin-popover">
  <div class="pop-hdr">
    <span class="pop-node" id="pinpop-title"></span>
    <span class="pinpop-hdr-actions">
      <button class="btn btn-sec btn-sm" id="pinpop-add" title="Add another comment on this element">+ Comment</button>
      <button class="pop-x" id="pinpop-close" title="Close (Esc)">&times;</button>
    </span>
  </div>
  <div class="pinpop-body" id="pinpop-body"></div>
</div>

<!-- v2.19 round submit confirm (rounds capability only) -->
<div id="round-confirm-backdrop">
  <div id="round-confirm" role="dialog" aria-modal="true" aria-labelledby="round-confirm-title">
    <div class="round-confirm-title" id="round-confirm-title">Finish review</div>
    <div class="round-confirm-sub" id="round-confirm-sub"></div>
    <div class="round-confirm-warn" id="round-confirm-warn" style="display:none"></div>
    <label class="round-confirm-label" for="round-note-ta">Note to the agent (optional)</label>
    <textarea class="round-note-ta" id="round-note-ta" rows="3" placeholder="Anything the agent should know about this round&hellip;"></textarea>
    <div class="round-confirm-ft">
      <button type="button" class="btn btn-sec btn-sm" id="round-cancel-btn">Cancel</button>
      <button type="button" class="btn btn-danger btn-sm" id="round-discard-btn" title="Clear the pending verdicts without sending them as a round (each card keeps its recorded verdict)">Discard pending</button>
      <button type="button" class="btn btn-pri btn-sm" id="round-submit-btn">Submit review</button>
    </div>
  </div>
</div>

<!-- Create-comment popover (shown when an anchor element is clicked in the iframe) -->
<div id="popover">
  <div class="pop-hdr">
    <span class="pop-node" id="pop-node-name"></span>
    <button class="pop-x" id="pop-close" title="Close (Esc)">&times;</button>
  </div>
  <div class="pop-body">
    <textarea class="pop-ta" id="pop-ta" placeholder="Add your feedback, question, or redline note&hellip;" rows="4"></textarea>
  </div>
  <div class="pop-ft">
    <button class="btn btn-sec btn-sm" id="pop-cancel">Cancel</button>
    <button class="btn btn-pri btn-sm" id="pop-save">Save</button>
  </div>
</div>

<script src="shell.js"></script>
</body>
</html>
