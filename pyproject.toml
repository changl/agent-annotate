[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-annotate"
version = "2.19.0"
description = "Local-first interactive annotation and feedback coordination for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Chang Lee" }]
keywords = ["annotation", "coding-agents", "codex", "claude", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = ["platformdirs>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
mcp = ["mcp>=1.0"]
browser = ["playwright>=1.50"]

[project.scripts]
annotate = "agent_annotate.cli:main"

[project.urls]
Homepage = "https://github.com/changl/agent-annotate"
Repository = "https://github.com/changl/agent-annotate"
Issues = "https://github.com/changl/agent-annotate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_annotate = ["web/*", "hooks/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
