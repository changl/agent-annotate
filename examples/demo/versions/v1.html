<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Annotate demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: system-ui, sans-serif; }
    body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    nav { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid #ddd; }
    #canvas-area { flex: 1; min-height: 0; overflow: auto; padding: 20px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .section { min-height: 760px; padding: 20px; margin-bottom: 20px; border: 1px solid #ccc; }
    #er-container { width: 100%; height: 420px; overflow: auto; border: 1px solid #bbb; }
    .er-canvas { position: relative; width: 1800px; height: 800px; }
    .annotate-kind-hub { position: absolute; left: 1320px; top: 440px; width: 220px; padding: 30px; background: #e8f1ff; }
  </style>
</head>
<body>
  <nav>
    <button id="tab-btn-overview" data-tab="overview">Overview</button>
    <button id="tab-btn-diagram" data-tab="diagram">Diagram</button>
  </nav>
  <main id="canvas-area" class="canvas-area">
    <section id="panel-overview" class="tab-panel active" data-panel="overview">
      <div class="section" data-anchor-id="s:overview:introduction">
        <h1>Overview</h1>
        <p>A deliberately tall section for the scroll contract.</p>
      </div>
      <div class="section" data-anchor-id="s:overview:bottom"><h2>Bottom</h2></div>
    </section>
    <section id="panel-diagram" class="tab-panel" data-panel="diagram">
      <button class="er-cluster-jump" data-cluster-jump="hubs">Show hubs in diagram</button>
      <div id="er-container" data-anchor-id="dgm:demo">
        <div class="er-canvas">
          <div class="annotate-kind-hub" id="demo-node" data-anchor-id="dgm:demo:node:one"><h2>Demo hub</h2></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('[data-tab]').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab-panel').forEach((panel) => panel.classList.remove('active'));
        document.querySelector('#panel-' + button.dataset.tab).classList.add('active');
      });
    });
  </script>
</body>
</html>
